<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0b1020" />
<title>Content Factory</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Poppins:wght@600;800&family=Press+Start+2P&display=swap" />
<style>:root {
  --bg: #0b1020;
  --bg2: #121a33;
  --card: #18223f;
  --line: #2a3760;
  --text: #eef1fb;
  --dim: #9aa6c8;
  --amber: #ffb43b;
  --amber2: #ff8f1f;
  --green: #3ddc84;
  --red: #ff5a5f;
  --blue: #5aa9ff;
  --radius: 16px;
  --pixel: "Press Start 2P", ui-monospace, monospace;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 17px; line-height: 1.5; }
body { background: radial-gradient(1200px 600px at 50% -200px, #1b2750 0%, var(--bg) 60%) fixed; min-height: 100vh; }
a.btn { text-decoration: none; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px 80px; }
.pixel { font-family: var(--pixel); letter-spacing: 0.02em; }
h1, h2, h3 { margin: 0 0 12px; line-height: 1.25; }
h1 { font-size: 30px; }
h2 { font-size: 22px; }
.dim { color: var(--dim); }
.small { font-size: 14px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.card { background: var(--card); border: 2px solid var(--line); border-radius: var(--radius); padding: 18px; }

/* nav */
.nav { display: flex; align-items: center; gap: 6px; padding: 16px 20px; max-width: 1100px; margin: 0 auto; flex-wrap: wrap; }
.logo { font-family: var(--pixel); font-size: 13px; color: var(--amber); margin-right: 18px; line-height: 1.6; }
.nav a.link { padding: 10px 16px; border-radius: 12px; color: var(--dim); font-weight: 600; position: relative; }
.nav a.link:hover, .nav a.link.on { background: var(--bg2); color: var(--text); }
.dot { position: absolute; top: 6px; right: 6px; width: 10px; height: 10px; background: var(--red); border-radius: 50%; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 2px solid var(--line); background: var(--bg2); padding: 12px 20px; border-radius: 14px; font-weight: 700; cursor: pointer; min-height: 52px; transition: transform .05s, background .15s; }
.btn:hover { background: #1c2850; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: linear-gradient(180deg, var(--amber), var(--amber2)); color: #1a1000; border-color: #ffcf7a; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { border-color: #6b2a33; color: #ffb3b6; }
.btn.small { min-height: 40px; padding: 8px 14px; font-size: 15px; border-radius: 12px; }
.btn.huge { width: 100%; min-height: 84px; font-family: var(--pixel); font-size: 20px; border-radius: 20px; box-shadow: 0 6px 0 #a35a00; letter-spacing: .04em; }
.btn.huge:active { box-shadow: 0 2px 0 #a35a00; transform: translateY(4px); }

/* inputs */
.input, textarea.input, select.input { width: 100%; background: #0d1430; border: 2px solid var(--line); border-radius: 14px; padding: 14px 16px; outline: none; }
.input:focus { border-color: var(--amber); }
textarea.big { font-size: 22px; min-height: 150px; resize: vertical; line-height: 1.4; }
label.lbl { display: block; font-weight: 700; margin: 0 0 8px; }

/* chips */
.chips { display: flex; gap: 10px; flex-wrap: wrap; }
.chip { border: 2px solid var(--line); background: var(--bg2); border-radius: 999px; padding: 10px 16px; cursor: pointer; font-weight: 600; min-height: 48px; display: inline-flex; align-items: center; gap: 8px; }
.chip.on { border-color: var(--amber); background: #2b2410; color: #ffd890; }

/* banners */
.banner { border-radius: 14px; padding: 12px 16px; border: 2px solid; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.banner.warn { border-color: #6e5414; background: #241c08; color: #ffe0a0; }
.banner.bad { border-color: #6b2a33; background: #2a0f14; color: #ffc9cb; }
.banner.good { border-color: #1f6b44; background: #0c2619; color: #b5f5d0; }

/* workers */
.workers { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.worker { background: var(--bg2); border: 2px solid var(--line); border-radius: 14px; padding: 12px 8px; text-align: center; }
.worker .ico { font-size: 30px; display: block; }
.worker .nm { font-weight: 700; font-size: 15px; }
.worker .st { font-size: 12px; font-family: var(--pixel); margin-top: 6px; }
.st-waiting { color: var(--dim); }
.st-working { color: var(--amber); }
.st-done { color: var(--green); }
.st-error { color: var(--red); }
.worker.working { border-color: var(--amber); animation: pulse 1.2s infinite; }
.worker.error { border-color: var(--red); }
.worker.done { border-color: #1f6b44; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(255,180,59,.15); } }
.worker { min-width: 0; overflow: hidden; }
@media (max-width: 640px) { .workers { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; } .worker { padding: 8px 2px; } .worker .nm { font-size: 10px; } .worker .ico { font-size: 20px; } .worker .st { font-size: 7px; letter-spacing: 0; } }

.bar { height: 14px; background: var(--bg2); border-radius: 999px; overflow: hidden; border: 2px solid var(--line); }
.bar > div { height: 100%; background: linear-gradient(90deg, var(--amber2), var(--amber)); transition: width .5s; }

/* video cards */
.vcard { background: var(--card); border: 2px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; }
.vcard.bad { border-color: #6b2a33; }
.vframe { aspect-ratio: 9/16; background: #05070f; position: relative; display: flex; align-items: center; justify-content: center; }
.vframe video, .vframe img { width: 100%; height: 100%; object-fit: cover; display: block; }
.vbody { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.ministeps { display: flex; gap: 6px; justify-content: center; position: absolute; bottom: 12px; left: 0; right: 0; }
.ministep { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: rgba(18,26,51,.85); border: 2px solid var(--line); font-size: 18px; }
.ministep.working { border-color: var(--amber); animation: pulse 1.2s infinite; }
.ministep.done { border-color: var(--green); }
.ministep.error { border-color: var(--red); }
.badge { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--bg2); border: 1px solid var(--line); color: var(--dim); }
.badge.offline { color: #ffd890; border-color: #6e5414; }

/* modal */
.overlay { position: fixed; inset: 0; background: rgba(3,6,15,.75); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.modal { background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 24px; width: min(640px, 100%); max-height: 90vh; overflow: auto; }

.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: #1d2a52; border: 2px solid var(--line); padding: 14px 20px; border-radius: 14px; z-index: 60; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
.toast.bad { border-color: var(--red); }

details > summary { cursor: pointer; font-weight: 700; color: var(--dim); padding: 10px 0; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "▸ "; }
details[open] > summary::before { content: "▾ "; }
pre.tech { white-space: pre-wrap; word-break: break-word; background: #0a0f22; padding: 12px; border-radius: 10px; font-size: 13px; color: var(--dim); max-height: 240px; overflow: auto; }
.saved { font-size: 13px; color: var(--green); font-weight: 700; }
.empty { text-align: center; padding: 60px 20px; }
.spin { display: inline-block; animation: sp 1s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }

.gen-bar { margin-top: 22px; }
@media (max-width: 640px) {
  .gen-bar { position: sticky; bottom: 0; padding: 12px 0 10px; margin: 22px -20px 0; padding-left: 20px; padding-right: 20px; background: linear-gradient(180deg, rgba(11,16,32,0) 0%, var(--bg) 30%); z-index: 5; }
  .btn.huge { font-size: 16px; min-height: 72px; }
  h1.pixel { font-size: 18px !important; }
}

.btn.tight { flex: 1; min-width: 0; padding: 8px 6px; white-space: nowrap; font-size: 14px; }
</style>
</head>

<script>(() => {
"use strict";
// ============================================================================
// Content Factory — single-file browser edition
// Everything runs in this page: AI calls (with your keys), storage (IndexedDB),
// and video rendering (WebCodecs → MP4). No server, no install.
// ============================================================================
const { html, render, useState, useEffect, useRef, useMemo, useCallback } = window.htmPreact;

// ---------------------------------------------------------------- utilities
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const now = () => new Date().toISOString();
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
async function hash(...parts) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(JSON.stringify(parts)));
  return [...new Uint8Array(buf)].slice(0, 16).map((b) => b.toString(16).padStart(2, "0")).join("");
}
function parseJson(text) {
  const cleaned = String(text).replace(/```(?:json)?/gi, "").trim();
  try {
    return JSON.parse(cleaned);
  } catch {
    const s = cleaned.search(/[\[{]/);
    const e = Math.max(cleaned.lastIndexOf("}"), cleaned.lastIndexOf("]"));
    if (s >= 0 && e > s) return JSON.parse(cleaned.slice(s, e + 1));
    throw new ProviderError("bad_output", "Model did not return JSON: " + cleaned.slice(0, 200), { retryable: true });
  }
}
const money = (n) => (n > 0 && n < 0.01 ? "<$0.01" : `$${(n || 0).toFixed(2)}`);
function ago(iso) {
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
  return new Date(iso).toLocaleDateString();
}
const safeName = (s) => String(s).replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-").slice(0, 60) || "video";

// change bus: UI re-reads after any write
const bus = new EventTarget();
let changeTimer = null;
function changed() {
  clearTimeout(changeTimer);
  changeTimer = setTimeout(() => bus.dispatchEvent(new Event("change")), 60);
}

// ---------------------------------------------------------------- storage (IndexedDB)
const DB_NAME = "content-factory-web";
let dbp = null;
function idb() {
  if (dbp) return dbp;
  dbp = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore("projects", { keyPath: "id" });
      d.createObjectStore("videos", { keyPath: "id" }).createIndex("projectId", "projectId");

class ProviderError extends Error {

async function httpError(res, provider) {
  const body = (await res.text().catch(() => "")).slice(0, 600);
  const b = body.toLowerCase();
  const msg = `${provider} HTTP ${res.status}: ${body}`;
  if (res.status === 401 || res.status === 403) return new ProviderError("auth", msg, { provider });
  if (res.status === 402 || /quota|insufficient|credit|billing|exceeded your/.test(b)) return new ProviderError("quota", msg, { provider });
  if (res.status === 429) return new ProviderError("rate_limit", msg, { provider });
  if (/safety|content_policy|moderation|policy_violation|not allowed|blocked/.test(b)) return new ProviderError("content_blocked", msg, { provider });
  if (res.status === 408 || res.status === 504) return new ProviderError("timeout", msg, { provider });
  if (res.status >= 500) return new ProviderError("network", msg, { provider, retryable: true });
  return new ProviderError("unknown", msg, { provider });
}

  if (/JSON/i.test(m)) return new ProviderError("bad_output", m, { provider, retryable: true });
  return new ProviderError("unknown", m, { provider });
}

function detectFormat(request, formats) {
  const r = " " + request.toLowerCase().replace(/[-_]/g, " ") + " ";
  let best;
  for (const f of formats) {
    const name = f.name.toLowerCase();
    const words = [name, ...(ALIASES[name] || [])];
    const score = Math.max(0, ...words.map((w) => (r.includes(w) ? w.length : 0)));
    if (score > (best?.score || 0)) best = { f, score };

function parseCount(request) {
  const lead = request.match(/^\s*(?:please\s+)?(?:make|create|generate|give me|write|do)\s+(?:me\s+)?(\d{1,2})\b/i);
  const noun = request.match(

  const n = Number(lead?.[1] || noun?.[1] || 1);

function rng(seed) {

const FONT = '"Poppins","Inter",system-ui,-apple-system,"Segoe UI",sans-serif';

// ---- background music, synthesized (no files, no API)
function noiseBuffer(ctx, seconds, color = "brown") {
  const b = ctx.createBuffer(1, Math.ceil(seconds * ctx.sampleRate), ctx.sampleRate);
  const d = b.getChannelData(0);
  let last = 0;
  for (let i = 0; i < d.length; i++) {
    const w = Math.random() * 2 - 1;
    if (color === "brown") {
      last = (last + 0.02 * w) / 1.02;
      d[i] = last * 3.5;
    } else d[i] = w * 0.3;
  }
  return b;
}
async function synthMusic(style, seconds) {
  if (!style || style === "none") return null;
  const ctx = new OfflineAudioContext(2, Math.ceil(seconds * SR), SR);
  const out = ctx.createGain();
  out.connect(ctx.destination);
  const tone = (f, gain, { lfo = 0, depth = 0, type = "sine" } = {}) => {
    const o = ctx.createOscillator();
    o.type = type;
    o.frequency.value = f;
    const g = ctx.createGain();
    g.gain.value = gain;
    if (lfo) {
      const l = ctx.createOscillator();
      l.frequency.value = lfo;
      const lg = ctx.createGain();
      lg.gain.value = gain * depth;
      l.connect(lg).connect(g.gain);
      l.start();
    }
    o.connect(g).connect(out);
    o.start();
  };
  const noise = (gain, cutoff, color) => {
    const s = ctx.createBufferSource();
    s.buffer = noiseBuffer(ctx, seconds, color);
    const f = ctx.createBiquadFilter();
    f.type = "lowpass";
    f.frequency.value = cutoff;
    const g = ctx.createGain();
    g.gain.value = gain;
    s.connect(f).connect(g).connect(out);
    s.start();
  };
  switch (style) {
    case "upbeat-pulse":
      tone(110, 0.5, { lfo: 2, depth: 1 });
      tone(220, 0.1);
      tone(277.18, 0.08);
      tone(329.63, 0.07, { lfo: 4, depth: 0.6 });
      break;
    case "tense-pulse":
      tone(48, 0.6, { lfo: 1.6, depth: 0.9 });
      noise(0.1, 900, "pink");
      break;
    case "dark-drone":
      noise(0.5, 180, "brown");
      tone(55, 0.4, { lfo: 0.15, depth: 0.6 });
      break;
    case "eerie-tone":
      tone(220, 0.1, { lfo: 0.4, depth: 0.4 });
      tone(233, 0.08);
      noise(0.3, 250, "brown");
      break;
    default: // chill-pad
      tone(130.81, 0.2, { lfo: 0.12, depth: 0.3 });
      tone(164.81, 0.15);
      tone(196, 0.13);
      tone(261.63, 0.06, { lfo: 0.2, depth: 0.5 });
  }
  // fades
  out.gain.setValueAtTime(0, 0);
  out.gain.linearRampToValueAtTime(1, 1.5);
  out.gain.setValueAtTime(1, Math.max(1.6, seconds - 2));
  out.gain.linearRampToValueAtTime(0, seconds);
  const buf = await ctx.startRendering();
  // normalize loudness so every style sits at the same level
  let sum = 0;
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i += 7) sum += d[i] * d[i];
  const rms = Math.sqrt(sum / (d.length / 7)) || 1;
  const k = 0.1 / rms;
  for (let c = 0; c < buf.numberOfChannels; c++) {
    const ch = buf.getChannelData(c);
    for (let i = 0; i < ch.length; i++) ch[i] = clamp(ch[i] * k, -0.95, 0.95);
  }
  return buf;
}

async function decodeAudio(blob) {
  const ctx = new OfflineAudioContext(2, 1, SR);
  return ctx.decodeAudioData(await blob.arrayBuffer());
}

/** Mix voice + music into one stereo buffer of the final length. */
async function mixAudio(voiceBuf, musicStyle, total) {
  const ctx = new OfflineAudioContext(2, Math.ceil(total * SR), SR);
  if (voiceBuf) {
    const s = ctx.createBufferSource();
    s.buffer = voiceBuf;
    s.connect(ctx.destination);
    s.start(0);
  }
  const music = await synthMusic(musicStyle, total);
  if (music) {
    const s = ctx.createBufferSource();
    s.buffer = music;
    const g = ctx.createGain();
    g.gain.value = voiceBuf ? 0.3 : 0.9; // louder when there's no narration
    s.connect(g).connect(ctx.destination);
    s.start(0);
  }
  return ctx.startRendering();
}

const CAPTION_STYLES = {
  "bold-yellow": { size: 104, fill: "#ffffff", hi: "#ffe500", stroke: 14, upper: true },
  "clean-white": { size: 88, fill: "#ffffff", hi: "#fff0c8", stroke: 9, upper: false, shadow: true },
  "red-highlight": { size: 100, fill: "#ffffff", hi: "#e61e1e", stroke: 13, upper: true },
  glitch: { size: 96, fill: "#ffffff", hi: "#00ffff", stroke: 6, upper: true, glitch: true },
};
function chunkWords(words) {
  const chunks = [];
  let cur = [];
  for (const w of words) {
    cur.push(w);
    if (cur.length >= 3 || cur.map((c) => c.word).join(" ").length >= 16 || /[.!?,;:—]$/.test(w.word)) {
      chunks.push(cur);
      cur = [];
    }
  }
  if (cur.length) chunks.push(cur);
  return chunks.map((c, i) => ({ words: c, start: c[0].start, end: chunks[i + 1]?.[0]?.start ?? c[c.length - 1].end + 0.3 }));
}
function drawCaption(g, chunks, t, style, bigText) {

  if (!ch) return;
  const words = ch.words.map((w) => (s.upper ? w.word.toUpperCase() : w.word));
  const active = ch.words.findIndex((w, i) => t >= w.start && t < (ch.words[i + 1]?.start ?? ch.end));
  let size = bigText ? s.size * 1.25 : s.size;
  g.font = `800 ${size}px ${FONT}`;
  const full = words.join(" ");
  const maxW = W - 160;
  while (g.measureText(full).width > maxW && size > 48) {
    size -= 4;
    g.font = `800 ${size}px ${FONT}`;
  }
  const pop = clamp((t - ch.start) / 0.08, 0, 1);
  const scale = 0.88 + 0.12 * pop;
  const y = bigText ? H * 0.5 : H * 0.68;
  g.save();
  g.translate(W / 2, y);
  g.scale(scale, scale);
  g.textBaseline = "middle";
  g.lineJoin = "round";
  const space = g.measureText(" ").width;
  const widths = words.map((w) => g.measureText(w).width);
  let x = -(widths.reduce((a, b) => a + b, 0) + space * (words.length - 1)) / 2;
  words.forEach((w, i) => {
    g.textAlign = "left";
    if (s.glitch) {
      g.fillStyle = "rgba(255,0,60,0.7)";
      g.fillText(w, x - 5, 3);
      g.fillStyle = "rgba(0,255,255,0.7)";
      g.fillText(w, x + 5, -3);
    }
    if (s.shadow) {
      g.fillStyle = "rgba(0,0,0,0.55)";
      g.fillText(w, x + 4, 6);
    }
    g.lineWidth = s.stroke;
    g.strokeStyle = "#000";
    g.strokeText(w, x, 0);
    g.fillStyle = i === active ? s.hi : s.fill;
    g.fillText(w, x, 0);
    x += widths[i] + space;
  });
  g.restore();
}

// ---- frames
function drawCover(g, img, k, p) {
  // slow Ken Burns: zoom 1.0→1.1, pan direction alternates per scene
  const base = Math.max(W / img.width, H / img.height);
  const z = base * (1.04 + 0.08 * (k % 2 ? 1 - p : p));
  const w = img.width * z, h = img.height * z;
  const dx = (W - w) * (k % 2 ? p : 1 - p);
  const dy = (H - h) * (k % 3 === 0 ? p : 0.5);
  g.drawImage(img, dx, dy, w, h);
}

/**
 * Render the final MP4. WebCodecs (fast, offline-speed) with H.264 + AAC/Opus.
 * Falls back to real-time MediaRecorder if WebCodecs isn't available.
 */
async function renderVideo({ images, weights, words, captionStyle, voiceBlob, duration, musicStyle, onProgress }) {
  await document.fonts.load(`800 100px Poppins`).catch(() => {});
  const bitmaps = await Promise.all(images.map((b) => createImageBitmap(b)));
  const voiceBuf = voiceBlob ? await decodeAudio(voiceBlob) : null;
  const speech = voiceBuf ? voiceBuf.duration : duration;
  const total = speech + 0.8;
  const wsum = weights.reduce((a, b) => a + b, 0) || 1;
  const durs = weights.map((w) => Math.max(0.8, (w / wsum) * speech));
  durs[durs.length - 1] += total - durs.reduce((a, b) => a + b, 0);
  const starts = durs.map((_, i) => durs.slice(0, i).reduce((a, b) => a + b, 0));
  const chunks = chunkWords(words || []);
  const bigText = !voiceBuf; // text-only videos get larger, centered captions
  const audio = await mixAudio(voiceBuf, musicStyle, total);

  const canvas = typeof OffscreenCanvas !== "undefined" ? new OffscreenCanvas(W, H) : Object.assign(document.createElement("canvas"), { width: W, height: H });
  const g = canvas.getContext("2d");
  const frame = (t) => {
    let k = starts.findIndex((s, i) => t >= s && t < s + durs[i]);
    if (k < 0) k = bitmaps.length - 1;
    g.fillStyle = "#000";
    g.fillRect(0, 0, W, H);
    drawCover(g, bitmaps[k], k, clamp((t - starts[k]) / durs[k], 0, 1));
    if (bigText) {
      g.fillStyle = "rgba(0,0,0,0.25)";
      g.fillRect(0, 0, W, H);
    }
    drawCaption(g, chunks, t, captionStyle, bigText);
    const fade = t < 0.3 ? 1 - t / 0.3 : t > total - 0.5 ? (t - (total - 0.5)) / 0.5 : 0;
    if (fade > 0) {
      g.fillStyle = `rgba(0,0,0,${clamp(fade, 0, 1)})`;
      g.fillRect(0, 0, W, H);
    }
  };

  if (typeof VideoEncoder !== "undefined" && typeof AudioEncoder !== "undefined") {
    try {
      return await encodeWebCodecs({ canvas, frame, total, audio, onProgress });
    } catch (e) {
      console.warn("WebCodecs failed, using real-time recorder", e);
    }
  }
  return encodeRealtime({ source: canvas, frame, total, audio, onProgress });
}

async function pickCodecs() {
  const vOk = async (codec) => (await VideoEncoder.isConfigSupported({ codec, width: W, height: H, bitrate: 4_500_000, framerate: FPS }).catch(() => ({}))).supported;
  const aOk = async (codec) => (await AudioEncoder.isConfigSupported({ codec, sampleRate: SR, numberOfChannels: 2, bitrate: 160000 }).catch(() => ({}))).supported;
  const video = (await vOk("avc1.640028")) ? ["avc1.640028", "avc"] : (await vOk("avc1.42E028")) ? ["avc1.42E028", "avc"] : (await vOk("vp09.00.40.08")) ? ["vp09.00.40.08", "vp9"] : null;
  const audio = (await aOk("mp4a.40.2")) ? ["mp4a.40.2", "aac"] : (await aOk("opus")) ? ["opus", "opus"] : null;
  return { video, audio };
}

async function encodeWebCodecs({ canvas, frame, total, audio, onProgress }) {
  const c = await pickCodecs();
  if (!c.video || !c.audio) throw new Error("No supported codecs");
  const muxer = new Mp4Muxer.Muxer({
    target: new Mp4Muxer.ArrayBufferTarget(),
    video: { codec: c.video[1], width: W, height: H },
    audio: { codec: c.audio[1], sampleRate: SR, numberOfChannels: 2 },
    fastStart: "in-memory",
  });
  let failure = null;
  const ve = new VideoEncoder({ output: (ch, m) => muxer.addVideoChunk(ch, m), error: (e) => (failure = e) });
  ve.configure({ codec: c.video[0], width: W, height: H, bitrate: 4_500_000, framerate: FPS });
  const n = Math.ceil(total * FPS);
  for (let i = 0; i < n; i++) {
    if (failure) throw failure;
    frame(i / FPS);
    const vf = new VideoFrame(canvas, { timestamp: Math.round((i * 1e6) / FPS), duration: Math.round(1e6 / FPS) });
    ve.encode(vf, { keyFrame: i % 60 === 0 });
    vf.close();
    while (ve.encodeQueueSize > 6) await sleep(2);
    if (i % 15 === 0) {
      onProgress?.(i / n);
      await sleep(0); // keep the page responsive
    }
  }
  await ve.flush();
  const ae = new AudioEncoder({ output: (ch, m) => muxer.addAudioChunk(ch, m), error: (e) => (failure = e) });
  ae.configure({ codec: c.audio[0], sampleRate: SR, numberOfChannels: 2, bitrate: 160000 });
  const L = audio.getChannelData(0), R = audio.getChannelData(1);
  for (let s = 0; s < audio.length; s += 1024) {
    const k = Math.min(1024, audio.length - s);
    const d = new Float32Array(k * 2);
    d.set(L.subarray(s, s + k), 0);
    d.set(R.subarray(s, s + k), k);
    ae.encode(new AudioData({ format: "f32-planar", sampleRate: SR, numberOfFrames: k, numberOfChannels: 2, timestamp: Math.round((s * 1e6) / SR), data: d }));
  }
  await ae.flush();
  if (failure) throw failure;
  muxer.finalize();
  onProgress?.(1);
  return { blob: new Blob([muxer.target.buffer], { type: "video/mp4" }), ext: "mp4", codec: `${c.video[1]}+${c.audio[1]}` };
}

/** Fallback for browsers without WebCodecs: plays the video in real time and records it. */
async function encodeRealtime({ source, frame, total, audio, onProgress }) {
  const canvas = Object.assign(document.createElement("canvas"), { width: W, height: H });
  const g2 = canvas.getContext("2d");
  const ac = new AudioContext({ sampleRate: SR });
  const dest = ac.createMediaStreamDestination();
  const src = ac.createBufferSource();
  src.buffer = audio;
  src.connect(dest);
  const stream = new MediaStream([...canvas.captureStream(FPS).getVideoTracks(), ...dest.stream.getAudioTracks()]);
  const type = ["video/mp4;codecs=avc1,mp4a.40.2", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm"].find((t) => MediaRecorder.isTypeSupported(t));
  const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 4_500_000 });
  const parts = [];
  rec.ondataavailable = (e) => e.data.size && parts.push(e.data);
  const done = new Promise((r) => (rec.onstop = r));
  rec.start(500);
  src.start();
  const t0 = ac.currentTime;
  await new Promise((resolve) => {
    const tick = () => {
      const t = ac.currentTime - t0;
      if (t >= total) return resolve();
      frame(t);
      g2.drawImage(source, 0, 0); // copy the rendered frame onto the recorded canvas
      onProgress?.(t / total);
      requestAnimationFrame(tick);
    };
    tick();
  });
  rec.stop();
  await done;
  ac.close();
  const isMp4 = (type || "").includes("mp4");
  return { blob: new Blob(parts, { type: isMp4 ? "video/mp4" : "video/webm" }), ext: isMp4 ? "mp4" : "webm", codec: type };
}

/** Read width/height/duration of a finished video. */
function probeVideo(blob) {
  return new Promise((res, rej) => {
    const v = document.createElement("video");
    v.preload = "metadata";
    v.muted = true;
    const url = URL.createObjectURL(blob);
    v.onloadedmetadata = () => {
      res({ width: v.videoWidth, height: v.videoHeight, duration: v.duration });
      URL.revokeObjectURL(url);
    };
    v.onerror = () => {
      URL.revokeObjectURL(url);
      rej(new Error("This browser can't read the finished video"));
    };
    v.src = url;
  });
}

// ---------------------------------------------------------------- pipeline
const STEPS = ["script", "script_check", "scenes", "voice", "visuals", "music", "captions", "assemble", "final_check"];
const WORKER_STEPS = {
  writer: ["script", "script_check", "scenes"], voice: ["voice"], visuals: ["visuals"], captions: ["captions"], editor: ["music", "assemble", "final_check"],
};
const DOWNSTREAM = {
  script: ["script_check", "scenes", "voice", "visuals", "music", "captions", "assemble", "final_check"],
  script_check: [], scenes: ["visuals", "assemble", "final_check"], voice: ["music", "captions", "assemble", "final_check"],
  visuals: ["assemble", "final_check"], music: ["assemble", "final_check"], captions: ["assemble", "final_check"],
  assemble: ["final_check"], final_check: [],
};
const emptySteps = () => Object.fromEntries(STEPS.map((s) => [s, { status: "waiting", attempts: 0 }]));

async function addCost(projectId, cost) {
  if (cost) await update("projects", projectId, (p) => ({ cost: (p.cost || 0) + cost }));
}

/** Try each provider in order; retry temporary failures with backoff; fall back to the next. */
async function withProviders(cap, ctx, fn) {
  const avoid = [...(ctx.project.avoid || []), ...(ctx.state.avoid || [])];
  const list = chain(cap, avoid);
  if (!list.length) throw new ProviderError("missing_key", `No ${cap} provider available`);
  let last;
  for (const p of list) {
    for (let a = 0; a < 3; a++) {
      try {
        const r = await fn(p);
        down.delete(p.id);
        return { result: r, provider: p };
      } catch (e) {
        last = toProviderError(e, p.id);
        last.provider = last.provider || p.id;
        if (last.retryable && a < 2) {
          await sleep(1500 * 2 ** a);
          continue;
        }
        if (["auth", "quota", "missing_key", "network"].includes(last.code)) down.set(p.id, Date.now() + 5 * 60000);
        break;
      }
    }
  }
  throw last;
}

async function llm(ctx, task, tier, p, input) {
  const key = "cache:" + (await hash("llm", task, tier, p.system, p.prompt, ctx.state.seed || 0));
  const hit = await kv.get(key);
  const avoid = [...(ctx.project.avoid || []), ...(ctx.state.avoid || [])];
  if (hit && !avoid.includes(hit.provider) && providerById(hit.provider)?.available()) return { json: hit.json, provider: hit.provider, cost: 0 };
  const { result, provider } = await withProviders("llm", ctx, async (prov) => {
    const r = await prov.complete({ task, tier, ...p, input });
    return { r, json: parseJson(r.text) };
  });
  await kv.set(key, { json: result.json, provider: provider.id });
  return { json: result.json, provider: provider.id, cost: result.r.cost };
}

function normalizeScript(j) {
  const lines = (Array.isArray(j?.lines) ? j.lines : []).map((l) => String(l).trim()).filter(Boolean);
  if (lines.length < 3) throw new ProviderError("bad_output", "Script came back too short: " + JSON.stringify(j).slice(0, 300), { retryable: true });
  return {
    title: String(j.title || lines[0]).slice(0, 80), hook: lines[0], lines,
    caption: String(j.caption || ""), hashtags: (Array.isArray(j.hashtags) ? j.hashtags : []).map(String).slice(0, 8),
  };
}
function localScriptIssues(s, lengthSec) {
  const issues = [];
  const words = s.lines.join(" ").split(/\s+/).length;
  const target = targetWords(lengthSec);
  if (words < target * 0.7) issues.push(`Too short: ${words} words, need about ${target}.`);
  if (words > target * 1.35) issues.push(`Too long: ${words} words, need about ${target}.`);
  if (/^(hi|hello|hey|welcome to my|today|in this video|so,)/i.test(s.lines[0])) issues.push("Boring intro: start with the hook.");
  if (s.lines[0].split(/\s+/).length > 24) issues.push("Hook is too long. Make line 1 punchier.");
  return issues;
}
const blobKey = (v, name) => `${v.id}:${name}:${Date.now().toString(36)}`;

const STEP_FNS = {
  async script(ctx) {
    const { project: P, video: V } = ctx;
    const p = scriptPrompt({ idea: V.idea, request: P.request, format: P.format, lengthSec: P.lengthSec, language: P.language });
    const r = await llm(ctx, "script", "quality", p, { idea: V.idea, angle: V.angle, request: P.request, format: P.format, lengthSec: P.lengthSec });
    return { output: normalizeScript(r.json), provider: r.provider, cost: r.cost };
  },
  async script_check(ctx) {
    const { project: P, video: V } = ctx;
    const s = V.steps.script.output;
    if (V.steps.script.provider === "edited") return { output: { edited: true, issues: [] } };
    const local = localScriptIssues(s, P.lengthSec);
    const chk = await llm(ctx, "check", "cheap", checkPrompt(s, P.lengthSec), { script: s });
    const sc = chk.json || {};
    const ai = Array.isArray(sc.issues) ? sc.issues.map(String) : [];
    const weak = ["hook", "pacing", "escalation", "ending"].filter((k) => Number(sc[k]) > 0 && Number(sc[k]) < 7);
    if (!local.length && sc.pass !== false && !weak.length) return { output: { scores: sc, issues: [] }, provider: chk.provider, cost: chk.cost };
    const issues = [...local, ...ai].slice(0, 6);
    const rw = await llm(ctx, "rewrite", "quality", rewritePrompt({ script: s, issues, format: P.format, lengthSec: P.lengthSec, language: P.language }), {
      idea: V.idea + " (v2)", angle: V.angle, request: P.request, format: P.format, lengthSec: P.lengthSec,
    });
    await ctx.patchStep("script", { output: normalizeScript(rw.json) });
    return { output: { scores: sc, issues, rewrote: true }, provider: chk.provider, cost: chk.cost + rw.cost };
  },
  async scenes(ctx) {
    const lines = ctx.video.steps.script.output.lines;
    const r = await llm(ctx, "scenes", "cheap", scenesPrompt(lines, ctx.project.format), { lines, format: ctx.project.format });
    const raw = Array.isArray(r.json?.scenes) ? r.json.scenes : [];
    if (!raw.length) throw new ProviderError("bad_output", "No scenes returned", { retryable: true });
    const seen = new Set();
    const out = lines.map((line, i) => {
      const sc = raw[i] || raw[raw.length - 1];
      let visual = String(sc?.visual || line).trim();
      if (seen.has(visual.toLowerCase())) visual += ", different angle and composition";
      seen.add(visual.toLowerCase());
      return { text: line, visual, search: String(sc?.search || line.split(" ").slice(0, 3).join(" ")) };
    });
    return { output: out, provider: r.provider, cost: r.cost };
  },
  async voice(ctx) {
    const text = ctx.video.steps.script.output.lines.join(" ");
    const { result, provider } = await withProviders("voice", ctx, (p) => p.speak({ text, style: ctx.project.format.voiceStyle }));
    if (!result.blob) return { output: { none: true, duration: result.duration }, provider: provider.id, cost: 0 };
    const buf = await decodeAudio(result.blob).catch(() => null);
    if (!buf || buf.duration < 1) throw new ProviderError("bad_output", "Voice audio is empty", { provider: provider.id, retryable: true });
    const key = blobKey(ctx.video, "voice");
    await blobs.put(key, result.blob);
    return { output: { key, duration: buf.duration }, provider: provider.id, cost: result.cost };
  },
  async visuals(ctx) {
    const scenes = ctx.video.steps.scenes.output;
    const done = [...(ctx.state.output?.partial || [])];
    let cost = 0;
    for (let i = done.length; i < scenes.length; i++) {
      const s = scenes[i];
      const { result, provider } = await withProviders("image", ctx, (p) =>
        p.generate({ prompt: s.visual, search: s.search, text: s.text, format: ctx.project.format, avoid: done.map((d) => d.sourceId).filter(Boolean) }),
      );
      const key = blobKey(ctx.video, "scene" + i);
      await blobs.put(key, result.blob);
      cost += result.cost || 0;
      done.push({ key, provider: provider.id, sourceId: result.sourceId });
      await ctx.progress({ partial: done }); // keep finished images if a later one fails
    }
    return { output: { images: done.map((d) => d.key), partial: done }, provider: [...new Set(done.map((d) => d.provider))].join(", "), cost };
  },
  async music(ctx) {
    const style = ctx.project.format.musicStyle;
    if (!style || style === "none") return { output: { none: true }, skipped: true };
    return { output: { style }, provider: "generated" };
  },
  async captions(ctx) {
    const v = ctx.video.steps.voice.output;
    const text = ctx.video.steps.script.output.lines.join(" ");
    const audio = v.key ? await blobs.get(v.key) : null;
    const { result, provider } = await withProviders("captions", ctx, (p) => p.timings({ audio, text, duration: v.duration }));
    return { output: { words: result.words }, provider: provider.id, cost: result.cost };
  },
  async assemble(ctx) {
    const st = ctx.video.steps;
    const images = await Promise.all(st.visuals.output.images.map((k) => blobs.get(k)));
    if (images.some((b) => !b)) throw new ProviderError("missing_asset", "A scene image is missing");
    const voiceBlob = st.voice.output.key ? await blobs.get(st.voice.output.key) : null;
    if (st.voice.output.key && !voiceBlob) throw new ProviderError("missing_asset", "Voice audio is missing");
    try {
      const out = await withRenderLock(() =>
        renderVideo({
          images, weights: st.scenes.output.map((s) => s.text.length + 10),
          words: st.captions.status === "done" ? st.captions.output.words : [],
          captionStyle: ctx.project.format.captionStyle, voiceBlob, duration: st.voice.output.duration,
          musicStyle: st.music.status === "done" ? st.music.output.style : null,
          onProgress: (p) => ctx.setLive({ render: p }),
        }),
      );
      const key = blobKey(ctx.video, "final");
      await blobs.put(key, out.blob);
      return { output: { key, ext: out.ext, codec: out.codec, size: out.blob.size }, provider: "browser" };
    } catch (e) {
      throw new ProviderError("render_failed", e?.message || String(e), { provider: "browser", retryable: false });
    }
  },
  async final_check(ctx) {
    const st = ctx.video.steps;
    const blob = await blobs.get(st.assemble.output.key);
    if (!blob) throw new ProviderError("missing_asset", "Finished video is missing");
    const p = await probeVideo(blob).catch(() => null);
    const speech = st.voice.output.duration;
    const checks = [
      { name: "Vertical 9:16 (1080×1920)", ok: !p || (p.width === 1080 && p.height === 1920) },
      { name: "Length matches the narration", ok: !p || !isFinite(p.duration) || Math.abs(p.duration - (speech + 0.8)) < 2 },
      { name: "All scenes have visuals", ok: st.visuals.output.images.length === st.scenes.output.length },
      { name: "Under 3 minutes", ok: speech < 180 },
      { name: "File isn't empty", ok: blob.size > 10000 },
    ];
    const failed = checks.filter((c) => !c.ok);
    if (failed.length) throw new ProviderError("quality_failed", "Final check failed: " + failed.map((f) => f.name).join(", "));
    return { output: { checks } };
  },
};

// ---------------------------------------------------------------- runner + queue
let renderChain = Promise.resolve();
function withRenderLock(fn) {
  const run = renderChain.then(fn, fn);
  renderChain = run.catch(() => {});
  return run;
}
const live = {}; // videoId -> { render: 0..1 } (not persisted)
const queue = [];
const running = new Set();
const CONCURRENCY = 2;

function enqueue(videoId) {
  if (!queue.includes(videoId) && !running.has(videoId)) queue.push(videoId);
  pump();
}
function pump() {
  while (running.size < CONCURRENCY && queue.length) {
    const id = queue.shift();
    running.add(id);
    runVideo(id)
      .catch((e) => console.error("runVideo crashed", e))
      .finally(() => {
        running.delete(id);
        delete live[id];
        changed();
        pump();
      });
  }
}
const setStep = (id, step, patch) => update("videos", id, (v) => ({ steps: { ...v.steps, [step]: { ...v.steps[step], ...patch, updatedAt: now() } } }));

async function runVideo(id) {
  let video = await db.get("videos", id);
  if (!video) return;
  const project = await db.get("projects", video.projectId);
  if (!project || project.deletedAt) return;
  video = await update("videos", id, { status: "working" });
  for (const step of STEPS) {
    const state = video.steps[step];
    if (state.status === "done" || state.status === "skipped") continue;
    video = await setStep(id, step, { status: "working", attempts: (state.attempts || 0) + 1, error: undefined });
    try {
      const res = await STEP_FNS[step]({
        project, video, state: video.steps[step],
        progress: async (output) => (video = await setStep(id, step, { output })),
        patchStep: async (s, patch) => (video = await setStep(id, s, patch)),
        setLive: (o) => {
          live[id] = { ...live[id], ...o };
          bus.dispatchEvent(new Event("live"));
        },
      });
      video = await setStep(id, step, { status: res.skipped ? "skipped" : "done", output: res.output, provider: res.provider, error: undefined });
      if (step === "script") video = await update("videos", id, { title: res.output.title });
      await addCost(project.id, res.cost);
      await resolveErrors((e) => e.videoId === id && e.step === step);
    } catch (e) {
      const fe = friendly(e, step);
      await setStep(id, step, { status: "error", error: fe });
      await update("videos", id, { status: "needs_attention" });
      await logError(project.id, id, step, fe);
      await refreshProject(project.id);
      return;
    }
  }
  await update("videos", id, { status: "done" });
  await refreshProject(project.id);
}

async function refreshProject(projectId) {
  const vs = await db.byIndex("videos", "projectId", projectId);
  if (!vs.length) return;
  const status = vs.some((v) => v.status === "queued" || v.status === "working") ? "generating" : vs.some((v) => v.status === "needs_attention") ? "needs_attention" : "done";
  await update("projects", projectId, { status });
}

/** On page load: pick up anything that was interrupted (tab closed, reload, crash). */
async function resumeAll() {
  const vs = (await db.all("videos")).sort((a, b) => (a.createdAt < b.createdAt ? -1 : 1));
  for (const v of vs) {
    if (v.status !== "queued" && v.status !== "working") continue;
    const p = await db.get("projects", v.projectId);
    if (!p || p.deletedAt) continue;
    const steps = Object.fromEntries(Object.entries(v.steps).map(([k, s]) => [k, s.status === "working" ? { ...s, status: "waiting" } : s]));
    await db.put("videos", { ...v, steps, status: "queued" });
    enqueue(v.id);
  }
  for (const p of await db.all("projects")) if (p.status === "planning" && !p.deletedAt && !p.ideaError) planIdeas(p.id);
}

// ---------------------------------------------------------------- projects
async function createProject({ request, formatId, count, lengthSec, language }) {
  request = request.trim().slice(0, 2000);
  if (!request) throw new Error("Type what you want to make first ✍️");
  const formats = await listFormats();
  const format = (formatId && formatId !== "auto" && formats.find((f) => f.id === formatId)) || detectFormat(request, formats);
  const n = count && count > 0 ? Math.min(50, count) : parseCount(request);
  const p = {
    id: uid(), title: request.replace(/^(please\s+)?(make|create|generate)\s+(me\s+)?/i, "").slice(0, 70), request,
    format: { ...format }, count: n, lengthSec: lengthSec || format.lengthSec, language: language || "English",
    status: "planning", ideas: [], avoid: [], cost: 0, deletedAt: null, createdAt: now(), updatedAt: now(),
  };
  await db.put("projects", p);
  if (n === 1) await createVideos(p, [{ title: p.title, angle: request }]);
  else planIdeas(p.id);
  return p;
}

async function planIdeas(projectId) {
  const p = await db.get("projects", projectId);
  if (!p || (await db.byIndex("videos", "projectId", projectId)).length) return;
  let ideas = [];
  const pr = ideasPrompt(p.request, p.format, p.count);
  let lastErr;
  for (const prov of chain("llm", p.avoid || [])) {
    try {
      const r = await prov.complete({ task: "ideas", tier: "cheap", ...pr, input: { request: p.request, count: p.count, format: p.format } });
      const j = parseJson(r.text);
      ideas = (Array.isArray(j.ideas) ? j.ideas : []).map((x) => ({ title: String(x.title || "").slice(0, 80), angle: String(x.angle || x.title || "") })).filter((x) => x.angle);
      await addCost(projectId, r.cost);
      if (ideas.length) break;
    } catch (e) {
      lastErr = toProviderError(e, prov.id);
      lastErr.provider = lastErr.provider || prov.id;
      if (["auth", "quota", "network"].includes(lastErr.code)) down.set(prov.id, Date.now() + 5 * 60000);
    }
  }
  if (!ideas.length) {
    const fe = friendly(lastErr || new Error("No ideas returned"), "ideas");
    await update("projects", projectId, { status: "needs_attention", ideaError: fe });
    await logError(projectId, null, "ideas", fe);
    return;
  }
  while (ideas.length < p.count) ideas.push({ ...ideas[ideas.length % ideas.length], title: `${ideas[0].title} #${ideas.length + 1}` });
  ideas = ideas.slice(0, p.count);
  await update("projects", projectId, { ideas, ideaError: null });
  await resolveErrors((e) => e.projectId === projectId && e.step === "ideas");
  await createVideos(p, ideas);
}

async function createVideos(p, ideas, startIndex = 0) {
  const t = Date.now();
  for (const [i, idea] of ideas.entries()) {
    const v = {
      id: uid(), projectId: p.id, index: startIndex + i, title: idea.title || `Video ${startIndex + i + 1}`,
      idea: `${idea.title}. ${idea.angle}`.trim(), angle: idea.angle, status: "queued", steps: emptySteps(),
      createdAt: new Date(t + i).toISOString(), updatedAt: now(),
    };
    await db.put("videos", v);
    enqueue(v.id);
  }
  await update("projects", p.id, { status: "generating" });
}

function resetSteps(v, steps, bump) {
  const next = { ...v.steps };
  for (const s of steps) next[s] = { status: "waiting", attempts: 0, seed: bump ? (v.steps[s].seed || 0) + 1 : v.steps[s].seed };
  return next;
}

async function videoAction(id, action, step) {
  const v = await db.get("videos", id);
  const p = await db.get("projects", v.projectId);
  if (step && step !== "all" && v.steps[step]?.status === "working") throw new Error("That part is still working.");
  if (action === "regenerate") {
    const list = step === "all" || !step ? STEPS : [step, ...DOWNSTREAM[step]];
    await update("videos", id, (c) => ({ status: "queued", steps: resetSteps(c, list, true) }));
  } else {
    const target = step && step !== "all" ? step : STEPS.find((k) => v.steps[k].status === "error");
    if (!target) throw new Error("Nothing to fix here.");
    const cur = v.steps[target];
    if (action === "backup") {
      // stop using the failed provider for this whole project, re-queue every video stuck on it
      const bad = cur.error?.provider || cur.provider;
      if (bad) await update("projects", p.id, (x) => ({ avoid: [...new Set([...(x.avoid || []), ...bad.split(", ")])] }));
      for (const x of await db.byIndex("videos", "projectId", p.id)) {
        const stuck = STEPS.filter((k) => x.steps[k].status === "error" && (x.steps[k].error?.provider === bad || (x.id === id && k === target)));
        if (!stuck.length) continue;
        await update("videos", x.id, (c) => {
          const steps = { ...c.steps };
          for (const k of stuck) steps[k] = { ...steps[k], status: "waiting", error: undefined };
          return { status: "queued", steps };
        });
        enqueue(x.id);
      }
      await update("projects", p.id, { status: "generating" });
      return;
    }
    if (action === "skip" && cur.status === "error" && !cur.error?.canSkip) throw new Error("This part can't be skipped.");
    await update("videos", id, (c) => ({
      status: "queued",
      steps: { ...c.steps, [target]: { ...c.steps[target], status: action === "skip" ? "skipped" : "waiting", error: undefined } },
    }));
  }
  enqueue(id);
  await update("projects", p.id, { status: "generating" });
}

async function editScript(id, { title, lines, caption }) {
  const v = await db.get("videos", id);
  lines = lines.map((l) => l.trim()).filter(Boolean);
  if (lines.length < 2) throw new Error("A script needs at least 2 lines.");
  const old = v.steps.script.output;
  const script = { title: title?.trim() || old?.title || lines[0], hook: lines[0], lines, caption: caption ?? old?.caption ?? "", hashtags: old?.hashtags || [] };
  const same = old && old.lines.length === lines.length && v.steps.scenes.status === "done";
  const redo = same ? ["voice", "music", "captions", "assemble", "final_check"] : ["scenes", "voice", "visuals", "music", "captions", "assemble", "final_check"];
  await update("videos", id, (c) => {
    const steps = resetSteps(c, redo, false);
    steps.script = { ...c.steps.script, status: "done", provider: "edited", output: script, error: undefined };
    steps.script_check = { status: "done", attempts: 0, output: { edited: true, issues: [] } };
    if (same) steps.scenes = { ...c.steps.scenes, output: c.steps.scenes.output.map((s, i) => ({ ...s, text: lines[i] })) };
    return { title: script.title, status: "queued", steps };
  });
  enqueue(id);
  await update("projects", v.projectId, { status: "generating" });
}

async function duplicateVideo(id) {
  const v = await db.get("videos", id);
  const sib = await db.byIndex("videos", "projectId", v.projectId);
  const copy = { ...structuredClone(v), id: uid(), index: Math.max(...sib.map((s) => s.index)) + 1, title: `${v.title} (copy)`, createdAt: now(), updatedAt: now() };
  if (copy.status !== "done") {
    copy.status = "queued";
    for (const s of Object.values(copy.steps)) if (s.status === "working") s.status = "waiting";
  }
  await db.put("videos", copy);
  if (copy.status !== "done") enqueue(copy.id);
}

async function addVideos(projectId, n) {
  const p = await db.get("projects", projectId);
  const base = (await db.byIndex("videos", "projectId", projectId)).length;
  await createVideos(p, Array.from({ length: n }, (_, i) => ({ title: `${p.title} #${base + i + 1}`, angle: `${p.request} (fresh angle #${base + i + 1})` })), base);
}

async function retryIdeas(projectId, backup) {
  await update("projects", projectId, (p) => ({
    status: "planning", ideaError: null,
    avoid: backup && p.ideaError?.provider ? [...new Set([...(p.avoid || []), p.ideaError.provider])] : p.avoid,
  }));
  planIdeas(projectId);
}

/** Permanently delete trashed projects and their videos/files (frees browser storage). */
async function emptyTrash() {
  for (const p of await db.all("projects")) {
    if (!p.deletedAt) continue;
    for (const v of await db.byIndex("videos", "projectId", p.id)) {
      for (const k of videoBlobKeys(v)) await blobs.del(k);
      await db.del("videos", v.id);
    }
    await db.del("projects", p.id);
  }
}
function videoBlobKeys(v) {
  const s = v.steps;
  return [s.voice.output?.key, ...(s.visuals.output?.partial || []).map((x) => x.key), s.assemble.output?.key].filter(Boolean);
}

let toastFn = () => {};
let confirmFn = async () => false;
const toast = (m, bad) => toastFn(m, bad);
const confirmBox = (o) => confirmFn(o);

/** Re-run a loader whenever stored data changes. */
function useData(loader, deps = []) {
  const [data, setData] = useState(null);
  useEffect(() => {
    let alive = true;
    const load = () => loader().then((d) => alive && setData(d)).catch((e) => console.error(e));
    load();
    bus.addEventListener("change", load);
    return () => {
      alive = false;
      bus.removeEventListener("change", load);
    };
  }, deps);
  return data;
}
function useLive() {
  const [, set] = useState(0);
  useEffect(() => {
    const f = () => set((x) => x + 1);
    bus.addEventListener("live", f);
    return () => bus.removeEventListener("live", f);
  }, []);
}
function useBlobUrl(key) {
  const [url, setUrl] = useState(null);
  useEffect(() => {
    let u = null, alive = true;
    if (key)
      blobs.get(key).then((b) => {
        if (b && alive) setUrl((u = URL.createObjectURL(b)));
      });
    return () => {
      alive = false;
      if (u) URL.revokeObjectURL(u);
    };
  }, [key]);
  return url;
}
function go(hash) {
  location.hash = hash;
}
async function downloadBlob(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}
async function copy(text, msg) {
  try {
    await navigator.clipboard.writeText(text);
    toast(msg || "Copied 📋");
  } catch {
    toast("Couldn't copy. Your browser blocked it.", true);
  }
}
function chime(good) {
  try {
    const ctx = new AudioContext();
    (good ? [660, 880] : [440, 330]).forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f;
      const t = ctx.currentTime + i * 0.18;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.2, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      o.connect(g).connect(ctx.destination);
      o.start(t);
      o.stop(t + 0.4);
    });
  } catch {}
}
function Modal({ onClose, children }) {
  return html`<div class="overlay" onClick=${onClose}><div class="modal" onClick=${(e) => e.stopPropagation()}>${children}</div></div>`;
}

  if (!data) return html`<div class="empty dim">Loading…</div>`;
  const { project: p, videos } = data;
  if (!p) return html`<div class="empty"><h2>This project doesn't exist anymore</h2><a href="#projects" class="btn">← All projects</a></div>`;
  const total = videos.length * STEPS.length || 1;
  const fin = videos.reduce((n, v) => n + STEPS.filter((s) => ["done", "skipped"].includes(v.steps[s].status)).length, 0);
  const pct = Math.round((fin / total) * 100);
  const doneV = videos.filter((v) => v.status === "done");
  const problems = videos.filter((v) => v.status === "needs_attention").length;
  const elapsed = (Date.now() - Date.parse(p.createdAt)) / 1000;
  const left = pct >= 8 && pct < 100 ? Math.max(1, Math.round((elapsed * (100 - pct)) / pct / 60)) : null;

  async function downloadAll() {
    toast("Packing the ZIP…");
    const files = {};
    let captions = `${p.title}\n${"=".repeat(p.title.length)}\n\n`;
    for (const [i, v] of doneV.entries()) {
      const n = String(i + 1).padStart(2, "0");
      const b = await blobs.get(v.steps.assemble.output.key);
      if (b) files[`${n}-${safeName(v.title)}.${v.steps.assemble.output.ext || "mp4"}`] = [new Uint8Array(await b.arrayBuffer()), { level: 0 }];
      const s = v.steps.script.output;
      captions += `${n}. ${v.title}\n${s?.caption || ""}\n${(s?.hashtags || []).join(" ")}\n\n`;
    }
    files["captions.txt"] = fflate.strToU8(captions);
    downloadBlob(new Blob([fflate.zipSync(files)], { type: "application/zip" }), safeName(p.title) + ".zip");
  }
  const copyAll = () =>
    copy(doneV.map((v, i) => `${i + 1}. ${v.title}\n${v.steps.script.output?.caption || ""}\n${(v.steps.script.output?.hashtags || []).join(" ")}`).join("\n\n"), `Copied ${doneV.length} caption${doneV.length > 1 ? "s" : ""} 📋`);

  return html`<div>
    <div style="margin-top:16px">
      <div class="row" style="gap:8px;margin-bottom:6px">
        <span class="badge">${p.format.emoji} ${p.format.name}</span><span class="saved">✓ Saved automatically</span>
        ${p.cost > 0 && html`<span class="badge">Cost so far ${money(p.cost)}</span>`}
        ${p.deletedAt && html`<span class="badge" style="color:var(--red)">In trash</span>`}
      </div>
      <h1 style="font-size:26px">${p.title}</h1>
      <p class="dim small" style="margin:0">“${p.request}”</p>
    </div>
    ${p.deletedAt && html`<div class="banner warn" style="margin-top:14px">This project is in the trash.
      <button class="btn small primary" onClick=${() => update("projects", id, { deletedAt: null })}>Restore it</button></div>`}
    ${!videos.length && !p.ideaError && html`<div class="card" style="margin-top:20px;text-align:center;padding:40px">
      <div style="font-size:48px" class="spin">🧠</div><h2 style="margin-top:12px">Coming up with ${p.count} video ideas…</h2><p class="dim">This takes a few seconds.</p></div>`}
    ${p.ideaError && html`<div style="margin-top:20px"><${ErrorBox} err=${p.ideaError} onAction=${(a) => retryIdeas(id, a === "backup")} /></div>`}

    ${videos.length > 0 && html`
      <div class="card" style="margin-top:20px">
        <div class="workers">${WORKERS.map((w) => {
          const sts = videos.map((v) => workerStatus(v, w.key));
          const done = sts.filter((s) => s === "done").length;
          const s = sts.includes("error") ? "error" : sts.includes("working") ? "working" : done === videos.length ? "done" : "waiting";
          return html`<div class=${"worker " + s}><span class="ico">${w.icon}</span><div class="nm">${w.name}</div><div class=${"st st-" + s}>${WS_LABEL[s]}</div>${videos.length > 1 && html`<div class="small dim">${done}/${videos.length}</div>`}</div>`;
        })}</div>
        <div class="row" style="margin-top:14px"><div class="bar" style="flex:1"><div style=${`width:${pct}%`}></div></div><b class="small">${doneV.length}/${videos.length} ready</b></div>
        ${p.status === "generating" && html`<p class="small dim" style="margin:10px 0 0">${left ? `About ${left} min left. ` : ""}Keep this tab open while it works. If you close it, it picks up where it left off next time.</p>`}
        ${problems > 0 && p.status !== "generating" && html`<p class="small" style="margin:10px 0 0;color:#ffc9cb">${problems} video${problems > 1 ? "s need" : " needs"} a hand. Look for the red cards below.</p>`}
        ${p.status === "done" && html`<p class="small" style="margin:10px 0 0;color:var(--green)">🎉 All done!</p>`}
        ${doneV.length > 0 && html`<div class="row" style="margin-top:14px">
          <button class="btn primary" style="flex:2;min-width:220px" onClick=${downloadAll}>⬇ DOWNLOAD ALL ${doneV.length > 1 ? `(${doneV.length} videos)` : ""}</button>
          <button class="btn" style="flex:1;min-width:180px" onClick=${copyAll}>📋 Copy all captions</button></div>`}
      </div>
      <div class="grid" style="margin-top:20px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))">${videos.map((v) => html`<${VideoCard} key=${v.id} v=${v} />`)}</div>`}

    <div class="row" style="margin-top:30px">
      ${videos.length > 0 && !p.deletedAt && html`<button class="btn" onClick=${() => addVideos(id, 1)}>✚ 1 more video</button><button class="btn" onClick=${() => addVideos(id, 5)}>✚ 5 more</button>`}
      <span class="spacer"></span>
      ${!p.deletedAt && html`<button class="btn danger small" onClick=${async () => {
        if (!(await confirmBox({ title: "Move this project to the trash?", body: "You can restore it from Projects → Trash.", yes: "Move to trash", danger: true }))) return;
        await update("projects", id, { deletedAt: now() });
        queue.splice(0, queue.length, ...queue.filter((q) => !videos.some((v) => v.id === q)));
        go("projects");
      }}>🗑 Trash project</button>`}
    </div>
  </div>`;
}

function ErrorBox({ err, onAction, busy }) {

    <div><b>⚠️ ${err.message}</b><div class="small">${err.suggestion}</div></div>

          <input class="input" style="flex:1;min-width:220px;font-family:monospace" placeholder="sk-ant-…  /  sk-…  /  pexels key" value=${value}
            onInput=${(e) => setValue(e.target.value)} onKeyDown=${(e) => e.key === "Enter" && save()} autocomplete="off" spellcheck="false" />
          ${pick && html`<select class="input" style="width:auto" value=${pick} onChange=${(e) => setPick(e.target.value)}>${KEY_DEFS.map((d) => html`<option value=${d.name}>${d.label}</option>`)}</select>`}
          <button class="btn primary" onClick=${save}>SAVE KEY</button>
        </div>
        <p class="small dim" style="margin:6px 0 0">I'll figure out which service it's for. Keys stay in this browser only and go straight to that service.</p>
      </div>
      ${KEY_DEFS.map((d) => {
        const has = k?.[d.name];
        const r = results[d.name];
        return html`<div class="row" style="gap:10px;padding:8px 0;border-top:1px solid var(--line)">
          <span style="font-size:20px">${!has ? "⚪" : r && !r.ok ? "🔴" : "🟢"}</span>
          <div style="flex:1;min-width:180px"><b>${d.label}</b> <span class="small dim">· ${d.unlocks}</span>
            <div class="small dim">${has ? html`<code>${mask(has)}</code>` : html`<a href=${d.url} target="_blank" rel="noreferrer" style="text-decoration:underline">Get a key ↗</a>`}
              ${r && html`<span style=${"margin-left:8px;color:" + (r.ok ? "var(--green)" : "var(--red)")}>${r.message}</span>`}</div></div>
          ${has && html`<button class="btn small" onClick=${() => test(d.name)}>Test</button>
            <button class="btn small danger" onClick=${async () => {
              if (await confirmBox({ title: `Disconnect ${d.label}?`, body: "Videos will use the next available option.", yes: "Disconnect", danger: true })) keys.set(d.name, "");
            }}>✕</button>`}
        </div>`;
      })}
    </div>
    <a href="#make" class="btn primary" style="width:100%;margin-top:18px">DONE: MAKE VIDEOS</a>
  </div>`;
}
async function testKey(name, value) {
  const calls = {
    // browsers may only call the messages endpoint; a 1-token reply costs a tiny fraction of a cent
    ANTHROPIC_API_KEY: () =>
      fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "x-api-key": value, "anthropic-version": "2023-06-01", "content-type": "application/json", "anthropic-dangerous-direct-browser-access": "true" },
        body: JSON.stringify({ model: MODELS.anthropic.cheap, max_tokens: 1, messages: [{ role: "user", content: "hi" }] }),
      }),
    OPENAI_API_KEY: () => fetch("https://api.openai.com/v1/models", { headers: { Authorization: `Bearer ${value}` } }),
    ELEVENLABS_API_KEY: () => fetch("https://api.elevenlabs.io/v1/voices", { headers: { "xi-api-key": value } }),
    PEXELS_API_KEY: () => fetch("https://api.pexels.com/v1/search?query=night&per_page=1", { headers: { Authorization: value } }),
  };
  try {
    const res = await calls[name]();
    if (res.ok) return { ok: true, message: "Connected ✓" };
    if (res.status === 401 || res.status === 403) return { ok: false, message: "That key was rejected. Copy it again and paste the whole thing." };
    if (res.status === 429) return { ok: true, message: "Key works (service is busy right now)." };
    return { ok: false, message: `The service answered with an error (${res.status}). Try again in a minute.` };
  } catch {
    return { ok: false, message: "Couldn't reach the service. Check your internet." };
  }
}

// ---------------------------------------------------------------- system
function SystemPage() {
  const errs = useData(async () => (await kv.get("errors", [])).filter((e) => !e.resolved));
  const info = useData(async () => {
    const est = navigator.storage?.estimate ? await navigator.storage.estimate() : null;
    const persisted = navigator.storage?.persisted ? await navigator.storage.persisted() : false;
    const codecs = typeof VideoEncoder !== "undefined" && typeof AudioEncoder !== "undefined" ? await pickCodecs() : null;
    const ps = await db.all("projects");
    return { est, persisted, codecs, cost: ps.reduce((s, p) => s + (p.cost || 0), 0) };
  });
  const titles = useData(async () => Object.fromEntries((await db.all("projects")).map((p) => [p.id, p.title])));
  const act = async (e, action) => {
    try {
      if (action !== "resolve") {
        if (e.step === "ideas") await retryIdeas(e.projectId, action === "backup");
        else if (e.videoId) {
          const v = await db.get("videos", e.videoId);
          if (v?.steps[e.step]?.status === "error") await videoAction(e.videoId, action, e.step);
        }
      }
      const list = await kv.get("errors", []);
      for (const x of list) if (x.id === e.id) x.resolved = true;
      await kv.set("errors", list);
      toast(action === "resolve" ? "Dismissed" : "On it 👍");
    } catch (er) {
      toast(er.message, true);
    }
  };
  const editor = info?.codecs?.video && info?.codecs?.audio;
  const checks = info && [
    { name: "Video editor", ok: !!editor || typeof MediaRecorder !== "undefined", msg: editor ? `Fast MP4 export (${info.codecs.video[1].toUpperCase()} + ${info.codecs.audio[1].toUpperCase()}).` : "Slow mode: this browser records videos in real time. Chrome or Edge is faster." },
    { name: "Storage", ok: true, msg: info.est ? `Using ${(info.est.usage / 1e6).toFixed(0)} MB of ${(info.est.quota / 1e9).toFixed(1)} GB available.` : "Saving in this browser." },
    { name: "Keep my projects", ok: info.persisted, msg: info.persisted ? "Your browser won't clear your projects." : "Your browser may clear projects if it runs low on space.", fix: !info.persisted },
  ];
  return html`<div>
    <h1 style="margin-top:16px">⚙ System</h1>
    ${errs && html`<div class=${"banner " + (errs.length ? "warn" : "good")}><b>${errs.length ? `⚠️ ${errs.length} problem(s) need a look.` : "✅ Everything is working."}</b></div>`}
    <div class="row" style="margin-top:28px"><h2 style="margin:0">🚑 Error Center</h2><span class="spacer"></span>
      ${errs?.length > 0 && html`<button class="btn small primary" onClick=${async () => { for (const e of errs) await act(e, "retry"); }}>Retry all</button>`}</div>
    ${errs?.length === 0 && html`<p class="dim">No problems. Nice.</p>`}
    <div style="display:grid;gap:12px;margin-top:12px">${(errs || []).map((e) => html`<div class="card">
      <div class="row" style="align-items:flex-start"><div style="flex:1;min-width:240px"><b>⚠️ ${e.error.message}</b><div class="small">${e.error.suggestion}</div>
        <div class="small dim" style="margin-top:4px">${titles?.[e.projectId] || "App"} · ${ago(e.createdAt)} ${e.projectId && html`· <a href=${"#project-" + e.projectId} style="text-decoration:underline">open project</a>`}</div></div>
        <div class="row" style="gap:8px"><button class="btn small primary" onClick=${() => act(e, "retry")}>TRY AGAIN</button>
          ${e.error.canBackup && html`<button class="btn small" onClick=${() => act(e, "backup")}>USE BACKUP</button>`}
          ${e.error.canSkip && html`<button class="btn small" onClick=${() => act(e, "skip")}>SKIP</button>`}
          <button class="btn small" title="Hide" onClick=${() => act(e, "resolve")}>✕</button></div></div>
      <details><summary class="small">Advanced</summary><pre class="tech">step: ${e.step} · code: ${e.error.code}${e.error.provider ? " · provider: " + e.error.provider : ""}\n${e.error.technical}</pre></details>
    </div>`)}</div>
    ${checks && html`<h2 style="margin-top:34px">🩺 Health</h2><div class="grid">
      ${checks.map((c) => html`<div class="card"><b>${c.ok ? "✅" : "⚠️"} ${c.name}</b><div class="small dim">${c.msg}</div>
        ${c.fix && html`<button class="btn small" style="margin-top:8px" onClick=${async () => {
          const ok = await navigator.storage?.persist?.();
          toast(ok ? "Your projects are protected ✓" : "Your browser said no. Bookmarking this page usually helps.", !ok);
          changed();
        }}>Protect my projects</button>`}</div>`)}
      <div class="card"><b>💸 Spend (estimate)</b><div class="small dim">${money(info.cost)} total</div></div>
      <div class="card"><b>🔌 AI</b><div class="small dim">${practiceMode() ? "Practice mode: connect AI for full quality." : "Connected."}</div><a href="#connect" class="btn small" style="margin-top:8px">Manage AI keys</a></div>
    </div>`}
    <details style="margin-top:20px"><summary>Advanced: provider order</summary>
      <p class="small dim">Top = tried first. If it fails, the next one is used automatically.</p>
      <${ProviderOrder} />
    </details>
  </div>`;
}
function ProviderOrder() {
  const [order, setOrder] = useState(() => loadLS("cf-order", {}));
  useData(async () => keys.all());
  const CAPS = { llm: "🧠 Writer", voice: "🎙 Voice", image: "👁 Visuals", captions: "💬 Captions" };
  return html`<div style="display:grid;gap:14px">${Object.entries(REGISTRY).map(([cap, list]) => {
    const saved = order[cap] || [];
    const sorted = [...list].sort((a, b) => (saved.indexOf(a.id) < 0 ? 99 : saved.indexOf(a.id)) - (saved.indexOf(b.id) < 0 ? 99 : saved.indexOf(b.id)));
    return html`<div class="card"><b>${CAPS[cap]}</b><div style="display:grid;gap:6px;margin-top:8px">${sorted.map((p, i) => html`<div class="row" style="gap:8px">
      <span class="dim" style="width:22px">${i + 1}.</span><span style="flex:1">${p.available() ? "🟢" : "⚪"} ${p.label}${p.offline ? html` <span class="badge offline">practice</span>` : ""}</span>
      <button class="btn small" disabled=${i === 0} onClick=${() => {
        const ids = sorted.map((x) => x.id);
        [ids[i - 1], ids[i]] = [ids[i], ids[i - 1]];
        const next = { ...order, [cap]: ids };
        setOrder(next);
        localStorage.setItem("cf-order", JSON.stringify(next));
        toast("Saved ✓");
      }}>↑</button></div>`)}</div></div>`;
  })}</div>`;
}

/** Delete stored files no video points to anymore (left over from redos). */
async function cleanupFiles() {
  const used = new Set((await db.all("videos")).flatMap(videoBlobKeys));
  const all = await tx("blobs", "readonly", (o) => req(o.getAllKeys()));
  for (const k of all) if (!used.has(k)) await tx("blobs", "readwrite", (o) => req(o.delete(k)));
}
(async () => {
  try {
    await idb();
  } catch (e) {
    document.getElementById("app").innerHTML =
      '<div class="wrap"><div class="banner bad" style="margin-top:40px">This browser blocked storage (private window?). Open the page in a normal Chrome, Edge or Safari window.</div></div>';
    return;
  }
  const root = document.getElementById("app");
  root.textContent = ""; // remove the "Loading…" placeholder
  render(html`<${App} />`, root);
  navigator.storage?.persist?.().catch(() => {});
  await resumeAll();
  if (!running.size && !queue.length) cleanupFiles().catch(() => {});
  window.__cf = { db, kv, blobs, keys, running, queue }; // for debugging from the console
})();
