=\"radio\">${on ? \"●\" : \"○\"}<\/span>\n      <span style=\"flex:1;text-align:left\"><b>${o.label}<\/b><span class=\"small dim\"> · ${o.note}<\/span>\n        ${!st.ok && !st.needsKey && html`<div class=\"small\" style=\"color:#ffe0a0\">${st.why}<\/div>`}\n        ${o.key && canFetch() && (has\n          ? html`<div class=\"small\" style=${\"color:\" + (result && !result.ok && result.message !== \"Checking…\" ? \"var(--red)\" : \"var(--green)\")}>${result && !result.ok && result.message !== \"Checking…\" ? \"⚠ \" + result.message : \"✓ \" + label + \" key added\"}<\/div>`\n          : html`<div class=\"small dim\">Needs ${/^[AEIOU]/.test(label) ? \"an\" : \"a\"} ${label} key: paste it in the box at the top. <a href=${KEY_LINKS[o.key]} target=\"_blank\" rel=\"noreferrer\" style=\"text-decoration:underline\" onClick=${(e) => e.stopPropagation()}>Get one ↗<\/a><\/div>`)}<\/span>\n    <\/button>\n  <\/div>`;\n}\n\nasync function testKey(name, value) {\n  const calls = {\n    // browsers may only call the messages endpoint; a 1-token reply costs a tiny fraction of a cent\n    ANTHROPIC_API_KEY: () =>\n      fetch(\"https://api.anthropic.com/v1/messages\", {\n        method: \"POST\",\n        headers: { \"x-api-key\": value, \"anthropic-version\": \"2023-06-01\", \"content-type\": \"application/json\", \"anthropic-dangerous-direct-browser-access\": \"true\" },\n        body: JSON.stringify({ model: MODELS.anthropic.cheap, max_tokens: 1, messages: [{ role: \"user\", content: \"hi\" }] }),\n      }),\n    OPENAI_API_KEY: () => fetch(\"https://api.openai.com/v1/models\", { headers: { Authorization: `Bearer ${value}` } }),\n    ANTHROPIC_ADMIN_KEY: () =>\n      fetch(`https://api.anthropic.com/v1/organizations/cost_report?starting_at=${encodeURIComponent(new Date(Date.now() - 864e5).toISOString())}&limit=1`, {\n        headers: { \"x-api-key\": value, \"anthropic-version\": \"2023-06-01\", \"anthropic-dangerous-direct-browser-access\": \"true\" },\n      }),\n    OPENAI_ADMIN_KEY: () => fetch(`https://api.openai.com/v1/organization/costs?start_time=${Math.floor(Date.now() / 1000) - 86400}&limit=1`, { headers: { Authorization: `Bearer ${value}` } }),\n    GEMINI_API_KEY: () => fetch(\"https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000\", { headers: { \"x-goog-api-key\": value } }),\n    ELEVENLABS_API_KEY: () => fetch(\"https://api.elevenlabs.io/v1/voices\", { headers: { \"xi-api-key\": value } }),\n    PEXELS_API_KEY: () => fetch(\"https://api.pexels.com/v1/search?query=night&per_page=1\", { headers: { Authorization: value } }),\n  };\n  try {\n    const res = await calls[name]();\n    if (res.ok) return { ok: true, message: \"Connected ✓\" };\n    if (res.status === 401 || res.status === 403 || (res.status === 400 && /api key not valid|API_KEY_INVALID/i.test(await res.clone().text().catch(() => \"\"))))\n      return { ok: false, message: \"That key was rejected. Copy it again and paste the whole thing.\" };\n    if (res.status === 429) return { ok: true, message: \"Key works (service is busy right now).\" };\n    return { ok: false, message: `The service answered with an error (${res.status}). Try again in a minute.` };\n  } catch {\n    return { ok: false, message: \"Couldn't reach the service. Check your internet.\" };\n  }\n}\n\n/** Which jobs a saved key powers, e.g. \"Writer, Voice, Visuals\". */\nconst jobsFor = (name) => (KEY_DEFS.find((d) => d.name === name)?.admin ? [\"your real bills on the 💰 Money page\"] : ROLES.filter((r) => r.options.some((o) => o.key === name)).map((r) => r.title));\nconst keyLabel = (name) => KEY_DEFS.find((d) => d.name === name)?.label || name;\n\n/** Paste any key(s): the app works out which service each one is for and files it there. */\n/** Keys kept for services the app can't use yet (so nothing you paste is lost). */\nconst otherKeys = () => Object.entries(keys.all()).filter(([k]) => k.startsWith(\"OTHER_\")).map(([k, v]) => ({ name: k, value: v, label: (loadSetting(\"cf-key-labels\", {}) || {})[k] || k.slice(6).replace(/_/g, \" \") }));\nfunction saveOtherKey(value, label) {\n  const name = \"OTHER_\" + (label || \"key\").toUpperCase().replace(/[^A-Z0-9]+/g, \"_\").replace(/^_|_$/g, \"\").slice(0, 30);\n  let n = name, i = 2;\n  while (keys.get(n) && keys.get(n) !== value) n = name + \"_\" + i++;\n  keys.set(n, value);\n  saveSetting(\"cf-key-labels\", { ...(loadSetting(\"cf-key-labels\", {}) || {}), [n]: label });\n  return n;\n}\n\n/** Paste any key(s): the app works out which service each one is for and files it there. */\nfunction KeyDrop({ results = {}, onTest = () => {}, onAdded = () => {} }) {\n  useData(async () => keys.all());\n  const [text, setText] = useState(\"\");\n  const [busy, setBusy] = useState(false);\n  const [out, setOut] = useState([]);\n  const [label, setLabel] = useState({});\n  const live = canFetch();\n  const file = (value, name, note = \"\") => {\n    const had = keys.get(name);\n    keys.set(name, value);\n    onAdded(name, { ok: true, message: \"Connected ✓\" });\n    if (name === \"GEMINI_API_KEY\") discoverGemini(value).catch(() => {});\n    return { ok: true, value, name, text: `${keyLabel(name)} key saved${had && had !== value ? \" (replaced the old one)\" : \"\"}${note}. Used for: ${jobsFor(name).join(\", \")}.` };\n  };\n  /** Grok, Groq, DeepSeek, OpenRouter…: set the service up (finds its newest model) and save the key. */\n  const service = async (value, preset) => {\n    try {\n      const svc = await addCustomService({ preset, key: value });\n      return { ok: true, value, text: `${svc.name} key saved and works ✓ (model ${svc.model}). Pick “${svc.name}” for the Writer or the Change-the-app chat below.` };\n    } catch (e) {\n      if (e.code === \"auth\") return { ok: false, value, text: `This looks like a ${presetById(preset).name} key, but ${presetById(preset).name} rejected it. Copy it again (the whole thing).` };\n      return { ok: false, value, ask: true, text: `Couldn't set up ${presetById(preset).name}: ${e.message}` };\n    }\n  };\n  const run = async (raw) => {\n    const found = findKeys(raw);\n    if (!found.length) {\n      setOut([{ ok: false, text: \"I couldn't find a key in that. Copy the whole key from the service's website and paste it here.\" }]);\n      return;\n    }\n    setBusy(true);\n    setText(\"\");\n    const res = [];\n    for (const k of found) {\n      const pre = (k.name || \"\").startsWith(\"PRESET:\") ? k.name.slice(7) : !k.name && keyPreset(k.value);\n      if (pre) {\n        if (live) res.push(await service(k.value, pre));\n        else {\n          saveOtherKey(k.value, presetById(pre).name);\n          res.push({ ok: true, value: k.value, text: `${presetById(pre).name} key saved. To use it, add it in the downloaded app (inside Claude the app can't reach ${presetById(pre).name}).` });\n        }\n        continue;\n      }\n      if (k.other) {\n        if (/GitHub token/.test(k.other)) res.push({ ok: false, value: k.value, text: `That looks like ${k.other}, so it wasn't saved.` });\n        else {\n          const what = k.other.replace(/^an? /, \"\").replace(/ key$/, \"\");\n          saveOtherKey(k.value, what);\n          res.push({ ok: true, value: k.value, text: `${what} key saved. The app can't use ${what} yet, but it's kept here (ask Claude to add ${what} support and it'll use it).` });\n        }\n        continue;\n      }\n      if (k.name) {\n        if (!live) {\n          res.push(file(k.value, k.name));\n          continue;\n        }\n        const t = await testKey(k.name, k.value);\n        if (t.ok) res.push(file(k.value, k.name, \" and works ✓\"));\n        else if (/rejected/.test(t.message) && k.name === \"OPENAI_API_KEY\" && /^sk-[a-f0-9]{32}$/.test(k.value)) res.push(await service(k.value, \"deepseek\"));\n        else if (/rejected/.test(t.message)) res.push({ ok: false, value: k.value, text: `This looks like ${/^[AEIOU]/.test(keyLabel(k.name)) ? \"an\" : \"a\"} ${keyLabel(k.name)} key, but ${keyLabel(k.name)} rejected it. Copy it again (the whole thing) or make a new one.` });\n        else res.push(file(k.value, k.name, \" (couldn't check it right now)\"));\n        continue;\n      }\n      // format doesn't say which service: ask each one (only the services this app uses)\n      if (live) {\n        let hit = null;\n        for (const d of KEY_DEFS.filter((x) => !x.admin)) if ((await testKey(d.name, k.value)).ok) { hit = d.name; break; }\n        if (hit) {\n          res.push(file(k.value, hit, \", worked out by testing it\"));\n          continue;\n        }\n      }\n      res.push({ ok: false, value: k.value, ask: true, text: `I can't tell which service ${mask(k.value)} is for${live ? \" (none of the usual ones accepted it)\" : \"\"}. Which is it?` });\n    }\n    setOut(res);\n    setBusy(false);\n  };\n  const choose = async (i, name) => {\n    const r = out[i];\n    let next;\n    if (name.startsWith(\"preset:\")) {\n      setBusy(true);\n      next = await service(r.value, name.slice(7));\n      setBusy(false);\n    } else if (name === \"other\") {\n      const l = (label[i] || \"\").trim() || \"Other\";\n      saveOtherKey(r.value, l);\n      next = { ok: true, value: r.value, text: `Saved as “${l}”. The app can't use it yet, but it's kept here.` };\n    } else next = file(r.value, name);\n    setOut((o) => o.map((x, j) => (j === i ? next : x)));\n  };\n  const customs = customServices();\n  const others = otherKeys();\n  const anyKeys = KEY_DEFS.some((d) => keys.get(d.name)) || customs.length || others.length;\n  const remove = async (title, fn) => {\n    if (await confirmBox({ title, body: \"Anything using it falls back to the next option.\", yes: \"Remove\", danger: true })) fn();\n  };\n  return html`<div class=\"card\" style=\"margin:14px 0 18px\">\n    <label class=\"lbl\" style=\"margin:0 0 6px\">🔑 Paste any API key<\/label>\n    <p class=\"small dim\" style=\"margin:0 0 8px\">Paste one key or several (even a whole .env file or a note). The app works out which service each key is for, checks it, and saves it. Every key is kept, even for services the app can't use yet.<\/p>\n    <textarea rows=\"2\" placeholder=\"sk-ant-…  sk-proj-…  AIza…  xai-…  gsk_…  (paste here)\" value=${text} disabled=${busy} style=\"width:100%;font-family:ui-monospace,monospace\"\n      onInput=${(e) => setText(e.target.value)}\n      onPaste=${(e) => { const t = e.clipboardData?.getData(\"text\"); if (t) { e.preventDefault(); run(t); } }}><\/textarea>\n    <div class=\"row\" style=\"gap:8px;margin-top:8px\">\n      <button class=\"btn primary\" disabled=${busy || !text.trim()} onClick=${() => run(text)}>${busy ? \"Checking…\" : \"Add key\"}<\/button>\n      ${busy && html`<span class=\"small dim\">Checking with each service…<\/span>`}\n    <\/div>\n    ${out.length > 0 && html`<div style=\"display:grid;gap:6px;margin-top:10px\">${out.map((r, i) => html`<div class=\"small\" style=${\"padding:8px 10px;border-radius:10px;background:\" + (r.ok ? \"rgba(80,220,140,.12)\" : \"rgba(255,200,90,.12)\")}>\n      ${r.ok ? \"✓ \" : \"⚠️ \"}${r.text}\n      ${r.ask && html`<div class=\"chips\" style=\"margin-top:6px\">\n        ${KEY_DEFS.filter((x) => !x.admin).map((d) => html`<button class=\"chip\" disabled=${busy} onClick=${() => choose(i, d.name)}>${d.label}<\/button>`)}\n        ${AI_PRESETS.filter((p) => p.id !== \"other\").map((p) => html`<button class=\"chip\" disabled=${busy} onClick=${() => choose(i, \"preset:\" + p.id)}>${p.name}<\/button>`)}<\/div>\n        <div class=\"row\" style=\"gap:6px;margin-top:6px\"><input class=\"input\" style=\"flex:1;padding:6px 10px\" placeholder=\"…or name it (e.g. Runway) to keep it for later\" value=${label[i] || \"\"} onInput=${(e) => setLabel({ ...label, [i]: e.target.value })} />\n          <button class=\"btn small\" onClick=${() => choose(i, \"other\")}>Save it<\/button><\/div>`}\n    <\/div>`)}<\/div>`}\n    ${anyKeys && html`<div style=\"margin-top:14px\"><div class=\"small dim\" style=\"margin-bottom:6px\">Your keys (saved on this device${Sync.on() && Sync.cfg().syncKeys ? \" and synced\" : \"\"})<\/div>\n      <div style=\"display:grid;gap:6px\">\n        ${KEY_DEFS.filter((d) => keys.get(d.name)).map((d) => html`<div class=\"row keyrow\">\n          <b class=\"small\" style=\"min-width:120px\">${d.label}<\/b><code class=\"small dim\">${mask(keys.get(d.name))}<\/code>\n          ${results[d.name] && html`<span class=\"small\" style=${\"color:\" + (results[d.name].ok ? \"var(--green)\" : \"var(--red)\")}>${results[d.name].message}<\/span>`}\n          <span class=\"spacer\"><\/span>\n          ${live && html`<button class=\"btn small\" onClick=${() => onTest(d.name)}>Test<\/button>`}\n          <button class=\"btn small danger\" title=\"Remove\" onClick=${() => remove(`Remove your ${d.label} key?`, () => keys.set(d.name, \"\"))}>✕<\/button><\/div>`)}\n        ${customs.map((c) => html`<div class=\"row keyrow\" style=\"flex-wrap:wrap\">\n          <b class=\"small\" style=\"min-width:120px\">${c.name}<\/b><code class=\"small dim\">${mask(keys.get(customKey(c.id)))}<\/code>\n          <span class=\"small dim\">model<\/span>\n          ${c.models?.length ? html`<select class=\"input\" style=\"padding:4px 8px;max-width:240px\" value=${c.model} onChange=${(e) => setCustomModel(c.id, e.target.value)}>${c.models.map((m) => html`<option value=${m}>${m}<\/option>`)}<\/select>`\n            : html`<input class=\"input\" style=\"padding:4px 8px;width:200px\" value=${c.model} onChange=${(e) => e.target.value.trim() && setCustomModel(c.id, e.target.value.trim())} />`}\n          <span class=\"spacer\"><\/span>\n          <button class=\"btn small danger\" title=\"Remove\" onClick=${() => remove(`Remove ${c.name}?`, () => removeCustomService(c.id))}>✕<\/button><\/div>`)}\n        ${others.map((o) => html`<div class=\"row keyrow\">\n          <b class=\"small\" style=\"min-width:120px\">${o.label}<\/b><code class=\"small dim\">${mask(o.value)}<\/code><span class=\"small dim\">kept for later<\/span>\n          <span class=\"spacer\"><\/span>\n          <button class=\"btn small danger\" title=\"Remove\" onClick=${() => remove(`Remove your ${o.label} key?`, () => keys.set(o.name, \"\"))}>✕<\/button><\/div>`)}\n      <\/div><\/div>`}\n    <${AddService} />\n  <\/div>`;\n}\n\n/** Add any AI service that works like OpenAI (most do): pick it, paste the key, done. */\nfunction AddService() {\n  const [open, setOpen] = useState(false);\n  const [preset, setPreset] = useState(\"xai\");\n  const [name, setName] = useState(\"\");\n  const [base, setBase] = useState(\"\");\n  const [key, setKey] = useState(\"\");\n  const [model, setModel] = useState(\"\");\n  const [busy, setBusy] = useState(false);\n  const [msg, setMsg] = useState(\"\");\n  const p = presetById(preset);\n  if (!open) return html`<button class=\"btn small\" style=\"margin-top:12px\" onClick=${() => setOpen(true)}>➕ Add another AI service (Grok, DeepSeek, Mistral…)<\/button>`;\n  const save = async () => {\n    setBusy(true);\n    setMsg(\"\");\n    try {\n      const svc = await addCustomService({ preset, name: name || p.name, base: base || p.base, key, model });\n      setMsg(`✓ ${svc.name} added (model ${svc.model}). Pick it for the Writer or the chat below.`);\n      setKey(\"\");\n      setModel(\"\");\n    } catch (e) {\n      setMsg(\"⚠️ \" + (e.code === \"auth\" ? \"The service rejected that key.\" : e.message));\n    }\n    setBusy(false);\n  };\n  return html`<div class=\"card\" style=\"margin-top:12px;padding:14px\">\n    <b>➕ Add another AI service<\/b>\n    <p class=\"small dim\" style=\"margin:4px 0 10px\">For writing scripts and the Change-the-app chat. Works with any service that's “OpenAI-compatible” (most are).<\/p>\n    <div class=\"chips\">${AI_PRESETS.map((x) => html`<button class=${\"chip\" + (preset === x.id ? \" on\" : \"\")} onClick=${() => (setPreset(x.id), setName(\"\"), setBase(\"\"))}>${x.name}<\/button>`)}<\/div>\n    <div style=\"display:grid;gap:6px;margin-top:10px\">\n      ${preset === \"other\" && html`<input class=\"input\" placeholder=\"Name (e.g. My AI)\" value=${name} onInput=${(e) => setName(e.target.value)} />\n        <input class=\"input\" placeholder=\"API address, e.g. https://api.example.com/v1\" value=${base} onInput=${(e) => setBase(e.target.value)} />`}\n      <input class=\"input\" placeholder=${`${p.name} API key`} value=${key} onInput=${(e) => setKey(e.target.value)} />\n      <input class=\"input\" placeholder=\"Model (optional: the newest is picked for you)\" value=${model} onInput=${(e) => setModel(e.target.value)} />\n      <div class=\"row\" style=\"gap:8px\">\n        <button class=\"btn primary\" disabled=${busy || !key.trim() || (preset === \"other\" && !base.trim())} onClick=${save}>${busy ? \"Checking…\" : \"Add\"}<\/button>\n        ${p.url && html`<button class=\"btn small\" onClick=${() => openSite(p.url)}>Get a ${p.name} key ↗<\/button>`}\n        <span class=\"spacer\"><\/span><button class=\"btn small\" onClick=${() => setOpen(false)}>Close<\/button>\n      <\/div>\n      ${!canFetch() && html`<p class=\"small\" style=\"color:#ffe0a0;margin:0\">Inside Claude the app can't reach outside services; add services in the downloaded app.<\/p>`}\n      ${msg && html`<p class=\"small\" style=\"margin:0\">${msg}<\/p>`}\n    <\/div>\n  <\/div>`;\n}\n\n/** Can this device reach each AI service? (Uses the same connection as the rest of the device.) */\nconst NET_HOSTS = [\n  [\"Anthropic\", \"https://api.anthropic.com/v1/models\"], [\"OpenAI\", \"https://api.openai.com/v1/models\"],\n  [\"Google Gemini\", \"https://generativelanguage.googleapis.com/v1beta/models\"], [\"ElevenLabs\", \"https://api.elevenlabs.io/v1/models\"],\n  [\"Pexels\", \"https://api.pexels.com/v1/curated?per_page=1\"],\n];\n/** Desktop app: which version is running, automatic updates from Claude, install from a file. */\nfunction UpdatesCard() {\n  const [info, setInfo] = useState(null);\n  const [msg, setMsg] = useState(\"\");\n  const [busy, setBusy] = useState(false);\n  const A = window.cfApp;\n  useEffect(() => {\n    A?.info().then(setInfo).catch(() => {});\n  }, []);\n  if (!A) return null;\n  const when = (v) => (v ? new Date(v).toLocaleString() : \"?\");\n  const say = (r) =>\n    setMsg(\n      r.status === \"installed\" ? \"✨ Update downloaded. Press Restart now in the bar at the bottom.\" :\n      r.status === \"latest\" ? \"✅ You have the newest version.\" :\n      r.status === \"off\" ? \"Automatic updates aren't connected yet.\" : \"⚠️ \" + (r.message || \"Couldn't check right now.\"),\n    );\n  const check = async () => {\n    setBusy(true);\n    say(await A.check());\n    setInfo(await A.info());\n    setBusy(false);\n  };\n  const fromFile = async (e) => {\n    const f = e.target.files?.[0];\n    e.target.value = \"\";\n    if (!f) return;\n    say(await A.installFile(await f.text()));\n  };\n  return html`<h2 style=\"margin-top:34px\">✨ Updates<\/h2>\n    <div class=\"card\">\n      <div class=\"row\" style=\"gap:10px;flex-wrap:wrap\"><div style=\"flex:1;min-width:240px\">\n        <b>Version from ${when(info?.version)}<\/b>${info?.updated ? html`<span class=\"small dim\"> · updated automatically<\/span>` : \"\"}\n        <div class=\"small dim\" style=\"margin-top:4px\">${info?.source\n          ? \"Fixes made in Claude arrive here by themselves (checked when the app opens and every 30 minutes).\"\n          : \"Automatic updates aren't connected yet. You can still install a new app file you got from Claude.\"}<\/div><\/div>\n        ${info?.source && html`<button class=\"btn small primary\" disabled=${busy} onClick=${check}>${busy ? \"Checking…\" : \"Check for updates\"}<\/button>`}\n        <label class=\"btn small\" style=\"cursor:pointer\">Install from a file<input type=\"file\" accept=\".html,text/html\" style=\"display:none\" onChange=${fromFile} /><\/label>\n      <\/div>\n      ${msg && html`<p class=\"small\" style=\"margin:10px 0 0\">${msg}<\/p>`}\n    <\/div>`;\n}\n\nfunction ConnectionCard() {\n  const [res, setRes] = useState(null);\n  const [info, setInfo] = useState(null);\n  const [online, setOnline] = useState(navigator.onLine !== false);\n  const run = async () => {\n    setOnline(navigator.onLine !== false);\n    if (window.cfNet?.info) window.cfNet.info().then(setInfo).catch(() => {});\n    setRes(Object.fromEntries(NET_HOSTS.map(([n]) => [n, \"…\"])));\n    await Promise.all(NET_HOSTS.map(async ([n, url]) => {\n      const t0 = performance.now();\n      try {\n        // any answer (even \"no key\") means the service is reachable\n        await fetch(url, { mode: \"no-cors\", cache: \"no-store\", signal: timeout(10000) });\n        setRes((r) => ({ ...r, [n]: `✓ ${Math.round(performance.now() - t0)} ms` }));\n      } catch {\n        setRes((r) => ({ ...r, [n]: \"✗ can't reach\" }));\n      }\n    }));\n  };\n  useEffect(() => {\n    if (canFetch()) run();\n    const f = () => setOnline(navigator.onLine !== false);\n    window.addEventListener(\"online\", f);\n    window.addEventListener(\"offline\", f);\n    return () => (window.removeEventListener(\"online\", f), window.removeEventListener(\"offline\", f));\n  }, []);\n  const bad = res && Object.values(res).some((v) => v.startsWith(\"✗\"));\n  return html`<h2 style=\"margin-top:34px\">📡 Internet connection<\/h2>\n    <div class=\"card\">\n      <div class=\"row\"><b style=\"flex:1\">${online ? \"✅ This device is online\" : \"⚠️ This device is offline\"}<\/b>\n        ${canFetch() && html`<button class=\"btn small\" onClick=${run}>Test again<\/button>`}<\/div>\n      <div class=\"small dim\" style=\"margin-top:4px\">${window.cfNet\n        ? `The app uses this computer's own internet connection${info?.proxy && info.proxy !== \"DIRECT\" ? ` through your proxy (${info.proxy})` : \"\"}, including VPNs and company networks.`\n        : canFetch() ? \"The app uses this browser's internet connection.\" : \"Inside Claude, outside services are blocked; use the downloaded app for them.\"}\n        If the internet drops, videos pause and carry on by themselves when it's back.<\/div>\n      ${res && html`<div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;margin-top:10px\">${NET_HOSTS.map(([n]) => html`<div class=\"small\" style=${\"padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.04);color:\" + (res[n]?.startsWith(\"✗\") ? \"var(--red)\" : \"inherit\")}><b>${n}<\/b> ${res[n]}<\/div>`)}<\/div>`}\n      ${bad && html`<p class=\"small\" style=\"margin:10px 0 0;color:#ffe0a0\">Some services can't be reached. Check that you're online, that a firewall or antivirus isn't blocking the app, or try another network.<\/p>`}\n    <\/div>`;\n}\n\n// ---------------------------------------------------------------- system\nfunction SystemPage() {\n  const errs = useData(async () => (await kv.get(\"errors\", [])).filter((e) => !e.resolved));\n  const info = useData(async () => {\n    const est = navigator.storage?.estimate ? await navigator.storage.estimate() : null;\n    const persisted = navigator.storage?.persisted ? await navigator.storage.persisted() : false;\n    const codecs = typeof VideoEncoder !== \"undefined\" && typeof AudioEncoder !== \"undefined\" ? await pickCodecs() : null;\n    const ps = await db.all(\"projects\");\n    return { est, persisted, codecs, cost: ps.reduce((s, p) => s + (p.cost || 0), 0) };\n  });\n  const titles = useData(async () => Object.fromEntries((await db.all(\"projects\")).map((p) => [p.id, p.title])));\n  const act = async (e, action) => {\n    try {\n      if (action !== \"resolve\") {\n        if (e.step === \"ideas\") await retryIdeas(e.projectId, action === \"backup\");\n        else if (e.videoId) {\n          const v = await db.get(\"videos\", e.videoId);\n          if (v?.steps[e.step]?.status === \"error\") await videoAction(e.videoId, action, e.step);\n        }\n      }\n      const list = await kv.get(\"errors\", []);\n      for (const x of list) if (x.id === e.id) x.resolved = true;\n      await kv.set(\"errors\", list);\n      toast(action === \"resolve\" ? \"Dismissed\" : \"On it 👍\");\n    } catch (er) {\n      toast(er.message, true);\n    }\n  };\n  const editor = info?.codecs?.video && info?.codecs?.audio;\n  const checks = info && [\n    { name: \"Video editor\", ok: !!editor || typeof MediaRecorder !== \"undefined\", msg: editor ? `Fast MP4 export (${info.codecs.video[1].toUpperCase()} + ${info.codecs.audio[1].toUpperCase()}).` : \"Slow mode: this browser records videos in real time. Chrome or Edge is faster.\" },\n    { name: \"Storage\", ok: true, msg: info.est ? `Using ${(info.est.usage / 1e6).toFixed(0)} MB of ${(info.est.quota / 1e9).toFixed(1)} GB available.` : \"Saving in this browser.\" },\n    { name: \"Keep my projects\", ok: info.persisted, msg: info.persisted ? \"Your browser won't clear your projects.\" : \"Your browser may clear projects if it runs low on space.\", fix: !info.persisted },\n  ];\n  return html`<div>\n    <h1 style=\"margin-top:16px\">⚙ System<\/h1>\n    ${errs && html`<div class=${\"banner \" + (errs.length ? \"warn\" : \"good\")}><b>${errs.length ? `⚠️ ${errs.length} problem(s) need a look.` : \"✅ Everything is working.\"}<\/b><\/div>`}\n    <div class=\"row\" style=\"margin-top:28px\"><h2 style=\"margin:0\">🚑 Error Center<\/h2><span class=\"spacer\"><\/span>\n      ${errs?.length > 0 && html`<button class=\"btn small primary\" onClick=${async () => { for (const e of errs) await act(e, \"retry\"); }}>Retry all<\/button>`}<\/div>\n    ${errs?.length === 0 && html`<p class=\"dim\">No problems. Nice.<\/p>`}\n    <div style=\"display:grid;gap:12px;margin-top:12px\">${(errs || []).map((e) => html`<div class=\"card\">\n      <div class=\"row\" style=\"align-items:flex-start\"><div style=\"flex:1;min-width:240px\"><b>⚠️ ${e.error.message}<\/b><div class=\"small\">${e.error.suggestion}<\/div>\n        <div class=\"small dim\" style=\"margin-top:4px\">${titles?.[e.projectId] || \"App\"} · ${ago(e.createdAt)} ${e.projectId && html`· <a href=${\"#project-\" + e.projectId} style=\"text-decoration:underline\">open project<\/a>`}<\/div><\/div>\n        <div class=\"row\" style=\"gap:8px\"><button class=\"btn small primary\" onClick=${() => act(e, \"retry\")}>TRY AGAIN<\/button>\n          ${e.error.canBackup && html`<button class=\"btn small\" onClick=${() => act(e, \"backup\")}>USE BACKUP<\/button>`}\n          ${e.error.canSkip && html`<button class=\"btn small\" onClick=${() => act(e, \"skip\")}>SKIP<\/button>`}\n          <button class=\"btn small\" title=\"Hide\" onClick=${() => act(e, \"resolve\")}>✕<\/button><\/div><\/div>\n      <details><summary class=\"small\">Advanced<\/summary><pre class=\"tech\">step: ${e.step} · code: ${e.error.code}${e.error.provider ? \" · provider: \" + e.error.provider : \"\"}\\n${e.error.technical}<\/pre><\/details>\n    <\/div>`)}<\/div>\n    <${UpdatesCard} />\n    <${ConnectionCard} />\n    ${checks && html`<h2 style=\"margin-top:34px\">🩺 Health<\/h2><div class=\"grid\">\n      ${checks.map((c) => html`<div class=\"card\"><b>${c.ok ? \"✅\" : \"⚠️\"} ${c.name}<\/b><div class=\"small dim\">${c.msg}<\/div>\n        ${c.fix && html`<button class=\"btn small\" style=\"margin-top:8px\" onClick=${async () => {\n          const ok = await navigator.storage?.persist?.();\n          toast(ok ? \"Your projects are protected ✓\" : \"Your browser said no. Bookmarking this page usually helps.\", !ok);\n          changed();\n        }}>Protect my projects<\/button>`}<\/div>`)}\n      <div class=\"card\"><b>💸 Spend (estimate)<\/b><div class=\"small dim\">${money(info.cost)} total<\/div><\/div>\n      <div class=\"card\"><b>🔌 AI<\/b><div class=\"small dim\">${practiceMode() ? \"Practice mode: connect an AI writer for real scripts.\" : \"Connected.\"}<\/div><a href=\"#connect\" class=\"btn small\" style=\"margin-top:8px\">Choose AI for each job<\/a><\/div>\n    <\/div>`}\n  <\/div>`;\n}\n\n// ---------------------------------------------------------------- reference video uploads (Make page)\nfunction RefUploads() {\n  const files = useData(refFiles) || [];\n  const [drag, setDrag] = useState(false);\n  const input = useRef();\n  const add = async (list) => {\n    const n = await addRefFiles(list);\n    if (n) toast(`Studying ${n} video${n > 1 ? \"s\" : \"\"}… 🔍`);\n  };\n  const ai = !practiceMode();\n  return html`<div>\n    <div class=${\"dropzone\" + (drag ? \" on\" : \"\")}\n      onClick=${() => input.current?.click()}\n      onDragOver=${(e) => (e.preventDefault(), setDrag(true))} onDragLeave=${() => setDrag(false)}\n      onDrop=${(e) => (e.preventDefault(), setDrag(false), add([...e.dataTransfer.files]))}>\n      <div style=\"font-size:26px\">⬆<\/div>\n      <b>Upload reference videos<\/b>\n      <div class=\"small dim\">Drop video files here or tap to choose (MP4 works best${files.length ? `, ${MAX_REF_FILES - files.length} more allowed` : `, up to ${MAX_REF_FILES}`})<\/div>\n      <input ref=${input} type=\"file\" accept=\"video/*,.mp4,.mov,.webm,.m4v\" multiple style=\"display:none\" onChange=${(e) => {\n        const picked = [...e.target.files]; // copy first: clearing the box empties its live file list\n        e.target.value = \"\";\n        add(picked);\n      }} />\n    <\/div>\n    ${!ai && html`<p class=\"small\" style=\"margin:8px 0 0;color:#ffe0a0\">No AI writer connected, so I can only measure the videos (length, cuts, pace). Connect one to have it study them properly.<\/p>`}\n    ${files.length > 0 && html`<div style=\"display:grid;gap:10px;margin-top:12px\">${files.map((f) => html`<${RefCard} key=${f.id} f=${f} />`)}<\/div>`}\n    ${files.some((f) => f.status === \"done\") && html`<button class=\"btn small\" style=\"margin-top:10px\" onClick=${() => downloadBlob(new Blob([notesAsText(files)], { type: \"text/plain\" }), \"reference-research.txt\")}>⬇ Download research notes<\/button>`}\n  <\/div>`;\n}\nfunction RefCard({ f }) {\n  const [open, setOpen] = useState(false);\n  const [play, setPlay] = useState(false);\n  const thumb = useBlobUrl(f.status === \"done\" ? \"refthumb:\" + f.id : null);\n  const vid = useBlobUrl(play ? \"ref:\" + f.id : null);\n  const n = f.notes || {};\n  const row = (k, v) => v && html`<div><b>${k}:<\/b> ${Array.isArray(v) ? html`<ul style=\"margin:4px 0 0;padding-left:18px\">${v.map((x) => html`<li>${x}<\/li>`)}<\/ul>` : v}<\/div>`;\n  return html`<div class=\"refcard\">\n    <div class=\"row\" style=\"gap:12px;align-items:flex-start;flex-wrap:nowrap\">\n      <div class=\"refthumb\" onClick=${() => f.status === \"done\" && setPlay(!play)} title=\"Play\">\n        ${play && vid ? html`<video src=${vid} controls autoplay playsinline style=\"width:100%;height:100%;object-fit:cover\"><\/video>` : thumb ? html`<img src=${thumb} />` : html`<span>🎬<\/span>`}\n      <\/div>\n      <div style=\"flex:1;min-width:0\">\n        <div style=\"font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">${f.name}<\/div>\n        <div class=\"small dim\">${(f.size / 1e6).toFixed(1)} MB${f.meta ? ` · ${Math.round(f.meta.duration)} s · new shot every ~${f.meta.avgShot} s` : \"\"}<\/div>\n        ${f.status === \"waiting\" && html`<div class=\"small\" style=\"color:var(--amber)\">In line…<\/div>`}\n        ${f.status === \"working\" && html`<div class=\"small\" style=\"color:var(--amber)\"><span class=\"spin\">◐<\/span> ${f.step || \"Studying\"}…<\/div>`}\n        ${f.status === \"error\" && html`<div class=\"small\" style=\"color:var(--red)\">⚠️ ${f.error} <button class=\"btn small\" style=\"min-height:32px;padding:4px 10px\" onClick=${() => researchRef(f.id)}>Try again<\/button><\/div>`}\n        ${f.status === \"done\" && html`<div class=\"small\" style=\"margin-top:2px\">${n.summary || \"\"}<\/div>\n          ${n.aiError && html`<div class=\"small\" style=\"color:#ffe0a0\">${n.aiError}<\/div>`}\n          <button class=\"btn small\" style=\"min-height:32px;padding:4px 10px;margin-top:6px\" onClick=${() => setOpen(!open)}>${open ? \"Hide notes\" : \"See what the AI learned\"}<\/button>`}\n      <\/div>\n      <button class=\"btn small danger\" style=\"min-height:36px;padding:4px 10px\" title=\"Remove\" onClick=${async () => {\n        if (await confirmBox({ title: \"Remove this reference video?\", yes: \"Remove\", danger: true })) removeRefFile(f.id);\n      }}>✕<\/button>\n    <\/div>\n    ${open && html`<div class=\"small refnotes\">\n      ${row(\"Hook\", n.hook)}${row(\"Structure\", n.structure)}${row(\"Pacing\", n.pacing)}${row(\"Visuals\", n.visuals)}${row(\"Captions\", n.captions)}${row(\"Voice\", n.voice)}${row(\"Music\", n.music)}${row(\"What to copy\", n.copy)}\n      ${f.transcript && html`<details><summary class=\"small\">Transcript<\/summary><div class=\"dim\">${f.transcript}<\/div><\/details>`}\n      <div class=\"dim\" style=\"margin-top:6px\">Studied by: ${f.by}<\/div>\n      <button class=\"btn small\" style=\"margin-top:8px\" onClick=${() => researchRef(f.id)}>↻ Study again<\/button>\n    <\/div>`}\n  <\/div>`;\n}\n","70-money.js":"// ---------------------------------------------------------------- money: budget, spending, real bills, plans\n// The app keeps its own ledger of what each AI call cost (estimated from each service's prices).\n// Real bills come from the services that offer them: ElevenLabs (normal key), OpenAI and Anthropic (admin keys).\n// Plans and payments happen on each service's own billing page, opened inside the app.\nconst monthKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, \"0\")}`;\nconst monthStart = (d = new Date()) => new Date(d.getFullYear(), d.getMonth(), 1);\n\nconst SERVICES = [\n  {\n    id: \"anthropic\", name: \"Claude API (Anthropic)\", icon: \"🧠\", key: \"ANTHROPIC_API_KEY\", admin: \"ANTHROPIC_ADMIN_KEY\",\n    how: \"Prepaid credits. Buy credits or turn on auto-reload; set a monthly spend limit under Limits.\",\n    billing: \"https://console.anthropic.com/settings/billing\", plans: \"https://console.anthropic.com/settings/limits\",\n    adminUrl: \"https://console.anthropic.com/settings/admin-keys\",\n  },\n  {\n    id: \"openai\", name: \"OpenAI (scripts, voice, images, Sora)\", icon: \"🤖\", key: \"OPENAI_API_KEY\", admin: \"OPENAI_ADMIN_KEY\",\n    how: \"Prepaid credits. Add credits or auto-recharge; set a monthly budget and alerts under Limits.\",\n    billing: \"https://platform.openai.com/settings/organization/billing/overview\", plans: \"https://platform.openai.com/settings/organization/limits\",\n    adminUrl: \"https://platform.openai.com/settings/organization/admin-keys\",\n  },\n  {\n    id: \"gemini\", name: \"Google Gemini\", icon: \"✨\", key: \"GEMINI_API_KEY\",\n    how: \"Free tier, or pay as you go through Google Cloud billing (needed for Gemini images). Google doesn't share bills with apps, so open the billing page to see it.\",\n    billing: \"https://console.cloud.google.com/billing\", plans: \"https://ai.google.dev/gemini-api/docs/pricing\",\n  },\n  {\n    id: \"elevenlabs\", name: \"ElevenLabs (voice)\", icon: \"🎙\", key: \"ELEVENLABS_API_KEY\",\n    how: \"Monthly plan with a character allowance. Change plan or pay an open invoice on the subscription page.\",\n    billing: \"https://elevenlabs.io/app/subscription\", plans: \"https://elevenlabs.io/pricing\",\n  },\n  { id: \"pexels\", name: \"Pexels (stock photos)\", icon: \"📷\", key: \"PEXELS_API_KEY\", how: \"Free. Nothing to pay.\" },\n];\nconst SERVICE_OF = {\n  anthropic: \"anthropic\", openai: \"openai\", \"openai-tts\": \"openai\", \"openai-image\": \"openai\", \"openai-whisper\": \"openai\", sora: \"openai\",\n  gemini: \"gemini\", \"gemini-tts\": \"gemini\", \"gemini-image\": \"gemini\", elevenlabs: \"elevenlabs\", pexels: \"pexels\",\n};\n/** Free providers never count against the budget (Claude account = your Claude plan, no per-use cost). */\nconst FREE_IDS = new Set([\"claude-account\", \"pexels\", \"estimated\", \"generated\"]);\nconst isPaid = (p) => !p.offline && !FREE_IDS.has(p.id);\n\n// ---- ledger (one record per month: total, per service, per day)\nlet spendLock = Promise.resolve();\nfunction recordSpend(provider, amount) {\n  if (!amount || !(amount > 0)) return spendLock;\n  spendLock = spendLock.then(async () => {\n    const svc = SERVICE_OF[String(provider || \"\").split(\",\")[0].trim()] || \"other\";\n    const k = \"spend:\" + monthKey();\n    const m = (await kv.get(k, null)) || { total: 0, by: {}, days: {} };\n    m.total += amount;\n    m.by[svc] = (m.by[svc] || 0) + amount;\n    const d = new Date().getDate();\n    m.days[d] = (m.days[d] || 0) + amount;\n    await kv.set(k, m);\n    changed();\n  }).catch(() => {});\n  return spendLock;\n}\nlet monthSpend = async (key = monthKey()) => (await kv.get(\"spend:\" + key, null)) || { total: 0, by: {}, days: {} };\nconst budget = () => ({ monthly: 0, ...loadSetting(\"cf-budget\", {}) });\n\n/** Called before every paid AI call. Stops the video (it can be resumed) once the month's budget is used. */\nasync function assertBudget() {\n  const b = budget();\n  if (!b.monthly) return;\n  await spendLock;\n  const m = await monthSpend();\n  if (m.total >= b.monthly)\n    throw new ProviderError(\"budget\", `Monthly budget of ${money(b.monthly)} reached (${money(m.total)} spent)`, { retryable: false });\n}\n\n/** Rough cost of one video with the current Connect AI choices (for the Make page). */\nfunction estimateVideoCost(lengthSec = 30) {\n  const head = (cap, avoid = []) => chain(cap, avoid)[0];\n  const llm = head(\"llm\"), voice = head(\"voice\"), img = head(\"image\"), cap = head(\"captions\");\n  const scenes = Math.max(3, Math.round(lengthSec / 5));\n  const chars = lengthSec * 15;\n  let c = 0;\n  if (llm && isPaid(llm)) c += llm.id === \"anthropic\" ? (/opus/.test(modelChoice(\"writer\")) ? 0.12 : /haiku/.test(modelChoice(\"writer\")) ? 0.015 : 0.05) : llm.id === \"gemini\" ? 0.02 : 0.03;\n  if (voice && isPaid(voice)) c += voice.id === \"elevenlabs\" ? chars * PRICE.elevenlabsPerChar : voice.id === \"openai-tts\" ? chars * PRICE.openaiTtsPerChar : 0.003;\n  const imgCost = (p, n) => (!p || !isPaid(p) ? 0 : p.id === \"openai-image\" ? n * PRICE.openaiImage : p.id === \"gemini-image\" ? n * 0.045 : 0);\n  if (img?.id === \"sora\") {\n    const s = soraSettings(), per = soraPrice(s.model), each = soraClipSec(lengthSec / scenes);\n    c += s.mode === \"hook\" ? each * per + imgCost(head(\"image\", [\"sora\"]), scenes - 1) : scenes * each * per;\n  } else c += imgCost(img, scenes);\n  if (cap?.id === \"openai-whisper\") c += (lengthSec / 60) * PRICE.whisperPerMinute;\n  return c;\n}\n\n// ---- real bills from the services\nasync function fetchBill(svc) {\n  const k = keys.get(svc.key), a = svc.admin && keys.get(svc.admin);\n  const since = monthStart();\n  if (svc.id === \"elevenlabs\" && k) {\n    const res = await fetch(\"https://api.elevenlabs.io/v1/user/subscription\", { headers: { \"xi-api-key\": k }, signal: timeout(20000) });\n    if (!res.ok) throw await httpError(res, \"elevenlabs\");\n    const j = await res.json();\n    const inv = j.next_invoice;\n    const cur = (j.currency || \"usd\").toUpperCase();\n    return {\n      plan: `${cap(j.tier || \"?\")} plan${j.status && j.status !== \"active\" ? ` (${j.status.replace(/_/g, \" \")})` : \"\"}`,\n      lines: [\n        `Characters used: ${(j.character_count || 0).toLocaleString()} of ${(j.character_limit || 0).toLocaleString()}` + (j.next_character_count_reset_unix ? `, resets ${new Date(j.next_character_count_reset_unix * 1000).toLocaleDateString()}` : \"\"),\n        inv && inv.amount_due_cents != null ? `Next bill: ${(inv.amount_due_cents / 100).toFixed(2)} ${cur}${inv.next_payment_attempt_unix > 0 ? ` on ${new Date(inv.next_payment_attempt_unix * 1000).toLocaleDateString()}` : \"\"}` : null,\n        j.has_open_invoices ? \"⚠️ You have an unpaid invoice. Pay it on the subscription page.\" : null,\n      ].filter(Boolean),\n      usage: j.character_limit ? j.character_count / j.character_limit : null,\n      alert: !!j.has_open_invoices || [\"past_due\", \"incomplete\"].includes(j.status),\n    };\n  }\n  if (svc.id === \"openai\" && a) {\n    let total = 0, page = null;\n    for (let i = 0; i < 4; i++) {\n      const u = `https://api.openai.com/v1/organization/costs?start_time=${Math.floor(since / 1000)}&bucket_width=1d&limit=31${page ? \"&page=\" + encodeURIComponent(page) : \"\"}`;\n      const res = await fetch(u, { headers: { Authorization: `Bearer ${a}` }, signal: timeout(20000) });\n      if (!res.ok) throw await httpError(res, \"openai\");\n      const j = await res.json();\n      for (const b of j.data || []) for (const r of b.results || []) total += Number(r.amount?.value) || 0;\n      if (!j.has_more || !j.next_page) break;\n      page = j.next_page;\n    }\n    return { spent: total, lines: [`Billed by OpenAI this month: ${money(total)} (all your OpenAI usage, not only this app)`] };\n  }\n  if (svc.id === \"anthropic\" && a) {\n    let cents = 0, page = null;\n    for (let i = 0; i < 4; i++) {\n      const u = `https://api.anthropic.com/v1/organizations/cost_report?starting_at=${encodeURIComponent(since.toISOString())}&bucket_width=1d&limit=31${page ? \"&page=\" + encodeURIComponent(page) : \"\"}`;\n      const res = await fetch(u, { headers: { \"x-api-key\": a, \"anthropic-version\": \"2023-06-01\", \"anthropic-dangerous-direct-browser-access\": \"true\" }, signal: timeout(20000) });\n      if (!res.ok) throw await httpError(res, \"anthropic\");\n      const j = await res.json();\n      for (const b of j.data || []) for (const r of b.results || []) cents += Number(r.amount) || 0; // amounts are in cents\n      if (!j.has_more || !j.next_page) break;\n      page = j.next_page;\n    }\n    return { spent: cents / 100, lines: [`Billed by Anthropic this month: ${money(cents / 100)} (all your Claude API usage, not only this app)`] };\n  }\n  return null;\n}\n\n/** Billing pages open inside the desktop app (your logins are kept); in a browser they open in a new tab. */\nfunction openSite(url) {\n  window.open(url, \"_blank\", \"noopener,noreferrer\");\n}\n\nfunction MoneyPage() {\n  const [b, setB] = useState(budget);\n  const [draft, setDraft] = useState(() => (budget().monthly ? String(budget().monthly) : \"\"));\n  const [bills, setBills] = useState({});\n  const data = useData(async () => {\n    const now = new Date();\n    const months = [];\n    for (let i = 5; i >= 0; i--) {\n      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);\n      months.push({ key: monthKey(d), label: d.toLocaleDateString(undefined, { month: \"short\" }), m: await monthSpend(monthKey(d)) });\n    }\n    const ps = (await db.all(\"projects\")).filter((p) => !p.deletedAt && p.createdAt >= monthStart().toISOString());\n    return { months, cur: months[5].m, projects: ps.sort((x, y) => (y.cost || 0) - (x.cost || 0)).slice(0, 6) };\n  });\n  useData(async () => keys.all());\n  const loadBills = async () => {\n    for (const s of SERVICES) {\n      if (!keys.get(s.key) && !(s.admin && keys.get(s.admin))) continue;\n      if (!canFetch()) continue;\n      setBills((x) => ({ ...x, [s.id]: { loading: true } }));\n      try {\n        const r = await fetchBill(s);\n        setBills((x) => ({ ...x, [s.id]: r || { none: true } }));\n      } catch (e) {\n        const pe = toProviderError(e, s.id);\n        setBills((x) => ({ ...x, [s.id]: { error: pe.code === \"auth\" ? \"The key was refused (bills need the right key, see below).\" : pe.code === \"network\" ? \"Couldn't reach the service.\" : \"Couldn't load the bill right now.\" } }));\n      }\n    }\n  };\n  useEffect(() => {\n    loadBills();\n  }, []);\n  const saveBudget = () => {\n    const n = Math.max(0, Number(String(draft).replace(/[^0-9.]/g, \"\")) || 0);\n    const next = { ...b, monthly: n };\n    setB(next);\n    saveSetting(\"cf-budget\", next);\n    toast(n ? `Monthly budget set to ${money(n)} ✓` : \"Budget turned off\");\n  };\n  if (!data) return html`<div class=\"dim\">Loading…<\/div>`;\n  const spent = data.cur.total;\n  const pct = b.monthly ? Math.min(1, spent / b.monthly) : 0;\n  const left = b.monthly ? Math.max(0, b.monthly - spent) : null;\n  const max = Math.max(0.01, ...data.months.map((x) => x.m.total));\n  const svcName = (id) => SERVICES.find((s) => s.id === id)?.name || \"Other\";\n  return html`<div style=\"max-width:820px;margin:0 auto\">\n    <h1 style=\"margin-top:16px\">💰 Money<\/h1>\n    <p class=\"dim\" style=\"margin-top:0\">Your budget, what the app has spent, your real bills, and where to change plans or pay.<\/p>\n\n    <div class=\"card\">\n      <div class=\"row\" style=\"align-items:flex-end;gap:16px;flex-wrap:wrap\">\n        <div style=\"flex:1;min-width:220px\">\n          <div class=\"small dim\">Spent this month (by this app)<\/div>\n          <div style=\"font-size:38px;font-weight:800;line-height:1.1\">${money(spent)}${b.monthly ? html`<span class=\"dim\" style=\"font-size:18px;font-weight:600\"> of ${money(b.monthly)}<\/span>` : \"\"}<\/div>\n          ${b.monthly > 0 && html`<div class=\"meter\" style=\"margin-top:10px\"><div style=${`width:${pct * 100}%;background:${pct >= 1 ? \"var(--red)\" : pct >= 0.8 ? \"var(--amber)\" : \"var(--green)\"}`}><\/div><\/div>\n            <div class=\"small\" style=\"margin-top:6px\">${pct >= 1 ? html`<b style=\"color:var(--red)\">Budget used up.<\/b> Paid AI work is paused; free options still work.` : `${money(left)} left this month.`}<\/div>`}\n        <\/div>\n        <div style=\"min-width:240px\">\n          <label class=\"lbl small\">Monthly budget (USD)<\/label>\n          <div class=\"row\" style=\"gap:8px\"><input class=\"input\" inputmode=\"decimal\" placeholder=\"e.g. 20 (empty = no limit)\" value=${draft} onInput=${(e) => setDraft(e.target.value)} onKeyDown=${(e) => e.key === \"Enter\" && saveBudget()} style=\"width:170px\" />\n            <button class=\"btn primary\" onClick=${saveBudget}>Save<\/button><\/div>\n          <div class=\"small dim\" style=\"margin-top:6px\">When it's reached, videos pause instead of spending more. Raise it and press Try again to carry on.<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"card\" style=\"margin-top:16px\">\n      <b>This month by service<\/b>\n      ${Object.keys(data.cur.by).length === 0 ? html`<p class=\"small dim\">Nothing spent yet this month.<\/p>` : html`<div style=\"display:grid;gap:8px;margin-top:10px\">\n        ${Object.entries(data.cur.by).sort((x, y) => y[1] - x[1]).map(([id, v]) => html`<div class=\"row\" style=\"gap:10px\"><span class=\"small\" style=\"width:220px\">${svcName(id)}<\/span>\n          <div class=\"meter\" style=\"flex:1\"><div style=${`width:${(v / spent) * 100}%`}><\/div><\/div><b class=\"small\" style=\"width:70px;text-align:right\">${money(v)}<\/b><\/div>`)}<\/div>`}\n      <div class=\"small dim\" style=\"margin-top:14px\">Last 6 months<\/div>\n      <div class=\"bars\">${data.months.map((x) => html`<div class=\"mbar\" title=${money(x.m.total)}><div style=${`height:${(x.m.total / max) * 100}%`}><\/div><span>${x.label}<\/span><\/div>`)}<\/div>\n      ${data.projects.some((p) => p.cost > 0) && html`<div class=\"small dim\" style=\"margin-top:12px\">Top projects this month<\/div>\n        <div style=\"display:grid;gap:4px;margin-top:6px\">${data.projects.filter((p) => p.cost > 0).map((p) => html`<button class=\"row linkrow\" onClick=${() => go(\"project-\" + p.id)}><span class=\"small\" style=\"flex:1;text-align:left\">${p.title}<\/span><b class=\"small\">${money(p.cost)}<\/b><\/button>`)}<\/div>`}\n      <p class=\"small dim\" style=\"margin:12px 0 0\">These are the app's own estimates from each service's prices. The real bills below can differ a little.<\/p>\n    <\/div>\n\n    <h2 style=\"margin:26px 0 10px\">Bills and plans<\/h2>\n    <div style=\"display:grid;gap:12px\">${SERVICES.map((s) => {\n      const has = keys.get(s.key) || (s.admin && keys.get(s.admin));\n      const bill = bills[s.id];\n      return html`<div class=${\"card\" + (bill?.alert ? \" alertcard\" : \"\")}>\n        <div class=\"row\" style=\"gap:10px\"><span style=\"font-size:24px\">${s.icon}<\/span><div style=\"flex:1\"><b>${s.name}<\/b>\n          <div class=\"small dim\">${has ? s.how : \"Not connected.\"}<\/div><\/div>\n          ${has && data.cur.by[s.id] > 0 && html`<span class=\"small dim\">app spent ${money(data.cur.by[s.id])}<\/span>`}<\/div>\n        ${has && bill && html`<div style=\"margin:10px 0 0 34px;display:grid;gap:4px\">\n          ${bill.loading && html`<span class=\"small dim\">Loading your bill…<\/span>`}\n          ${bill.error && html`<span class=\"small\" style=\"color:#ffe0a0\">${bill.error}<\/span>`}\n          ${bill.plan && html`<b class=\"small\">${bill.plan}<\/b>`}\n          ${(bill.lines || []).map((l) => html`<span class=\"small\">${l}<\/span>`)}\n          ${bill.usage != null && html`<div class=\"meter\" style=\"max-width:360px\"><div style=${`width:${Math.min(1, bill.usage) * 100}%;background:${bill.usage > 0.9 ? \"var(--red)\" : \"var(--green)\"}`}><\/div><\/div>`}\n        <\/div>`}\n        ${has && s.admin && !keys.get(s.admin) && canFetch() && html`<p class=\"small dim\" style=\"margin:10px 0 0 34px\">To see your real ${s.id === \"openai\" ? \"OpenAI\" : \"Anthropic\"} bill here, paste an <b>admin key<\/b> (it starts with ${s.id === \"openai\" ? \"sk-admin-\" : \"sk-ant-admin\"}) in the key box on Connect AI. <a href=${s.adminUrl} target=\"_blank\" rel=\"noreferrer\" onClick=${(e) => { e.preventDefault(); openSite(s.adminUrl); }} style=\"text-decoration:underline\">Make one ↗<\/a><\/p>`}\n        ${s.billing && html`<div class=\"row\" style=\"gap:8px;margin:12px 0 0 34px;flex-wrap:wrap\">\n          <button class=\"btn small primary\" onClick=${() => openSite(s.billing)}>💳 Pay / add credits<\/button>\n          <button class=\"btn small\" onClick=${() => openSite(s.plans)}>Change plan or limits<\/button>\n        <\/div>`}\n      <\/div>`;\n    })}<\/div>\n    <p class=\"small dim\" style=\"margin-top:14px\">Paying and changing plans happen on each service's own secure page (the app never sees your card). ${window.cfNet ? \"They open in a window inside the app and remember your login.\" : \"They open in a new tab.\"}<\/p>\n    <button class=\"btn\" style=\"margin-top:6px\" onClick=${loadBills}>↻ Refresh bills<\/button>\n  <\/div>`;\n}\n","75-sync.js":"// ---------------------------------------------------------------- sync between devices (PC, phone, anywhere)\n// One small online database (your own free Supabase project) keeps every device up to date, live:\n// projects, videos and their progress, edits, settings, spending, and the finished video files.\n// Only one device makes each video: by default the PC does the work and phones watch, edit and download.\n// Off by default; nothing leaves this device until you set it up.\n\nconst SYNC_SQL = `-- Content Factory: run this once in your Supabase project (SQL Editor → New query → Run)\ncreate table if not exists public.cf_items (\n  user_id uuid not null default auth.uid() references auth.users on delete cascade,\n  kind text not null,\n  id text not null,\n  data jsonb not null default '{}'::jsonb,\n  deleted boolean not null default false,\n  device text,\n  updated_at timestamptz not null default now(),\n  primary key (user_id, kind, id)\n);\ncreate index if not exists cf_items_updated on public.cf_items (user_id, updated_at);\nalter table public.cf_items enable row level security;\ndrop policy if exists \"cf own rows\" on public.cf_items;\ncreate policy \"cf own rows\" on public.cf_items for all to authenticated\n  using (user_id = auth.uid()) with check (user_id = auth.uid());\n-- the server stamps the time, so devices with wrong clocks still sync in order\ncreate or replace function public.cf_touch() returns trigger language plpgsql as $$\nbegin new.updated_at = clock_timestamp(); return new; end $$;\ndrop trigger if exists cf_touch on public.cf_items;\ncreate trigger cf_touch before insert or update on public.cf_items for each row execute function public.cf_touch();\ndo $$ begin\n  alter publication supabase_realtime add table public.cf_items;\nexception when duplicate_object then null; end $$;\n-- finished videos (private: only you can read them)\ninsert into storage.buckets (id, name, public) values ('cf-videos', 'cf-videos', false) on conflict (id) do nothing;\ndrop policy if exists \"cf videos select\" on storage.objects;\ndrop policy if exists \"cf videos insert\" on storage.objects;\ndrop policy if exists \"cf videos update\" on storage.objects;\ndrop policy if exists \"cf videos delete\" on storage.objects;\ncreate policy \"cf videos select\" on storage.objects for select to authenticated using (bucket_id = 'cf-videos' and (storage.foldername(name))[1] = auth.uid()::text);\ncreate policy \"cf videos insert\" on storage.objects for insert to authenticated with check (bucket_id = 'cf-videos' and (storage.foldername(name))[1] = auth.uid()::text);\ncreate policy \"cf videos update\" on storage.objects for update to authenticated using (bucket_id = 'cf-videos' and (storage.foldername(name))[1] = auth.uid()::text);\ncreate policy \"cf videos delete\" on storage.objects for delete to authenticated using (bucket_id = 'cf-videos' and (storage.foldername(name))[1] = auth.uid()::text);\n`;\n\n/** The real connection: your Supabase project. (Tests swap in a stand-in with the same shape.) */\nfunction supabaseAdapter(url, anon) {\n  const sb = window.supabase.createClient(url, anon, {\n    auth: { persistSession: true, autoRefreshToken: true, storageKey: \"cf-sync-auth\" },\n    realtime: { params: { eventsPerSecond: 20 } },\n  });\n  let uidv = null, ch = null;\n  const fail = (error, what) => {\n    if (!error) return;\n    const m = String(error.message || error);\n    if (/relation .*cf_items.* does not exist|Could not find the table/i.test(m)) throw new Error(\"The database isn't set up yet: run the setup SQL (step 2) in your Supabase project.\");\n    if (/Invalid API key|No API key/i.test(m)) throw new Error(\"Supabase didn't accept the project key. Copy the anon / publishable key again.\");\n    throw new Error(`${what}: ${m}`);\n  };\n  return {\n    async init() {\n      const { data } = await sb.auth.getSession();\n      uidv = data.session?.user?.id || null;\n      return data.session?.user || null;\n    },\n    async signUp(email, password) {\n      const { data, error } = await sb.auth.signUp({ email, password });\n      fail(error, \"Couldn't make the account\");\n      uidv = data.session?.user?.id || null;\n      return { user: data.session ? data.user : null, needsConfirm: !data.session };\n    },\n    async signIn(email, password) {\n      const { data, error } = await sb.auth.signInWithPassword({ email, password });\n      if (error && /confirm/i.test(error.message)) throw new Error(\"Confirm your email first: open the link Supabase sent you, then sign in.\");\n      if (error && /invalid login/i.test(error.message)) throw new Error(\"Wrong email or password.\");\n      fail(error, \"Couldn't sign in\");\n      uidv = data.user.id;\n      return data.user;\n    },\n    async signOut() {\n      await sb.auth.signOut();\n      uidv = null;\n    },\n    async upsert(rows) {\n      const { error } = await sb.from(\"cf_items\").upsert(rows.map((r) => ({ ...r, user_id: uidv })), { onConflict: \"user_id,kind,id\" });\n      fail(error, \"Couldn't save to the cloud\");\n    },\n    async pull(since) {\n      const out = [];\n      for (let from = 0; ; from += 500) {\n        const { data, error } = await sb.from(\"cf_items\").select(\"*\").gt(\"updated_at\", since || \"1970-01-01T00:00:00Z\").order(\"updated_at\").range(from, from + 499);\n        fail(error, \"Couldn't read from the cloud\");\n        out.push(...data);\n        if (data.length < 500) return out ...d.value, ...Object.fromEntries(Object.entries(mine).filter(([k]) => !(k in (d.value || {})))) };\n        LS.setItem(\"cf-keys\", JSON.stringify(merged));\n      } else if ((loadSetting(row.id + \"@\", \"\") || \"\") < (d.at || \"\")) {\n        saveSettingRaw(row.id, d.value);\n        saveSettingRaw(row.id + \"@\", d.at);\n      }\n    } else if (row.kind === \"spend\") {\n      const [month, dev] = row.id.split(\"|\");\n      const all = (await kv.get(\"spendx:\" + month, {})) || {};\n      all[dev] = d;\n      await kv.set(\"spendx:\" + month, all);\n    } else if (row.kind === \"device\") {\n      st.devices[row.id] = d;\n    }\n    changed();\n  }\n  const staleWorker = (d) => !d.worker || d.worker.device === me.id || Date.now() - Date.parse(d.worker.at || 0) > 75000;\n\n  // ---------- connect\n  let ready = Promise.resolve();\n  function connect() {\n    ready = doConnect();\n    return ready;\n  }\n  async function doConnect() {\n    if (!outboxLoaded) {\n      for (const r of (await kv.get(\"sync-outbox\", [])) || []) if (!outbox.has(r.kind + \":\" + r.id)) outbox.set(r.kind + \":\" + r.id, r);\n      outboxLoaded = true;\n      saveOutbox();\n    }\n    const c = cfg();\n    if (!c.enabled || !c.url || !c.anon || !canFetch()) return set({ status: \"off\" });\n    try {\n      set({ status: \"connecting\", error: \"\" });\n      api = window.__cfTestSyncAdapter ? window.__cfTestSyncAdapter(c.url, c.anon) : supabaseAdapter(c.url, c.anon);\n      const user = await api.init();\n      if (!user) return set({ status: \"signed-out\", user: null });\n      set({ user: { id: user.id, email: user.email } });\n      st.cursor = await kv.get(\"sync-cursor\", null);\n      unsub?.();\n      unsub = api.subscribe(\n        (row) => apply(row).catch((e) => console.warn(\"sync apply\", e)),\n        (msg) => {\n          if (msg?.device === me.id || !msg?.videoId) return;\n          live[msg.videoId] = msg.live;\n          bus.dispatchEvent(new Event(\"live\"));\n st path = `${id}-${out.key.split(\":\").pop()}.${out.ext || \"mp4\"}`;\n      await api.upload(path, b);\n      await update(\"videos\", id, { cloud: { path, key: out.key, size: b.size, type: b.type } });\n    } catch (e) {\n      set({ error: e.message });\n    } finally {\n      uploading.delete(id);\n    }\n  }\n  async function uploadMissing() {\n    for (const v of await db.all(\"videos\")) if (v.status === \"done\" && v.steps?.assemble?.output?.key && !v.cloud) await uploadFinal(v.id);\n  }\n  const fetching = new Map();\n  /** Get a finished video made on another device (once; it's kept here afterwards). */\n  function fetchFinal(v) {\n    if (!on() || !v?.cloud) return Promise.resolve(null);\n    if (fetching.has(v.id)) return fetching.get(v.id);\n    const p = (async () => {\n      const b = await api.download(v.cloud.path);\n      const blob = b.type ? b : new Blob([b], { type: v.cloud.type || \"video/mp4\" });\n      await blobs.put(v.cloud.key, blob);\n      return blob;\n    })().finally(() => fetching.delete(v.id));\n    fetching.set(v.id, p);\n    return p;\n  }\n\n  // ---------- account\n  async function setup({ url, anon }) {\n    url = String(url || \"\").trim().replace(/\\/+$/, \"\");\n    if (!/^https:\\/\\/[a-z0-9-]+\\.supabase\\.(co|in|net)$/i.test(url) && !window.__cfTestSyncAdapter) throw new Error(\"That doesn't look like a Supabase project URL (https://xxxx.supabase.co).\");\n    if (!anon || String(anon).trim().length < 20) throw new Error(\"Paste the anon (public) key too.\");\n    saveSettingRaw(\"cf-sync\", { ...cfg(), url, anon: String(anon).trim(), enabled: true });\n    await connect();\n  }\n  async function signIn(email, password, create) {\n    if (!api) await connect();\n    if (!api) throw new Error(\"Set up the project first.\");\n    if (create) {\n      const r = await api.signUp(email, password);\n      if (r.needsConfirm) return { needsConfirm: true };\n    } else await api.signIn(email, password);\n    await connect();\n    return { ok: true };\n  }\n  async function signOut() {\n    try {\n      await api?.signOut();\n    } catch {}\n    unsub?.();\n    unsub = null;\n    clearInterval(beatTimer);\n    saveSettingRaw(\"cf-sync\", { ...cfg(), enabled: false });\n    api = null;\n    set({ status: \"off\", user: null, devices: {} });\n  }\n  function setOptions(patch) {\n    saveSettingRaw(\"cf-sync\", { ...cfg(), ...patch });\n    if (\"syncKeys\" in patch && patch.syncKeys) pushKeys();\n    if (\"worker\" in patch) {\n      announce();\n      if (patch.worker) resumeAll();\n    }\n    if (\"videos\" in patch && patch.videos) uploadMissing();\n    note();\n  }\n  const pushKeys = () => local(\"setting\", \"cf-keys\", { value: keys.all(), at: now() });\n  const pairCode = () => \"cfpair:\" + btoa(JSON.stringify({ u: cfg().url, k: cfg().anon })).replace(/=+$/, \"\");\n  function readPair(text) {\n    const t = String(text || \"\").trim();\n    const m = t.match(/cfpair:([A-Za-z0-9+/_-]+)/);\n    if (m) {\n      const j = JSON.parse(atob(m[1].replace(/-/g, \"+\").replace(/_/g, \"/\")));\n      return { url: j.u, anon: j.k };\n    }\n    const url = (t.match(/https:\\/\\/[a-z0-9-]+\\.supabase\\.(co|in|net)/i) || [])[0];\n    const anon = (t.match(/(eyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+|sb_publishable_[A-Za-z0-9_-]+)/) || [])[0];\n    return url || anon ? { url, anon } : null;\n  }\n\n  return {\n    me, st, cfg, on, local, apply, connect, claim, claimPlan, heartbeat, live: liveProgress, uploadFinal, fetchFinal,\n    setup, signIn, signOut, setOptions, pairCode, readPair, pushKeys, flush,\n    isWorker: () => !on() || cfg().worker,\n    workersOnline: () => Object.entries(st.devices).filter(([id, d]) => d.worker && (id === me.id || Date.now() - Date.parse(d.lastSeen || 0) < 150000)),\n  };\n})();\n\n// ---------- hooks: every local change to projects, videos, settings and spending is sent to the cloud\n{\n  const put = db.put, del = db.del;\n  db.put = async (s, v, k) => {\n    const r = await put(s, v, k);\n    if (s === \"projects\" || s === \"videos\") Sync.local(s.slice(0, -1), v.id, v);\n    return r;\n  };\n  db.del = async (s, k) => {\n    const cur = s === \"projects\" || s === \"videos\" ? await db.get(s, k) : null;\n    await del(s, k);\n    if (cur) Sync.local(s.slice(0, -1), k, null, true);\n  };\n  const keySet = keys.set;\n  keys.set = (n, v) => {\n    keySet(n, v);\n    if (Sync.on() && Sync.cfg().syncKeys) Sync.pushKeys();\n  };\n}\n/** saveSetting without sending to the cloud (used for device-only settings and for applying cloud changes). */\nfunction saveSettingRaw(k, v) {\n  LS.setItem(k, JSON.stringify(v));\n}\n{\n  const plain = saveSetting;\n  saveSetting = (k, v) => {\n    plain(k, v);\n    if (SYNCED_SETTINGS.has(k)) {\n      const at = now();\n      saveSettingRaw(k + \"@\", at);\n      Sync.local(\"setting\", k, { value: v, at });\n    }\n  };\n}\n/** Spending from every device counts toward the budget. */\n{\n  const own = monthSpend;\n  monthSpend = async (key = monthKey()) => {\n    const m = await own(key);\n    const others = (await kv.get(\"spendx:\" + key, {})) || {};\n    const out = { total: m.total, by: { ...m.by }, days: { ...m.days } };\n    for (const [dev, o] of Object.entries(others)) {\n      if (dev === Sync.me.id || !o) continue;\n      out.total += o.total || 0;\n      for (const [s, v] of Object.entries(o.by || {})) out.by[s] = (out.by[s] || 0) + v;\n      for (const [d, v] of Object.entries(o.days || {})) out.days[d] = (out.days[d] || 0) + v;\n    }\n    return out;\n  };\n  const rec = recordSpend;\n  recordSpend = (provider, amount) => {\n    const p = rec(provider, amount);\n    p.then(async () => {\n      const m = await kv.get(\"spend:\" + monthKey(), null);\n      if (m) Sync.local(\"spend\", monthKey() + \"|\" + Sync.me.id, m);\n    });\n    return p;\n  };\n}\n","76-devices.js":"// ---------------------------------------------------------------- sync screens: set up, pair a phone, devices\nfunction useSync() {\n  const [, set] = useState(0);\n  useEffect(() => {\n    const f = () => set((x) => x + 1);\n    bus.addEventListener(\"sync\", f);\n    bus.addEventListener(\"change\", f);\n    const t = setInterval(f, 30000); // \"online 2 min ago\" stays fresh\n    return () => (bus.removeEventListener(\"sync\", f), bus.removeEventListener(\"change\", f), clearInterval(t));\n  }, []);\n  return Sync.st;\n}\nconst seenAgo = (iso) => {\n  const s = (Date.now() - Date.parse(iso || 0)) / 1000;\n  return s < 90 ? \"online now\" : s < 3600 ? `seen ${Math.round(s / 60)} min ago` : s < 86400 ? `seen ${Math.round(s / 3600)} h ago` : `seen ${Math.round(s / 86400)} days ago`;\n};\n\n/** Little light in the menu: green = live, amber = connecting / waiting to send. */\nfunction SyncPill() {\n  const st = useSync();\n  if (st.status === \"off\") return null;\n  const ok = st.status === \"online\" && !st.pending && !st.error;\n  const word = st.status === \"online\" ? (st.pending ? \"Sending…\" : \"Synced\") : st.status === \"signed-out\" ? \"Sign in\" : st.status === \"error\" ? \"Sync problem\" : \"Connecting…\";\n  return html`<button type=\"button\" class=\"link syncpill\" title=${st.error || word} onClick=${() => go(\"connect\")}><span class=\"sdot\" style=${`background:${ok ? \"var(--green)\" : st.status === \"error\" ? \"var(--red)\" : \"var(--amber)\"}`}><\/span>${word}<\/button>`;\n}\n\nfunction QrCode({ text, size = 200 }) {\n  const svg = useMemo(() => {\n    const q = qrcode(0, \"M\");\n    q.addData(text);\n    q.make();\n    return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });\n  }, [text]);\n  return html`<div class=\"qr\" style=${`width:${size}px;height:${size}px`} dangerouslySetInnerHTML=${{ __html: svg }}><\/div>`;\n}\n\n/** Camera scanner for the pairing QR code (phone). */\nfunction Scanner({ onCode, onClose }) {\n  const vid = useRef(null);\n  const [err, setErr] = useState(\"\");\n  useEffect(() => {\n    let stream, alive = true, t;\n    (async () => {\n      try {\n        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: \"environment\" }, audio: false });\n        vid.current.srcObject = stream;\n        await vid.current.play();\n        const c = document.createElement(\"canvas\"), g = c.getContext(\"2d\", { willReadFrequently: true });\n        const tick = () => {\n          if (!alive) return;\n          const v = vid.current;\n          if (v.videoWidth) {\n            c.width = 480;\n            c.height = Math.round((480 * v.videoHeight) / v.videoWidth);\n            g.drawImage(v, 0, 0, c.width, c.height);\n            const r = jsQR(g.getImageData(0, 0, c.width, c.height).data, c.width, c.height);\n            if (r?.data && Sync.readPair(r.data)) return onCode(r.data);\n          }\n          t = setTimeout(tick, 220);\n        };\n        tick();\n      } catch (e) {\n        setErr(\"Couldn't open the camera. Allow camera access, or paste the code instead.\");\n      }\n    })();\n    return () => {\n      alive = false;\n      clearTimeout(t);\n      stream?.getTracks().forEach((x) => x.stop());\n    };\n  }, []);\n  return html`<${Modal} onClose=${onClose}>\n    <h2>📷 Scan the code on your PC<\/h2>\n    <p class=\"small dim\">On your PC: 🔌 Connect AI → Sync your devices → the QR code.<\/p>\n    ${err ? html`<p class=\"small\" style=\"color:#ffe0a0\">${err}<\/p>` : html`<video ref=${vid} playsinline muted style=\"width:100%;border-radius:12px;background:#000\"><\/video>`}\n    <button class=\"btn\" style=\"width:100%;margin-top:10px\" onClick=${onClose}>Cancel<\/button>\n  <\//>`;\n}\n\nfunction SyncCard() {\n  const st = useSync();\n  const c = Sync.cfg();\n  const [mode, setMode] = useState(c.url ? \"account\" : \"\");\n  const [url, setUrl] = useState(c.url);\n  const [anon, setAnon] = useState(c.anon);\n  const [code, setCode] = useState(\"\");\n  const [email, setEmail] = useState(\"\");\n  const [pw, setPw] = useState(\"\");\n  const [busy, setBusy] = useState(false);\n  const [msg, setMsg] = useState(\"\");\n  const [scan, setScan] = useState(false);\n  const [showSql, setShowSql] = useState(false);\n  const run = async (fn) => {\n    setBusy(true);\n    setMsg(\"\");\n    try {\n      await fn();\n    } catch (e) {\n      setMsg(\"⚠️ \" + e.message);\n    } finally {\n      setBusy(false);\n    }\n  };\n  const usePair = async (text) => {\n    const p = Sync.readPair(text);\n    if (!p?.url || !p?.anon) return setMsg(\"⚠️ That isn't a pairing code. On your PC it's under Sync your devices.\");\n    setScan(false);\n    setUrl(p.url);\n    setAnon(p.anon);\n    await run(async () => {\n      await Sync.setup(p);\n      setMode(\"account\");\n    });\n  };\n  const live = st.user && st.status !== \"off\";\n  if (!canFetch())\n    return html`<div class=\"card syncard\" style=\"margin:14px 0 18px\"><label class=\"lbl\" style=\"margin:0 0 6px\">📱 Sync your devices<\/label>\n      <p class=\"small dim\" style=\"margin:0\">Syncing your phone and PC works in the Windows and Android apps (inside Claude, the page can't reach outside services).<\/p><\/div>`;\n  const devices = Object.entries(st.devices).sort((a, b) => (a[0] === Sync.me.id ? -1 : b[0] === Sync.me.id ? 1 : 0));\n\n  return html`<div class=\"card syncard\" style=\"margin:14px 0 18px\">\n    <label class=\"lbl\" style=\"margin:0 0 6px\">📱 Sync your devices <span class=\"small dim\">(phone + PC, live, on Wi-Fi or mobile data)<\/span><\/label>\n    ${!c.enabled && !live && !mode && html`\n      <p class=\"small dim\" style=\"margin:0 0 10px\">Start videos from your phone, watch them being made, edit on either device and download them anywhere. Your PC does the heavy work. Uses your own free Supabase project, so your data stays in your account.<\/p>\n      <div class=\"row\" style=\"gap:8px;flex-wrap:wrap\">\n        <button class=\"btn primary\" onClick=${() => setMode(\"setup\")}>Set up sync (first device)<\/button>\n        <button class=\"btn\" onClick=${() => setMode(\"pair\")}>I set it up on another device<\/button>\n      <\/div>`}\n\n    ${mode === \"pair\" && !live && html`\n      <p class=\"small dim\" style=\"margin:0 0 8px\">Scan the QR code shown on your other device, or paste its pairing code.<\/p>\n      <div class=\"row\" style=\"gap:8px;flex-wrap:wrap\">\n        <button class=\"btn primary\" onClick=${() => setScan(true)}>📷 Scan code<\/button>\n        <input class=\"input\" style=\"flex:1;min-width:200px\" placeholder=\"…or paste the pairing code (cfpair:…)\" value=${code} onInput=${(e) => setCode(e.target.value)} />\n        <button class=\"btn\" disabled=${busy || !code.trim()} onClick=${() => usePair(code)}>Use code<\/button>\n      <\/div>\n      <button class=\"btn small\" style=\"margin-top:8px\" onClick=${() => setMode(\"\")}>← Back<\/button>`}\n\n    ${mode === \"setup\" && !live && html`<ol class=\"small steps\">\n      <li><b>Make a free Supabase project.<\/b> <button class=\"btn small\" onClick=${() => openSite(\"https://supabase.com/dashboard/new\")}>Open Supabase ↗<\/button><br /><span class=\"dim\">Sign up (free), press New project, pick any name and password, wait about a minute.<\/span><\/li>\n      <li><b>Set up the database.<\/b> Copy this, then in Supabase open <b>SQL Editor → New query<\/b>, paste, and press <b>Run<\/b>.\n        <div class=\"row\" style=\"gap:8px;margin-top:6px\"><button class=\"btn small primary\" onClick=${() => copy(SYNC_SQL, \"Setup SQL copied 📋\")}>📋 Copy setup SQL<\/button><button class=\"btn small\" onClick=${() => setShowSql(!showSql)}>${showSql ? \"Hide\" : \"Show\"} it<\/button><\/div>\n        ${showSql && html`<pre class=\"tech\" style=\"max-height:200px;overflow:auto;white-space:pre-wrap\">${SYNC_SQL}<\/pre>`}<\/li>\n      <li><b>Paste your project's address and key.<\/b> In Supabase: <b>Project Settings → API<\/b> (or the Connect button). Copy the <b>Project URL<\/b> and the <b>anon / publishable<\/b> key (not the secret one).\n        <div style=\"display:grid;gap:6px;margin-top:6px\">\n          <input class=\"input\" placeholder=\"https://xxxxxxxx.supabase.co\" value=${url} onInput=${(e) => setUrl(e.target.value)} onPaste=${(e) => { const p = Sync.readPair(e.clipboardData?.getData(\"text\")); if (p?.anon) { e.preventDefault(); setUrl(p.url || url); setAnon(p.anon); } }} />\n          <input class=\"input\" placeholder=\"anon public key (eyJ… or sb_publishable_…)\" value=${anon} onInput=${(e) => setAnon(e.target.value)} />\n          <button class=\"btn primary\" disabled=${busy || !url || !anon} onClick=${() => run(async () => (await Sync.setup({ url, anon }), setMode(\"account\")))}>${busy ? \"Connecting…\" : \"Connect\"}<\/button>\n        <\/div><\/li>\n    <\/ol><button class=\"btn small\" onClick=${() => setMode(\"\")}>← Back<\/button>`}\n\n    ${(mode === \"account\" || (c.enabled && !st.user)) && !live && c.url && html`\n      <p class=\"small\" style=\"margin:0 0 8px\">Connected to your project. Now sign in. <b>Use the same email and password on every device.<\/b><\/p>\n      <div style=\"display:grid;gap:6px;max-width:420px\">\n        <input class=\"input\" type=\"email\" autocomplete=\"email\" placeholder=\"Email\" value=${email} onInput=${(e) => setEmail(e.target.value)} />\n        <input class=\"input\" type=\"password\" autocomplete=\"current-password\" placeholder=\"Password (6+ characters)\" value=${pw} onInput=${(e) => setPw(e.target.value)} />\n        <div class=\"row\" style=\"gap:8px\">\n          <button class=\"btn primary\" disabled=${busy || !email || pw.length < 6} onClick=${() => run(async () => { const r = await Sync.signIn(email, pw, false); if (r.ok) toast(\"Synced ✓\"); })}>Sign in<\/button>\n          <button class=\"btn\" disabled=${busy || !email || pw.length < 6} onClick=${() => run(async () => { const r = await Sync.signIn(email, pw, true); if (r.needsConfirm) setMsg(\"📧 Account made. Open the confirmation email from Supabase, tap the link, then come back and press Sign in.\"); else toast(\"Synced ✓\"); })}>Make account<\/button>\n        <\/div>\n      <\/div>\n      <button class=\"btn small\" style=\"margin-top:8px\" onClick=${() => Sync.signOut().then(() => setMode(\"\"))}>Use a different project<\/button>`}\n\n    ${live && html`\n      <div class=\"row\" style=\"gap:10px;flex-wrap:wrap;align-items:flex-start\">\n        <div style=\"flex:1;min-width:240px\">\n          <div><${SyncPill} /> <span class=\"small dim\">${st.user.email}${st.lastSync ? \" · last synced \" + new Date(st.lastSync).toLocaleTimeString() : \"\"}<\/span><\/div>\n          ${st.error && html`<p class=\"small\" style=\"color:#ffe0a0;margin:6px 0 0\">⚠️ ${st.error}<\/p>`}\n          <div class=\"small dim\" style=\"margin:10px 0 4px\">Your devices<\/div>\n          <div style=\"display:grid;gap:4px\">${devices.map(([id, d]) => html`<div class=\"row small\" style=\"gap:8px\">\n            <span>${d.phone ? \"📱\" : \"💻\"}<\/span><b>${d.name}${id === Sync.me.id ? \" (this one)\" : \"\"}<\/b>\n            <span class=\"dim\">${id === Sync.me.id ? \"online now\" : seenAgo(d.lastSeen)}${d.worker ? \" · makes videos\" : \" · watches & edits\"}${d.running ? ` · making ${d.running}` : \"\"}<\/span><\/div>`)}<\/div>\n          <div style=\"display:grid;gap:6px;margin-top:12px\">\n            <label class=\"small row\" style=\"gap:8px;cursor:pointer\"><input type=\"checkbox\" checked=${c.worker} onChange=${(e) => Sync.setOptions({ worker: e.target.checked })} /> This device makes videos ${isPhone() ? html`<span class=\"dim\">(uses battery; usually leave it to the PC)<\/span>` : \"\"}<\/label>\n            <label class=\"small row\" style=\"gap:8px;cursor:pointer\"><input type=\"checkbox\" checked=${c.videos} onChange=${(e) => Sync.setOptions({ videos: e.target.checked })} /> Sync finished videos <span class=\"dim\">(so you can watch and download them on every device)<\/span><\/label>\n            <label class=\"small row\" style=\"gap:8px;cursor:pointer\"><input type=\"checkbox\" checked=${c.syncKeys} onChange=${(e) => Sync.setOptions({ syncKeys: e.target.checked })} /> Also sync my API keys <span class=\"dim\">(only needed if a phone makes videos; stored in your private database)<\/span><\/label>\n            <label class=\"small row\" style=\"gap:8px\">Name of this device <input class=\"input\" style=\"width:150px;padding:4px 8px\" value=${Sync.me.name} onChange=${(e) => { Sync.me.name = e.target.value.trim().slice(0, 30) || Sync.me.name; saveSettingRaw(\"cf-device\", Sync.me); Sync.connect(); }} /><\/label>\n          <\/div>\n        <\/div>\n        <div style=\"text-align:center\">\n          <${QrCode} text=${Sync.pairCode()} size=${170} />\n          <div class=\"small dim\" style=\"max-width:190px;margin:6px auto\">Add another device: scan this with it (Connect AI → Sync → I set it up on another device)<\/div>\n          <button class=\"btn small\" onClick=${() => copy(Sync.pairCode(), \"Pairing code copied 📋\")}>📋 Copy pairing code<\/button>\n        <\/div>\n      <\/div>\n      <button class=\"btn small\" style=\"margin-top:12px\" onClick=${async () => { if (await confirmBox({ title: \"Stop syncing this device?\", body: \"Everything stays on this device and in your Supabase project. You can sign in again any time.\", yes: \"Stop syncing\" })) Sync.signOut().then(() => setMode(\"\")); }}>Stop syncing this device<\/button>`}\n    ${msg && html`<p class=\"small\" style=\"margin:10px 0 0\">${msg}<\/p>`}\n    ${scan && html`<${Scanner} onCode=${usePair} onClose=${() => setScan(false)} />`}\n  <\/div>`;\n}\n\n/** Project page: a phone with work waiting and no PC online. */\nfunction WaitingForWorker({ videos, project }) {\n  const st = useSync();\n  if (!Sync.on() || Sync.isWorker()) return null;\n  const waiting = videos.filter((v) => v.status === \"queued\" || (v.status === \"working\" && staleWorkerOf(v))).length || (project?.status === \"planning\" && !project.deletedAt ? 1 : 0);\n  if (!waiting) return null;\n  const online = Sync.workersOnline();\n  return html`<div class=\"banner warn\" style=\"margin:10px 0\"><span class=\"small\">\n    ${online.length\n      ? html`💻 <b>${online.map(([, d]) => d.name).join(\", \")}<\/b> is making these. You can watch, edit and download here.`\n      : html`⏳ <b>${waiting} video${waiting > 1 ? \"s\" : \"\"} waiting for your PC.<\/b> Open Content Factory on your PC and they start by themselves.`}<\/span>\n    ${!online.length && html`<button class=\"btn small\" style=\"margin-left:8px\" onClick=${() => Sync.setOptions({ worker: true })}>Make them on this phone<\/button>`}\n  <\/div>`;\n}\nconst staleWorkerOf = (v) => !v.worker || Date.now() - Date.parse(v.worker.at || 0) > 75000;\n","90-boot.js":"// ---------------------------------------------------------------- start\n/** Delete stored files no video points to anymore (left over from redos). */\nasync function cleanupFiles() {\n  const used = new Set((await db.all(\"videos\")).flatMap(videoBlobKeys));\n  const all = await tx(\"blobs\", \"readonly\", (o) => req(o.getAllKeys()));\n  for (const k of all) if (!used.has(k)) await tx(\"blobs\", \"readwrite\", (o) => req(o.delete(k)));\n}\n(async () => {\n  await idb(); // falls back to memory if storage is blocked\n  const root = document.getElementById(\"app\");\n  root.textContent = \"\"; // remove the \"Loading…\" placeholder\n  render(html`<${App} />`, root);\n  window.__cfGo = go; // lets the \"Change the app\" chat open pages\n  window.__cfShell?.ready(); // tells the loader this version started fine\n  navigator.storage?.persist?.().catch(() => {});\n  await Sync.connect(); // live sync with your other devices (if set up)\n  await resumeAll();\n  if (!running.size && !queue.length) cleanupFiles().catch(() => {});\n  window.__cf = { db, kv, blobs, keys, running, queue, Sync, live, editScript, update, saveSetting, budget, now }; // for debugging from the console\n})();\n","style.css":":root {\n  --bg: #0b1020;\n  --bg2: #121a33;\n  --
