<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0b1020" />
<title>Content Factory</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Poppins:wght@600;800&family=Press+Start+2P&family=Noto+Sans+KR:wght@800&family=Noto+Sans+JP:wght@800&family=Noto+Sans+SC:wght@800&family=Noto+Sans+Thai:wght@800&family=Noto+Sans+Arabic:wght@800&family=Noto+Sans+Devanagari:wght@800&display=swap" />
<style id="cf-shell-style">/* "Change the app" chat — shell styles (not editable from the chat) */
.cfs-fab { position: fixed; right: 18px; bottom: 18px; z-index: 40; background: #1d2a52; color: #eef1fb; border: 2px solid #ffb43b; border-radius: 999px; padding: 12px 18px; font: 700 15px Inter, system-ui, sans-serif; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
.cfs-fab:hover { background: #26366a; }
@media (max-width: 640px) { .cfs-fab { bottom: 120px; right: 12px; padding: 12px 14px; } .cfs-fab span { display: none; } }
.cfs-notice { position: fixed; right: 18px; bottom: 76px; z-index: 40; max-width: 340px; padding: 12px 14px; border-radius: 14px; font: 600 14px Inter, system-ui, sans-serif; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
.cfs-notice.bad, .cfs-banner.bad { background: #2a0f14; border: 2px solid #6b2a33; color: #ffc9cb; }
.cfs-notice.info, .cfs-banner.info { background: #1d2a52; border: 2px solid #2a3760; color: #eef1fb; }
.cfs-panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); z-index: 70; background: #121a33; border-left: 2px solid #2a3760; display: flex; flex-direction: column; font: 15px/1.45 Inter, system-ui, sans-serif; color: #eef1fb; box-shadow: -12px 0 40px rgba(0,0,0,.5); }
.cfs-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 2px solid #2a3760; }
.cfs-sub, .cfs-dim { color: #9aa6c8; font-size: 13px; }
.cfs-actions { display: flex; gap: 6px; flex-wrap: nowrap; flex: none; }
.cfs-row { display: flex; gap: 6px; flex-wrap: wrap; }
.cfs-head .cfs-btn { padding: 6px 10px; min-height: 36px; }
.cfs-btn { background: #18223f; color: #eef1fb; border: 2px solid #2a3760; border-radius: 10px; padding: 8px 12px; font: 700 14px Inter, system-ui, sans-serif; cursor: pointer; min-height: 40px; }
.cfs-btn:hover { background: #1c2850; }
.cfs-btn:disabled { opacity: .5; cursor: not-allowed; }
.cfs-btn.primary { background: linear-gradient(180deg, #ffb43b, #ff8f1f); color: #1a1000; border-color: #ffcf7a; }
.cfs-banner { margin: 10px 16px 0; padding: 10px 12px; border-radius: 12px; font-size: 14px; }
.cfs-msgs { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.cfs-empty p { margin: 0 0 10px; }
.cfs-chip { display: block; width: 100%; text-align: left; background: #18223f; color: #eef1fb; border: 2px solid #2a3760; border-radius: 12px; padding: 10px 12px; margin: 0 0 8px; font: 600 14px Inter, system-ui, sans-serif; cursor: pointer; }
.cfs-chip:hover { border-color: #ffb43b; }
.cfs-msg { padding: 10px 12px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; max-width: 92%; }
.cfs-msg.user { align-self: flex-end; background: #2b2410; border: 2px solid #6e5414; }
.cfs-msg.assistant { align-self: flex-start; background: #18223f; border: 2px solid #2a3760; }
.cfs-msg.system { align-self: stretch; background: #241c08; border: 2px solid #6e5414; color: #ffe0a0; font-size: 14px; }
.cfs-tag { margin-top: 6px; font-size: 12px; color: #3ddc84; font-weight: 700; }
.cfs-act { font-size: 12px; color: #9aa6c8; margin-top: 4px; }
.cfs-act::before { content: "› "; }
.cfs-spin { display: inline-block; animation: cfs-sp 1s linear infinite; }
@keyframes cfs-sp { to { transform: rotate(360deg); } }
.cfs-input { display: flex; gap: 8px; padding: 12px 16px; border-top: 2px solid #2a3760; }
.cfs-input textarea { flex: 1; resize: none; background: #0d1430; color: #eef1fb; border: 2px solid #2a3760; border-radius: 12px; padding: 10px 12px; font: 15px Inter, system-ui, sans-serif; outline: none; }
.cfs-input textarea:focus { border-color: #ffb43b; }
.cfs-overlay { position: absolute; inset: 0; background: rgba(3,6,15,.75); display: flex; align-items: center; justify-content: center; padding: 14px; }
.cfs-modal { background: #18223f; border: 2px solid #2a3760; border-radius: 16px; padding: 16px; width: 100%; max-height: 90%; overflow: auto; }
.cfs-modal h3 { margin: 0 0 10px; }
.cfs-vlist { display: grid; gap: 8px; margin-bottom: 12px; }
.cfs-v { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px; border: 2px solid #2a3760; border-radius: 12px; font-size: 14px; }
.cfs-v.on { border-color: #ffb43b; }
</style>
<style id="cf-app-style"></style>
</head>
<body>
<div id="app"><div style="padding:60px;text-align:center;font-family:system-ui;color:#9aa6c8">Loading Content Factory…</div></div>
<div id="cf-shell"></div>

 => String(s).replace(/[^\\w\\- ]+/g, \"\").trim().replace(/\\s+/g, \"-\").slice(0, 60) || \"video\";\n\n// localStorage can be blocked (file previews, private windows): fall back to memory\nconst memLS = new Map();\nconst LS = {\n  getItem(k) {\n    try {\n      return localStorage.getItem(k);\n    } catch {\n      return memLS.has(k) ? memLS.get(k) : null;\n    }\n  },\n  setItem(k, v) {\n    memLS.set(k, String(v));\n    try {\n      localStorage.setItem(k, v);\n    } catch {}\n  },\n  removeItem(k) {\n    memLS.delete(k);\n    try {\n      localStorage.removeItem(k);\n    } catch {}\n  },\n};\n\nconst loadSetting = (k, d) => {\n  try {\n    return JSON.parse(LS.getItem(k) || \"null\") ?? d;\n  } catch {\n    return d;\n  }\n};\nconst saveSetting = (k, v) => {\n  LS.setItem(k, JSON.stringify(v));\n  changed();\n};\n// when the shell finishes connecting to Claude, re-render\nwindow.addEventListener(\"cf-claude\", () => changed());\n\n// change bus: UI re-reads after any write\nconst bus = new EventTarget();\nlet changeTimer = null;\nfunction changed() {\n  clearTimeout(changeTimer);\n  changeTimer = setTimeout(() => bus.dispatchEvent(new Event(\"change\")), 60);\n}\n\n// ---------------------------------------------------------------- storage (IndexedDB)\nconst DB_NAME = \"content-factory-web\";\nlet dbp = null;\nlet storageBlocked = false;\n/** Minimal in-memory stand-in for IndexedDB, used when the browser blocks storage. */\nfunction memoryDb() {\n  const stores = { projects: new Map(), videos: new Map(), formats: new Map(), blobs: new Map(), kv: new Map() };\n  const keyPath = { projects: \"id\", videos: \"id\", formats: \"id\" };\n  const done = (result) => {\n    const r = { result };\n    queueMicrotask(() => r.onsuccess?.());\n    return r;\n  };\n  const store = (name) => {\n    const m = stores[name];\n    return {\n      get: (k) => done(structuredClone(m.get(k))),\n      getAll: () => done([...m.values()].map((v) => structuredClone(v))),\n      getAllKeys: () => done([...m.keys()]),\n      put: (v, k) => (m.set(k !== undefined ? k : v[keyPath[name]], v instanceof Blob ? v : structuredClone(v)), done(undefined)),\n      delete: (k) => (m.delete(k), done(undefined)),\n      index: (field) => ({ getAll: (val) => done([...m.values()].filter((v) => v[field] === val).map((v) => structuredClone(v))) }),\n    };\n  };\n  return {\n    transaction: (name) => {\n      const t = { objectStore: () => store(name) };\n      setTimeout(() => t.oncomplete?.(), 0);\n      return t;\n    },\n  };\n}\nfunction idb() {\n  if (dbp) return dbp;\n  dbp = new Promise((res) => {\n    let r;\n    const fallback = () => {\n      storageBlocked = true;\n      res(memoryDb());\n    };\n    try {\n      r = indexedDB.open(DB_NAME, 1);\n    } catch {\n      return fallback();\n    }\n    r.onupgradeneeded = () => {\n      const d = r.result;\n      d.createObjectStore(\"projects\", { keyPath: \"id\" });\n      d.createObjectStore(\"videos\", { keyPath: \"id\" }).createIndex(\"projectId\", \"projectId\");\n      d.createObjectStore(\"formats\", { keyPath: \"id\" });\n      d.createObjectStore(\"blobs\");\n      d.createObjectStore(\"kv\");\n    };\n    r.onsuccess = () => res(r.result);\n    r.onerror = () => fallback();\n    r.onblocked = () => fallback();\n  });\n  return dbp;\n}\nconst req = (r) => new Promise((res, rej) => ((r.onsuccess = () => res(r.result)), (r.onerror = () => rej(r.error))));\nasync function tx(store, mode, fn) {\n  const d = await idb();\n  const t = d.transaction(store, mode);\n  const out = await fn(t.objectStore(store));\n  await new Promise((res, rej) => ((t.oncomplete = res), (t.onerror = () => rej(t.error)), (t.onabort = () => rej(t.error))));\n  return out;\n}\nconst db = {\n  get: (s, k) => tx(s, \"readonly\", (o) => req(o.get(k))),\n  all: (s) => tx(s, \"readonly\", (o) => req(o.getAll())),\n  byIndex: (s, i, v) => tx(s, \"readonly\", (o) => req(o.index(i).getAll(v))),\n  put: async (s, v, k) => {\n    await tx(s, \"readwrite\", (o) => req(k === undefined ? o.put(v) : o.put(v, k)));\n    changed();\n    return v;\n  },\n  del: async (s, k) => {\n    await tx(s, \"readwrite\", (o) => req(o.delete(k)));\n    changed();\n  },\n};\n// serialize read-modify-write per row (several videos render at once)\nconst locks = new Map();\nasync function update(store, id, fn) {\n  const prev = locks.get(store + id) || Promise.resolve();\n  let release;\n  const p = new Promise((r) => (release = r));\n  locks.set(store + id, prev.then(() => p));\n  await prev;\n  try {\n    const cur = await db.get(store, id);\n    if (!cur) throw new Error(`${store} ${id} not found`);\n    const patch = typeof fn === \"function\" ? fn(cur) : fn;\n    const next = { ...cur, ...patch, updatedAt: now() };\n    await db.put(store, next);\n    return next;\n  } finally {\n    release();\n  }\n}\nconst kv = {\n  get: (k, d = null) => db.get(\"kv\", k).then((v) => (v === undefined ? d : v)),\n  set: (k, v) => db.put(\"kv\", v, k),\n};\nconst blobs = {\n  get: (k) => db.get(\"blobs\", k),\n  put: (k, b) => db.put(\"blobs\", b, k),\n  del: (k) => db.del(\"blobs\", k),\n};\n\n// ---------------------------------------------------------------- API keys (this browser only)\nconst KEY_DEFS = [\n  { name: \"ANTHROPIC_API_KEY\", label: \"Anthropic (Claude)\", unlocks: \"AI scripts\", url: \"https://console.anthropic.com/settings/keys\" },\n  { name: \"OPENAI_API_KEY\", label: \"OpenAI\", unlocks: \"AI scripts, voice, images, exact captions\", url: \"https://platform.openai.com/api-keys\" },\n  { name: \"ANTHROPIC_ADMIN_KEY\", label: \"Anthropic billing (admin)\", unlocks: \"Real Claude bills on the Money page\", url: \"https://console.anthropic.com/settings/admin-keys\", admin: true },\n  { name: \"OPENAI_ADMIN_KEY\", label: \"OpenAI billing (admin)\", unlocks: \"Real OpenAI bills on the Money page\", url: \"https://platform.openai.com/settings/organization/admin-keys\", admin: true },\n  { name: \"GEMINI_API_KEY\", label: \"Google Gemini\", unlocks: \"AI scripts, voice, images\", url: \"https://aistudio.google.com/apikey\" },\n  { name: \"ELEVENLABS_API_KEY\", label: \"ElevenLabs\", unlocks: \"Best AI voice\", url: \"https://elevenlabs.io/app/settings/api-keys\" },\n  { name: \"PEXELS_API_KEY\", label: \"Pexels\", unlocks: \"Free stock photos\", url: \"https://www.pexels.com/api/new/\" },\n];\nconst keys = {\n  all() {\n    try {\n      return JSON.parse(LS.getItem(\"cf-keys\") || \"{}\");\n    } catch {\n      return {};\n    }\n  },\n  get: (n) => keys.all()[n] || \"\",\n  set(n, v) {\n    const k = keys.all();\n    if (v) k[n] = v.trim();\n    else delete k[n];\n    LS.setItem(\"cf-keys\", JSON.stringify(k));\n    changed();\n  },\n};\nfunction detectKey(value) {\n  const v = value.trim();\n  if (/^sk-ant-admin/.test(v)) return \"ANTHROPIC_ADMIN_KEY\";\n  if (/^sk-admin-/.test(v)) return \"OPENAI_ADMIN_KEY\";\n  if (/^sk-ant-/.test(v)) return \"ANTHROPIC_API_KEY\";\n  if (/^AIza[0-9A-Za-z_-]{35}$/.test(v) || /^AQ\\.[0-9A-Za-z_-]{20,}$/.test(v)) return \"GEMINI_API_KEY\";\n  if (/^sk-(proj-|svcacct-)?[A-Za-z0-9_-]{20,}$/.test(v)) return \"OPENAI_API_KEY\";\n  if (/^sk_[A-Za-z0-9]{40,}$/.test(v) || /^[a-f0-9]{32}$/i.test(v)) return \"ELEVENLABS_API_KEY\";\n  if (/^[A-Za-z0-9]{56}$/.test(v)) return \"PEXELS_API_KEY\";\n  return null;\n}\n// keys from services this app doesn't use (yet), so we can say what they are instead of \"unknown\"\nconst OTHER_KEYS = [\n  [/^xai-[A-Za-z0-9]{20,}$/, \"an xAI (Grok) key\"],\n  [/^gsk_[A-Za-z0-9]{20,}$/, \"a Groq key\"],\n  [/^r8_[A-Za-z0-9]{20,}$/, \"a Replicate key\"],\n  [/^hf_[A-Za-z0-9]{20,}$/, \"a Hugging Face key\"],\n  [/^(ghp|gho|github_pat)_[A-Za-z0-9_]{20,}$/, \"a GitHub token (not an AI key: don't paste it here)\"],\n];\nconst ENV_NAMES = { ANTHROPIC: \"ANTHROPIC_API_KEY\", CLAUDE: \"ANTHROPIC_API_KEY\", GEMINI: \"GEMINI_API_KEY\", GOOGLE: \"GEMINI_API_KEY\", GOOGLEAI: \"GEMINI_API_KEY\", OPENAI: \"OPENAI_API_KEY\", SORA: \"OPENAI_API_KEY\", ELEVENLABS: \"ELEVENLABS_API_KEY\", ELEVEN: \"ELEVENLABS_API_KEY\", XI: \"ELEVENLABS_API_KEY\", PEXELS: \"PEXELS_API_KEY\" };\n/**\n * Pull every key out of pasted text: one key, several, or a whole .env file / note.\n * Returns [{ value, name (or null), named: true if the text said which service, other: what it is if unsupported }].\n */\nfunction findKeys(text) {\n  const out = [];\n  const seen = new Set();\n  for (const raw of String(text || \"\").split(/\\r?\\n/)) {\n    const line = raw.trim();\n    if (!line || /^#/.test(line)) continue;\n    // \"OPENAI_API_KEY=sk-...\" / \"openai: sk-...\" / \"export PEXELS_API_KEY='...'\"\n    const m = line.match(/^(?:export\\s+)?([A-Za-z][A-Za-z0-9_ ]*?)\\s*[:=]\\s*[\"']?([^\\s\"']{16,})[\"']?$/);\n    let hint = null, tokens;\n    if (m) {\n      const word = m[1].toUpperCase().replace(/[^A-Z]/g, \" \").split(/\\s+/).find((w) => ENV_NAMES[w]);\n      hint = word ? ENV_NAMES[word] : null;\n      if (hint && /ADMIN/i.test(m[1])) hint = hint.startsWith(\"ANTHROPIC\") ? \"ANTHROPIC_ADMIN_KEY\" : hint.startsWith(\"OPENAI\") ? \"OPENAI_ADMIN_KEY\" : hint;\n      tokens = [m[2]];\n    } else tokens = line.split(/[\\s,;|]+/);\n    for (let t of tokens) {\n      t = t.replace(/^[\"'`(<\\[]+|[\"'`)>\\].,]+$/g, \"\");\n      if (t.length < 20 || seen.has(t) || /^https?:/i.test(t) || !/^[A-Za-z0-9_\\-.]+$/.test(t)) continue;\n      seen.add(t);\n      const name = detectKey(t);\n      const other = OTHER_KEYS.find(([re]) => re.test(t))?.[1] || null;\n      out.push({ value: t, name: hint || name, named: !!hint, other: hint || name ? null : other });\n    }\n  }\n  return out;\n}\nconst mask = (v) => (v ? `${v.slice(0, 6)}…${v.slice(-4)}` : \"\");\n\n// ---------------------------------------------------------------- errors\nclass ProviderError extends Error {\n  constructor(code, message, opts = {}) {\n    super(message);\n    this.code = code;\n    this.retryable = opts.retryable ?? [\"rate_limit\", \"timeout\", \"network\"].includes(code);\n    this.provider = opts.provider;\n  }\n}\nasync function httpError(res, provider) {\n  const body = (await res.text().catch(() => \"\")).slice(0, 600);\n  const b = body.toLowerCase();\n  const msg = `${provider} HTTP ${res.status}: ${body}`;\n  if (res.status === 401 || res.status === 403 || /api key not valid|api_key_invalid|invalid api key/.test(b)) return new ProviderError(\"auth\", msg, { provider });\n  if (res.status === 402 || /quota|insufficient|credit|billing|exceeded your/.test(b)) return new ProviderError(\"quota\", msg, { provider });\n  if (res.status === 429) return new ProviderError(\"rate_limit\", msg, { provider });\n  if (/safety|content_policy|moderation|policy_violation|not allowed|blocked/.test(b)) return new ProviderError(\"content_blocked\", msg, { provider });\n  if (res.status === 408 || res.status === 504) return new ProviderError(\"timeout\", msg, { provider });\n  if (res.status >= 500) return new ProviderError(\"network\", msg, { provider, retryable: true });\n  return new ProviderError(\"unknown\", msg, { provider });\n}\nfunction toProviderError(e, provider) {\n  if (e instanceof ProviderError) return e;\n  const m = String(e?.message || e);\n  if (e?.name === \"AbortError\" || e?.name === \"TimeoutError\" || /timed? ?out/i.test(m)) return new ProviderError(\"timeout\", m, { provider });\n  if (/failed to fetch|networkerror|load failed|network/i.test(m)) return new ProviderError(\"network\", m, { provider });\n  if (/JSON/i.test(m)) return new ProviderError(\"bad_output\", m, { provider, retryable: true });\n  return new ProviderError(\"unknown\", m, { provider });\n}\nconst WHO = {\n  script: \"The writer\", script_check: \"The script checker\", scenes: \"The scene planner\", ideas: \"The idea maker\",\n  voice: \"The voice generator\", visuals: \"The image generator\", music: \"The music maker\", captions: \"The caption maker\",\n  assemble: \"The video editor\", final_check: \"The final check\", system: \"The app\", research: \"The video researcher\",\n};\nconst OPTIONAL = [\"script_check\", \"music\", \"captions\", \"final_check\"];\nfunction friendly(e, step) {\n  const pe = toProviderError(e);\n  const who = WHO[step] || \"Something\";\n  const t = {\n    budget: [\"This month's budget is used up.\", \"Raise the budget on the 💰 Money page (or switch to free options), then press Try again.\"],\n    missing_key: [`${who} isn't connected.`, \"Add its API key on the Connect AI page, or use the backup.\"],\n    auth: [`${who} rejected the API key.`, \"Check the key on the Connect AI page, or use the backup.\"],\n    rate_limit: [`${who} is busy.`, \"Wait a minute and try again, or use the backup.\"],\n    quota: [`${who} is out of credits.`, \"Top up that account, or use the backup.\"],\n    timeout: [`${who} took too long.`, \"Try again.\"],\n    network: [`Couldn't reach ${who.toLowerCase()}.`, \"Check your internet connection and try again.\"],\n    bad_output: [`${who} gave a weird answer.`, \"Try again. It usually works the second time.\"],\n    content_blocked: [`${who} refused this content.`, \"Use the backup, or make the request a bit less graphic.\"],\n    render_failed: [\"The video editor couldn't put the video together.\", \"Try again. If it keeps failing, redo the visuals.\"],\n    missing_asset: [\"A file this step needs went missing.\", \"Redo the part that made it (voice or visuals).\"],\n    quality_failed: [`${who}'s result didn't pass the quality check.`, \"Try again for a fresh version.\"],\n    unknown: [`Something went wrong with ${who.toLowerCase()}.`, \"Try again. Details are under Advanced.\"],\n  }[pe.code] || [\"Something went wrong.\", \"Try again.\"];\n  return {\n    code: pe.code, message: t[0], suggestion: t[1], technical: pe.message.slice(0, 2000),\n    canSkip: OPTIONAL.includes(step),\n    canBackup: [\"script\", \"script_check\", \"scenes\", \"ideas\", \"voice\", \"visuals\", \"captions\"].includes(step),\n    provider: pe.provider, at: now(),\n  };\n}\nasync function logError(projectId, videoId, step, error) {\n  console.error(`[${step}]`, error.technical);\n  const list = await kv.get(\"errors\", []);\n  list.unshift({ id: uid(), projectId, videoId, step, error, resolved: false, createdAt: now() });\n  await kv.set(\"errors\", list.slice(0, 200));\n}\nasync function resolveErrors(match) {\n  const list = await kv.get(\"errors\", []);\n  let n = 0;\n  for (const e of list) if (!e.resolved && match(e)) (e.resolved = true), n++;\n  if (n) await kv.set(\"errors\", list);\n}\n","10-content.js":"// ---------------------------------------------------------------- starter formats\n\n\n/** First entry is the default. \"Blank\" has no genre: the request decides everything. */\nconst STARTER_FORMATS = [\n  {\n    key: \"blank\",\n    name: \"Blank\",\n    emoji: \"📝\",\n    description: \"No preset style. The AI follows whatever you ask for.\",\n    hookStyle: \"Open with the most interesting line for this topic. No intro.\",\n    structure: \"Whatever suits the request: hook, build, payoff.\",\n    visualStyle: \"Clean, cinematic, vertical shots that match the topic\",\n    voiceStyle: \"natural, clear, engaging\",\n    captionStyle: \"bold-yellow\",\n    musicStyle: \"chill-pad\",\n    lengthSec: 40,\n  },\n  {\n    key: \"did-you-know\",\n    name: \"Did You Know\",\n    emoji: \"🧠\",\n    description: \"Surprising facts explained fast.\",\n    hookStyle: \"Lead with the most surprising fact as a direct statement or question.\",\n    structure: \"Surprising claim, quick explanation, 2-3 supporting details, a final fact that tops the first.\",\n    visualStyle: \"Bright, crisp close-ups and real-world shots of the subject, documentary look\",\n    voiceStyle: \"curious, upbeat, fast-paced explainer\",\n    captionStyle: \"bold-yellow\",\n    musicStyle: \"upbeat-pulse\",\n    lengthSec: 35,\n  },\n  {\n    key: \"top-5\",\n    name: \"Top 5 List\",\n    emoji: \"🔢\",\n    description: \"Countdown from onStyle: \"bold-yellow\",\n    musicStyle: \"upbeat-pulse\",\n    lengthSec: 30,\n  },\n  {\n    key: \"scary-story\",\n    name: \"Scary Story\",\n    emoji: \"👻\",\n    description: \"Creepy narration with a twist ending.\",\n    hookStyle: \"Open with an unsettling rule or a moment where something is wrong.\",\n    structure: \"Unsettling hook, normal setup, first wrong thing, escalation, twist that loops to the start.\",\n    visualStyle: \"Dark hallways, night streets, grainy film look, cold light\",\n    voiceStyle: \"low, slow, hushed\",\n    captionStyle: \"red-highlight\",\n    musicStyle: \"dark-drone\",\n    lengthSec: 45,\n  },\n];\n\n// ---------------------------------------------------------------- auto style + count\n// Pure helper (safe for client + server): pick a format from the request text.\nconst ALIASES = {\n  \"did you know\": [\"did you know\", \"fact\", \"facts\", \"trivia\", \"explainer\"],\n  \"top 5 list\": [\"top 5\", \"top five\", \"top 10\", \"top ten\", \"list\", \"ranking\", \"countdown\"],\n  storytime: [\"storytime\", \"story time\", \"my story\", \"true story\"],\n  motivation: [\"motivation\", \"motivational\", \"mindset\", \"discipline\", \"inspire\"],\n  \"product spotlight\": [\"product\", \"review\", \"ad \", \"ads\", \"promo\", \"unboxing\"],\n  \"scary story\": [\"scary\", \"horror\", \"creepy\", \"creepypasta\", \"ghost\", \"haunted\", \"urban legend\", \"napolitan\"],\n};\n\nfunction detectFormat(request, formats) {\n  const r = \" \" + request.toLowerCase().replace(/[-_]/g, \" \") + \" \";\n  let best;\n  for (const f of formats) {\n    const name = f.name.toLowerCase();\n    const words = [name, ...(ALIASES[name] || [])];\n    const score = Math.max(0, ...words.map((w) => (r.includes(w) ? w.length : 0)));\n    if (score > (best?.score || 0)) best = { f, score };\n  }\n  return best?.f || formats.find((f) => f.isDefault) || formats[0];\n}\n\n/** \"Make 10 ...\" / \"3 fact shorts\" -> number of videos (1-50). */\nfunction parseCount(request) {\n  const lead = request.match(/^\\s*(?:please\\s+)?(?:make|create|generate|give me|write|do)\\s+(?:me\\s+)?(\\d{1,2})\\b/i);\n  const noun = request.match(\n    /\\b(\\d{1,2})\\s+(?:[\\w'/-]+\\s+){0,5}?(videos?|shorts?|reels?|tiktoks?|clips?|stories|story|episodes?|parts?|files?|entries|posts?|scripts?|tales?|legends?)\\b/i,\n  );\n  const n = Number(lead?.[1] || noun?.[1] || 1);\n  return Math.min(50, Math.max(1, n));\n}\n\n// ---------------------------------------------------------------- prompts (short + structured)\n\n// Keep prompts short and structured. Only send what the step needs.\n\n// ---------------------------------------------------------------- languages\nconst LANGUAGES = [\n  [\"English\", \"English\"], [\"Korean\", \"한국어\"], [\"Japanese\", \"日本語\"], [\"Chinese\", \"中文\"], [\"Spanish\", \"Español\"],\n  [\"Portuguese\", \"Português\"], [\"French\", \"Français\"], [\"German\", \"Deutsch\"], [\"Italian\", \"Italiano\"], [\"Hindi\", \"हिन्दी\"],\n  [\"Indonesian\", \"Bahasa Indonesia\"], [\"Vietnamese\", \"Tiếng Việt\"], [\"Thai\", \"ไทย\"], [\"Filipino\", \"Filipino\"],\n  [\"Arabic\", \"العربية\"], [\"Russian\", \"Русский\"], [\"Turkish\", \"Türkçe\"],\n];\n/** Languages written without spaces are measured (and captioned) by characters. */\nconst CHAR_RATE = { Chinese: 4.5, Japanese: 7, Thai: 10 }; // spoken characters per second\nconst WORD_RATE = { Korean: 2.0, German: 2.2, Russian: 2.2, Arabic: 2.2, Hindi: 2.4, Spanish: 2.8, Italian: 2.7, French: 2.7, Portuguese: 2.7 };\nconst byChars = (lang) => lang in CHAR_RATE;\nconst unitName = (lang) => (byChars(lang) ? \"characters\" : \"words\");\nfunction countUnits(text, lang) {\n  if (byChars(lang)) return text.replace(/[\\s\\p{P}\\p{S}]/gu, \"\").length;\n  return text.split(/\\s+/).filter(Boolean).length;\n}\nconst WORDS_PER_SEC = 2.5;\nconst targetWords = (sec, lang = \"English\") => Math.round(sec * (CHAR_RATE[lang] || WORD_RATE[lang] || WORDS_PER_SEC));\nconst targetLines = (sec) => Math.max(5, Math.min(14, Math.round(sec / 3.5)));\n\n// ---------------------------------------------------------------- reference videos\n/** Short text block telling the AI what the user wants to copy (it can't watch the videos). */\nfunction refsText(refs) {\n  const research = refs?.files?.length ? researchText(refs.files) : \"\";\n  if (!refs || (!refs.links?.length && !refs.note)) return research;\n  const info = refs.info || [];\n  const lines = (refs.links || []).map((u, i) => {\n    const x = info[i] || {};\n    return `- ${x.title ? `\"${x.title.slice(0, 120)}\"` : u}${x.author ? ` by ${x.author}` : \"\"}`;\n  });\n  const linked = lines.length ? `Reference videos to match (you can't watch these links; go by the titles):\\n${lines.join(\"\\n\")}\\n` : \"\";\n  return `${linked}${refs.note ? `What the user wants to copy: ${refs.note.slice(0, 300)}\\n` : \"\"}${research}`.trim();\n}\n\nfunction ideasPrompt(request, format, count, language = \"English\", refs) {\n  return {\n    system: \"You plan short-form video series. Reply with JSON only.\",\n    prompt: `Request: ${request.slice(0, 400)}\nFormat: ${format.name}: ${format.description}\n${refsText(refs)}\nGive ${count} distinct video ideas. Each needs a different angle (place, object, rule, character, time). Write the titles and angles in ${language}.\nJSON: {\"ideas\":[{\"title\":\"max 8 words\",\"angle\":\"one sentence\"}]}`,\n    maxTokens: 120 + count * 60,\n  };\n}\n\nfunction scriptSystem(format, language) {\n  return `You write viral ${format.name} narration scripts for TikTok, Reels and Shorts.\nRules: line 1 is the hook and must grab in 2 seconds. No intro, no greeting, no \"today\". Every line adds something new and keeps momentum. End with a payoff: a twist, punchline, takeaway or a line that loops back to the start. Spoken words only, no stage directions or emojis. Write EVERYTHING (title, lines, caption, hashtags) in ${language}, natural and native-sounding, not translated.`;\n}\n\nfunction scriptSpec(format, lengthSec, language = \"English\", platforms = []) {\n  const rules = platformRulesText(platforms, lengthSec);\n  const posts = postsSpec(platforms);\n  return `Hook style: ${format.hookStyle}\nStructure: ${format.structure}\nNarrator: ${format.voiceStyle}\nLength: ${lengthSec}s = about ${targetWords(lengthSec, language)} ${unitName(language)} in ${targetLines(lengthSec)} lines (one beat per line, short lines).${rules ? \"\\n\" + rules : \"\"}\nJSON: {\"title\":\"max 8 words\",\"lines\":[\"...\"],\"caption\":\"one-sentence social caption\",\"hashtags\":[\"#tag\"]${posts ? ',\"posts\":{...}' : \"\"}}${posts ? \"\\n\" + posts : \"\"}`;\n}\n\nfunction scriptPrompt(o) {\n  return {\n    system: scriptSystem(o.format, o.language),\n    prompt: `Idea: ${o.idea}\nSeries: ${o.request.slice(0, 300)}\n${refsText(o.refs)}\n${scriptSpec(o.format, o.lengthSec, o.language, o.platforms)}`,\n    maxTokens: 900 + (o.platforms?.length || 0) * 120,\n  };\n}\n\nfunction rewritePrompt(o) {\n  return {\n    system: scriptSystem(o.format, o.language),\n    prompt: `Rewrite this draft and fix the issues. Keep what works.\nDraft:\n${o.script.lines.map((l, i) => `${i + 1}. ${l}`).join(\"\\n\")}\nIssues: ${o.issues.join(\"; \")}\n${scriptSpec(o.format, o.lengthSec, o.language, o.platforms)}`,\n    maxTokens: 900 + (o.platforms?.length || 0) * 120,\n  };\n}\n\nfunction checkPrompt(script, lengthSec, language = \"English\", platforms = []) {\n  const rules = platformRulesText(platforms, lengthSec);\n  return {\n    system: \"You are a strict short-form video script editor. Reply with JSON only.\",\n    prompt: `Target: ${lengthSec}s spoken in ${language}. Write the issues in English.\n${script.lines.map((l, i) => `${i + 1}. ${l}`).join(\"\\n\")}\n${rules ? rules + \"\\n\" : \"\"}Score 1-10: hook (grabs in 2s), pacing, escalation (keeps momentum), ending (strong payoff)${rules ? \", rules (follows every platform rule above; anything that could get it demonetized scores low)\" : \"\"}. List concrete fixes. pass=true only if every score >= 7.\nJSON: {\"hook\":0,\"pacing\":0,\"escalation\":0,\"ending\":0,${rules ? '\"rules\":0,' : \"\"}\"issues\":[\"...\"],\"pass\":true}`,\n    maxTokens: 300,\n  };\n}\n\nfunction scenesPrompt(lines, format) {\n  return {\n    system: \"You write image prompts for vertical short-form videos. Reply with JSON only.\",\n    prompt: `Visual style: ${format.visualStyle}\nFor each numbered line write one image prompt (max 30 words: concrete subject, setting, lighting; same style throughout; no text in image; no two alike) and 2-4 stock photo search keywords. Write prompts and keywords in English, whatever language the lines are in.\n${lines.map((l, i) => `${i + 1}. ${l}`).join(\"\\n\")}\nJSON: {\"scenes\":[{\"visual\":\"...\",\"search\":\"...\"}]} with exactly ${lines.length} items.`,\n    maxTokens: 120 + lines.length * 80,\n  };\n}\n\n// ---------------------------------------------------------------- offline practice writer (no AI)\n\n/**\n * Offline writer: template-based, no API. Lets the whole pipeline run without keys.\n * Quality is basic on purpose; the UI labels anything it makes as \"offline\".\n */\n\nfunction rng(seed) {\n  let h = 2166136261;\n  for (const c of seed) h = Math.imul(h ^ c.charCodeAt(0), 16777619);\n  return () => {\n    h = Math.imul(h ^ (h >>> 15), 2246822507);\n    h = Math.imul(h ^ (h >>> 13), 3266489909);\n    return ((h ^= h >>> 16) >>> 0) / 4294967296;\n  };\n}\nfunction shuffle(arr, r) {\n  const a = [...arr];\n  for (let i = a.length - 1; i > 0; i--) {\n    const j = Math.floor(r() * (i + 1));\n    [a[i], a[j]] = [a[j], a[i]];\n  }\n  return a;\n}\n\nfunction subjectOf(request) {\n  const m = request.match(/\\babout\\s+(.+?)[.!?]*$/i);\n  if (m) return m[1].replace(/^(an?|the)\\s+/i, \"\").trim();\n  return request.replace(/^(make|create|generate)\\s+\\d*\\s*/i, \"\").replace(/[.!?]+$/, \"\").trim() || \"this place\";\n}\n\nconst ANGLES = [\n  \"the part nobody talks about\", \"the biggest myth\", \"a beginner mistake\", \"the surprising origin\",\n  \"what experts know\", \"the weirdest example\", \"the hidden cost\", \"why it actually works\",\n  \"the one rule\", \"a real example\", \"the fastest way\", \"what changed everything\",\n  \"the secret detail\", \"the common mistake\", \"the untold story\", \"the best-kept secret\",\n  \"the first thing to know\", \"the big comeback\",\n];\n\nfunction family(f) {\n  const n = (f.name + \" \" + f.structure).toLowerCase();\n  if (/countdown|top \\d|list/.test(n)) return \"list\";\n  if (/fact|did you know/.test(n)) return \"facts\";\n  if (/scary|horror|creepy|unsettling/.test(n)) return \"scary\";\n  if (/storytime|first-person|story/.test(n)) return \"story\";\n  if (/motivation|mindset|hard truth/.test(n)) return \"motivation\";\n  if (/product|call to action/.test(n)) return \"product\";\n  return \"generic\";\n}\n\nconst POOLS = {\n  generic: {\n    hook: [\"Here's what nobody tells you about {S}.\", \"Most people get {S} wrong. Here's {A}.\"],\n    mid: [\n      \"It starts with something simple that almost everyone overlooks.\",\n      \"Once you notice it, you'll start seeing it everywhere.\",\n      \"The reason behind it is surprisingly practical.\",\n      \"Here's a quick example that makes it click.\",\n      \"And this is exactly where most people give up.\",\n      \"But the ones who stick with it see a huge difference.\",\n      \"The trick is to focus on one small thing first.\",\n      \"That one change makes everything after it easier.\",\n    ],\n    end: [\"Now you know more about {S} than most people. Follow for part two.\", \"Save this so you remember it next time {S} comes up.\"],\n  },\n  facts: {\n    hook: [\"Did you know this about {S}? It sounds fake, but it's true.\", \"This one fact about {S} changes how you see it.\"],\n    mid: [\n      \"Scientists only figured this out surprisingly recently.\",\n      \"It all comes down to one simple reason.\",\n      \"And it's not the only strange thing about {S}.\",\n      \"Here's a detail most people have never heard.\",\n      \"It happens far more often than you'd think.\",\n      \"People have been getting this wrong for years.\",\n      \"Once you know why, it actually makes perfect sense.\",\n    ],\n    end: [\"But the strangest part about {S}? Follow and I'll tell you next time.\", \"Tell someone this today and watch their reaction.\"],\n  },\n  story: {\n    hook: [\"I still can't believe what happened with {S}.\", \"This is the story of {A}, and it still gets me.\"],\n    mid: [\n      \"It was a completely normal day. Nothing seemed off.\",\n      \"Then one small thing caught my attention.\",\n      \"I tried to ignore it, but it kept happening.\",\n      \"So I decided to find out what was going on.\",\n      \"What I found was not what I expected at all.\",\n      \"Everyone around me had known the whole time.\",\n      \"And nobody had said a word.\",\n    ],\n    end: [\"I see {S} completely differently now.\", \"Part two is even crazier. Follow so you don't miss it.\"],\n  },\n  motivation: {\n    hook: [\"Nobody is coming to save you. Not with {S}, not with anything.\", \"If {S} feels hard right now, listen to this.\"],\n    mid: [\n      \"Most people wait until they feel ready. They never do.\",\n      \"Discipline beats motivation every single time.\",\n      \"You don't need a perfect plan. You need a first step.\",\n      \"The people you admire were once exactly where you are.\",\n      \"Every day you show up, you get a little harder to stop.\",\n      \"Stop counting the days. Make the days count.\",\n    ],\n    end: [\"Start today. Your future self is watching.\", \"Save this for the day you want to quit.\"],\n  },\n  product: {\n    hook: [\"Tired of struggling with {S}? This changes everything.\", \"If you care about {S}, you need to see this.\"],\n    mid: [\n      \"Here's the problem. Most options are overpriced and overcomplicated.\",\n      \"This one is different.\",\n      \"First, it's ridiculously easy to use.\",\n      \"Second, it saves you time every single day.\",\n      \"Third, it's built to last.\",\n      \"It's perfect if you want results without the hassle.\",\n    ],\n    end: [\"Check the link in my bio and see for yourself.\", \"Comment if you want the full breakdown.\"],\n  },\n  scary: {\n    hook: [\"I knew something was wrong with {S} the night I found {A}.\", \"There's a rule about {S}. Never break it.\"],\n    mid: [\n      \"It started small. A door I'd locked was open.\",\n      \"Nobody had lived upstairs for years. I heard footsteps every night.\",\n      \"At exactly three thirty three, the footsteps stopped.\",\n      \"Then something started breathing on the other side of my door.\",\n      \"Every photo from that night had a figure in the background.\",\n      \"Closer in every one.\",\n      \"I don't remember opening the door. But it was unlocked from the inside.\",\n    ],\n    end: [\"I moved out last week. Last night, I heard footsteps again.\", \"I'm telling you so you'll recognize it. It's coming to you next.\"],\n  },\n};\n\nconst LIST_ITEMS = [\n  \"the hidden gem. It's better than it has any right to be.\",\n  \"the classic. It still holds up after all these years.\",\n  \"the underrated one. Almost nobody talks about it.\",\n  \"the one that went viral, and honestly, for good reason.\",\n  \"the one experts swear by.\",\n  \"the surprise pick. You won't see it coming.\",\n];\nconst NUM = [\"One\", \"Two\", \"Three\", \"Four\", \"Five\"];\n\n// extra beats so practice scripts can reach any length (e.g. over 1 minute for TikTok pay)\nconst EXTRA_LINES = [\n  \"Here's the part most people skip about {S}.\",\n  \"Think about it this way: everyone who's good at {S} started out confused.\",\n  \"The first time I looked into {S}, I got this completely wrong.\",\n  \"And the small details matter more than you'd expect.\",\n  \"Little changes here add up faster than you think.\",\n  \"Let's slow down for a second and look at why that works.\",\n  \"Here's a quick example that makes it click.\",\n  \"Most advice about {S} leaves this part out completely.\",\n  \"If you only remember one thing from this video, remember this.\",\n  \"It sounds simple, but almost nobody does it every single time.\",\n  \"That's exactly why {A} matters so much.\",\n  \"Now here's where it gets really interesting.\",\n  \"Try it once and you'll notice the difference straight away.\",\n  \"People who get {S} right all seem to share this one habit.\",\n  \"So what does that actually mean for you, day to day?\",\n  \"Here's the simplest way to put it into practice.\",\n];\nfunction writeScript(input) {\n  const r = rng(input.idea + input.format.name);\n  const S = subjectOf(input.request || input.idea);\n  const pick = ANGLES[Math.floor(r() * ANGLES.length)];\n  const A = input.angle && input.angle.length <= 40 && !/^make\\b/i.test(input.angle) ? input.angle : pick;\n  const fam = family(input.format);\n  const fill = (x) => x.replaceAll(\"{S}\", S).replaceAll(\"{A}\", A);\n  const target = Math.round(input.lengthSec * 2.5);\n  let lines;\n  if (fam === \"list\") {\n    const items = shuffle(LIST_ITEMS, r).slice(0, 5);\n    lines = [\n      fill(\"Here are the top five {S} you need to know. Number one will surprise you.\"),\n      ...items.map((it, i) => `Number ${NUM[4 - i].toLowerCase()}: ${it}`),\n      \"Which one would you pick? Tell me in the comments.\",\n    ];\n  } else {\n    const pool = POOLS[fam];\n    const nMid = Math.max(3, Math.min(pool.mid.length, Math.round(target / 12) - 2));\n    lines = [\n      fill(pool.hook[Math.floor(r() * pool.hook.length)]),\n      ...shuffle(pool.mid, r).slice(0, nMid).map(fill),\n      fill(pool.end[Math.floor(r() * pool.end.length)]),\n    ];\n  }\n  // still short of the length? add more real beats before the ending (never repeats a line)\n  const words = (ls) => ls.join(\" \").split(/\\s+/).length;\n  const extras = shuffle(EXTRA_LINES, r).map(fill);\n  while (words(lines) < target && extras.length) lines.splice(lines.length - 1, 0, extras.shift());\n  const title = `${cap(S)}: ${cap(A)}`;\n  const tag = (x) => \"#\" + x.toLowerCase().replace(/[^a-z0-9]/g, \"\");\n  return {\n    title,\n    hook: lines[0],\n    lines,\n    caption: `${title}. What do you think?`,\n    hashtags: [\"#fyp\", ...(fam === \"generic\" ? [] : [tag(input.format.name)]), tag(S.split(\" \").slice(-1)[0] || \"shorts\")].filter((h) => h.length > 1),\n  };\n}\nconst cap = (s) => s.replace(/\\b\\w/g, (c) => c.toUpperCase());\n\nconst STOP = new Set(\"the a an of to in on at and or is are was it if you your do not with for from that this be by as\".split(\" \"));\nfunction keywords(text, style) {\n  const words = text.toLowerCase().replace(/[^a-z\\s]/g, \"\").split(/\\s+/).filter((w) => w.length > 3 && !STOP.has(w));\n  return [...new Set(words)].slice(0, 3).join(\" \") || style.split(\",\")[0];\n}\n\n\n// ---------------------------------------------------------------- style from a free-text content type\nconst CAPTION_OPTIONS = [\"bold-yellow\", \"clean-white\", \"red-highlight\", \"glitch\"];\nconst MUSIC_OPTIONS = [\"chill-pad\", \"upbeat-pulse\", \"tense-pulse\", \"dark-drone\", \"eerie-tone\", \"none\"];\nfunction designPrompt(contentType, request, refs, platforms = []) {\n  const ps = pickPlatforms(platforms);\n  return {\n    system: `You design the style for a series of short-form videos (${ps.length ? ps.map((p) => p.name).join(\", \") : \"TikTok, Reels, Shorts\"}). Reply with JSON only.`,\n    prompt: `Content type: ${contentType || \"(not given: work it out from the request)\"}\nRequest: ${request.slice(0, 300)}\n${refsText(refs)}\n${ps.length ? \"The style must be original and advertiser-friendly so it can earn on these platforms (no copied characters or brands).\" : \"\"}\nDesign a style that fits. captionStyle is one of: ${CAPTION_OPTIONS.join(\", \")}. musicStyle is one of: ${MUSIC_OPTIONS.join(\", \")}. lengthSec between 20 and 60.\nJSON: {\"name\":\"2-4 words\",\"emoji\":\"one emoji\",\"description\":\"one line\",\"hookStyle\":\"how line 1 grabs\",\"structure\":\"beat by beat\",\"visualStyle\":\"what the pictures look like\",\"voiceStyle\":\"how the narrator sounds\",\"captionStyle\":\"bold-yellow\",\"musicStyle\":\"chill-pad\",\"lengthSec\":40}`,\n    maxTokens: 500,\n  };\n}\n/** Without AI: pick the closest built-in style and name it after what was typed. */\nfunction fallbackStyle(contentType, request) {\n  const base = detectFormat(`${contentType || \"\"} ${request}`, STARTER_FORMATS.map((f, i) => ({ ...f, id: f.key, isDefault: i === 0 })));\n  const { key, id, isDefault, ...rest } = base;\n  const name = (contentType || \"\").trim();\n  return name ? { ...rest, name: name.slice(0, 40), emoji: rest.emoji, description: name } : rest;\n}\nfunction cleanStyle(j, fallback) {\n  const s = { ...fallback };\n  for (const k of [\"name\", \"emoji\", \"description\", \"hookStyle\", \"structure\", \"visualStyle\", \"voiceStyle\"]) if (j?.[k]) s[k] = String(j[k]).slice(0, 400);\n  if (CAPTION_OPTIONS.includes(j?.captionStyle)) s.captionStyle = j.captionStyle;\n  if (MUSIC_OPTIONS.includes(j?.musicStyle)) s.musicStyle = j.musicStyle;\n  if (Number(j?.lengthSec)) s.lengthSec = clamp(Math.round(Number(j.lengthSec)), 20, 60);\n  s.name = s.name.slice(0, 40);\n  s.emoji = [...String(s.emoji || \"🎬\")].slice(0, 2).join(\"\");\n  return s;\n}\n","15-platforms.js":"// ---------------------------------------------------------------- platforms + monetization rules\n// Rules as researched in Nov 2026. Platforms change these often; the app shows \"check\" notes\n// and never promises approval (most programs also need follower/view counts a video can't change).\nconst RULES_CHECKED = \"Nov 2026\";\nconst CHINA_BASE = [\n  \"AI-generated content must be labelled (China's AI labelling rules, in force since 1 Sep 2025): a visible 'AI生成' mark on the video plus ls → tick “Altered or synthetic content” when realistic AI scenes or voices are used.\",\n    safe: { right: 140, bottom: 400 },\n  },\n  {\n    id: \"instagram\", name: \"Instagram Reels\", emoji: \"📸\", region: \"global\", payMinSec: 0, maxSec: 180, tags: [3, 5], titleMax: 0,\n    program: \"Reels bonuses (invite only) + brand deals\",\n    needs: \"Professional (Creator/Business) account, 18+, eligible country, Partner Monetization Policies. Per-view bonuses are invite-only.\",\n    rules: [\n      \"Original content: reposts and videos with other apps' watermarks get shown to fewer people\",\n      \"No unlicensed music, no misleading or engagement-bait captions\",\n      \"Realistic AI video should carry Meta's AI label\",\n    ],\n    ai: \"When posting: Advanced settings → turn on “AI label”.\",\n    safe: { right: 130, bottom: 380 },\n  },\n  {\n    id: \"facebook\", name: \"Facebook Reels\", emoji: \"📘\", region: \"global\", payMinSec: 0, maxSec: 180, tags: [2, 4], titleMax: 0,\n    program: \"Facebook Content Monetization\",\n    needs: \"Professional mode on, Partner Monetization Policies, eligible country. Your eligibility checklist is in the Professional dashboard.\",\n    rules: [\n      \"Original content only: re-uploads from other pages earn nothing and can lose eligibility\",\n      \"No engagement bait (\\\"share if you agree\\\"), no misleading claims\",\n      \"Realistic AI video should carry Meta's AI label\",\n    ],\n    ai: \"When posting: turn on the “AI info” label for realistic AI scenes.\",\n    safe: { right: 130, bottom: 420 },\n  },\n  {\n    id: \"snapchat\", name: \"Snapchat Spotlight\", emoji: \"👻\", region: \"global\", payMinSec: 60, maxSec: 300, tags: [1, 3], titleMax: 0,\n    program: \"Snapchat Unified Monetization Program\",\n    needs: \"Snap Star status, 50,000 followers, 25+ posts a month, and 100 hours of Spotlight view time in 28 days. Videos must be at least 1 minute to share revenue.\",\n    rules: [\"Spotlight videos must be at least 1 minute to earn\", \"Original content; no watermarks from other apps\", \"Post often: 25+ times a month is a requirement\"],\n    ai: \"Add an AI note in the caption for realistic AI scenes.\",\n    safe: { right: 120, bottom: 360 },\n  },\n  {\n    id: \"douyin\", name: \"Douyin 抖音\", emoji: \"🎶\", region: \"china\", payMinSec: 0, maxSec: 900, tags: [3, 5], titleMax: 55,\n    program: \"Xingtu brand deals, product links, creator programs\",\n    needs: \"Real-name verified account; programs and follower thresholds are listed in 创作者服务中心. Paid videos need 100,000+ followers.\",\n    rules: [...CHINA_BASE, \"Undeclared AI content can have earnings suspended and followers reduced\"],\n    ai: \"When posting: 高级设置 → 作者声明 → “内容由AI生成”.\",\n    safe: { right: 150, bottom: 430 },\n  },\n  {\n    id: \"kuaishou\", name: \"Kuaishou 快手\", emoji: \"⚡\", region: \"china\", payMinSec: 0, maxSec: 900, tags: [3, 5], titleMax: 50,\n    program: \"Creator incentives, brand deals (磁力聚星), product links\",\n    needs: \"Real-name verified account; see 创作者中心 for the programs you qualify for.\",\n    rules: [...CHINA_BASE],\n    ai: \"When posting: choose the AI-generated content declaration (作者声明 → AI生成).\",\n    safe: { right: 150, bottom: 420 },\n  },\n  {\n    id: \"xiaohongshu\", name: \"Xiaohongshu 小红书\", emoji: \"📕\", region: \"china\", payMinSec: 0, maxSec: 900, tags: [3, 8], titleMax: 20,\n    program: \"Pugongying (蒲公英) brand deals, paid content (invite)\",\n    needs: \"Real-name verified account; brand deals go through 蒲公英 once you qualify.\",\n    rules: [...CHINA_BASE, \"Brand collaborations must be declared through 蒲公英; hidden ads get limited\", \"Titles are max 20 characters; useful, honest 'notes' tone\"],\n    ai: \"When posting: 高级选项 → 内容类型声明 → “AI生成”.\",\n    safe: { right: 120, bottom: 360 },\n  },\n  {\n    id: \"wechat\", name: \"WeChat Channels 视频号\", emoji: \"💬\", region: \"china\", payMinSec: 0, maxSec: 1800, tags: [2, 4], titleMax: 16,\n    program: \"Creator share programs, brand deals (互选), product links\",\n    needs: \"Real-name verified account; see 视频号助手 for the programs you qualify for.\",\n    rules: [...CHINA_BASE],\n    ai: \"When posting: 声明 → “该内容由AI生成”.\",\n    safe: { right: 130, bottom: 400 },\n  },\n  {\n    id: \"bilibili\", name: \"Bilibili 哔哩哔哩\", emoji: \"📺\", region: \"china\", payMinSec: 0, maxSec: 3600, tags: [5, 10], titleMax: 80,\n    program: \"创作激励计划 (Creation Incentive)\",\n    needs: \"Apply in 创作中心 → 创作激励 (last published rule: creativity or influence score 55+, credit score 80+).\",\n    rules: [\n      ...CHINA_BASE,\n      \"Incentive pay: video must be self-made (自制) with NO commercial promotion (no logos, ads or sponsor reads)\",\n      \"Must be published on Bilibili first, not later than on other platforms\",\n      \"Viewers prefer depth: explain more, rush less\",\n    ],\n    ai: \"When posting: 创作声明 → “作者声明：使用AI合成技术”.\",\n    safe: { right: 130, bottom: 380 },\n  },\n];\nconst platformById = (id) => PLATFORMS.find((p) => p.id === id);\nconst pickPlatforms = (ids) => (ids || []).map(platformById).filter(Boolean);\nconst hasChina = (ids) => pickPlatforms(ids).some((p) => p.region === \"china\");\n/** Shortest length (seconds) a video must reach to earn on the chosen platforms (0 = none). */\nconst payMinSec = (ids) => Math.max(0, ...pickPlatforms(ids).map((p) => p.payMinSec || 0));\n/** Length to aim for when the user picked \"Auto\": clear the pay minimum with room to spare. */\nconst platformAutoLength = (ids, styleLen) => (payMinSec(ids) ? Math.max(styleLen || 0, payMinSec(ids) + 9) : styleLen);\n/** Keep captions clear of the like/comment buttons on every chosen platform. */\nfunction safeZone(ids) {\n  const ps = pickPlatforms(ids);\n  return { right: Math.max(90, ...ps.map((p) => p.safe.right)), bottom: Math.max(330, ...ps.map((p) => p.safe.bottom)) };\n}\n\n/** Rules block for the AI writer. Kept short so it costs few tokens. */\nfunction platformRulesText(ids, lengthSec) {\n  const ps = pickPlatforms(ids);\n  if (!ps.length) return \"\";\n  const lines = [`This video will be posted on: ${ps.map((p) => p.name).join(\", \")}. It must follow every rule so it can earn money there:`];\n  lines.push(\"- Original and transformative: a real angle, story, facts or opinion; never a copy or a generic template; no copyrighted characters, songs, film clips or real people's likeness\");\n  lines.push(\"- Advertiser-friendly: no shocking, hateful, sexual, dangerous-stunt or misleading content; no fake claims; no engagement bait\");\n  const min = payMinSec(ids);\n  if (min) lines.push(`- Spoken narration must run at least ${min + 4} seconds (${ps.filter((p) => p.payMinSec).map((p) => p.name).join(\" and \")} only pay for videos over 1 minute)${lengthSec && lengthSec < min ? \" (the user picked a shorter length, so it won't earn there)\" : \"\"}`);\n  if (ids.includes(\"bilibili\")) lines.push(\"- No brand names, product plugs or sponsor reads (Bilibili incentive pay requires no commercial promotion)\");\n  if (hasChina(ids)) lines.push(\"- Chinese platforms: avoid politics, military, sensitive history, superstition and absolute words like 最/第一/100%; no exaggerated health or money claims\");\n  if (ids.includes(\"youtube\")) lines.push(\"- Make this video clearly different from the others in the series (YouTube rejects repetitive mass-produced channels)\");\n  return lines.join(\"\\n\");\n}\n/** JSON fields the writer fills in: post text for each platform. */\nfunction postsSpec(ids) {\n  const ps = pickPlatforms(ids);\n  if (!ps.length) return \"\";\n  return `Also write the post text for each platform in the same language as the script (titles within the limit, hashtags in that platform's style, no banned words):\n\"posts\":{${ps.map((p) => `\"${p.id}\":{${p.titleMax ? `\"title\":\"max ${p.titleMax} chars\",` : \"\"}\"caption\":\"...\",\"hashtags\":[${p.tags[1]} tags]}`).join(\",\")}}`;\n}\n/** Fill in post text for every platform, using the general caption when the AI left one out. */\nfunction normalizePosts(ids, j, base) {\n  const out = {};\n  for (const p of pickPlatforms(ids)) {\n    const x = (j && typeof j === \"object\" && j[p.id]) || {};\n    const tags = (Array.isArray(x.hashtags) && x.hashtags.length ? x.hashtags : base.hashtags || [])\n      .map((t) => String(t).trim().replace(/^#?/, \"#\").replace(/\\s+/g, \"\"))\n      .filter((t) => t.length > 1)\n      .slice(0, p.tags[1]);\n    const title = p.titleMax ? [...String(x.title || base.title || \"\")].slice(0, p.titleMax).join(\"\") : \"\";\n    out[p.id] = { title, caption: String(x.caption || base.caption || \"\").slice(0, 2000), hashtags: tags };\n  }\n  return out;\n}\nconst postText = (post) => [post.title, post.caption, post.hashtags.join(\" \")].filter(Boolean).join(\"\\n\\n\");\n\n/** Per-platform readiness for a finished video. Warnings don't stop the video; they explain. */\nfunction platformReport(ids, { seconds, aiLabel, sora }) {\n  const rep = {};\n  for (const p of pickPlatforms(ids)) {\n    const notes = [];\n    let ok = true;\n    if (p.payMinSec && seconds < p.payMinSec) {\n      ok = false;\n      notes.push(`${Math.round(seconds)}s: under 1 minute, so it won't earn ${p.program}`);\n    }\n    if (seconds > p.maxSec) {\n      ok = false;\n      notes.push(`Too long for ${p.name} (max ${p.maxSec}s)`);\n    }\n    if (p.region === \"china\" && !aiLabel) {\n      ok = false;\n      notes.push(\"Missing the visible AI生成 label Chinese platforms require\");\n    }\n    notes.push(p.ai + (sora ? \" (needed: this video has realistic AI clips)\" : \"\"));\n    rep[p.id] = { ok, notes };\n  }\n  return rep;\n}\n","20-providers.js":"// ---------------------------------------------------------------- formats (stored in this browser)\nasync function listFormats() {\n  let rows = await db.all(\"formats\");\n  if (!rows.length && !(await kv.get(\"seeded\"))) {\n    const t = Date.now();\n    for (const [i, { key, ...rest }] of STARTER_FORMATS.entries())\n      await db.put(\"formats\", { ...rest, id: key, isDefault: i === 0, isStarter: true, createdAt: new Date(t + i).toISOString(), updatedAt: now() });\n    await kv.set(\"seeded\", true);\n    rows = await db.all(\"formats\");\n  }\n  return rows.sort((a, b) => (a.createdAt < b.createdAt ? -1 : 1));\n}\nconst FORMAT_FIELDS = [\"name\", \"emoji\", \"description\", \"hookStyle\", \"structure\", \"visualStyle\", \"voiceStyle\", \"captionStyle\", \"musicStyle\", \"lengthSec\"];\nconst cleanFormat = (p) => {\n  const o = {};\n  for (const k of FORMAT_FIELDS) if (p[k] !== undefined) o[k] = p[k];\n  if (o.lengthSec !== undefined) o.lengthSec = clamp(Number(o.lengthSec) || 40, 15, 90);\n  return o;\n};\nasync function createFormat(p = {}) {\n  const base = STARTER_FORMATS[0];\n  const { key, ...rest } = base;\n  return db.put(\"formats\", { ...rest, name: \"My Format\", emoji: \"✨\", ...cleanFormat(p), id: uid(), isDefault: false, isStarter: false, createdAt: now(), updatedAt: now() });\n}\nasync function setDefaultFormat(id) {\n  for (const f of await listFormats()) if (f.isDefault !== (f.id === id)) await db.put(\"formats\", { ...f, isDefault: f.id === id });\n}\nasync function deleteFormat(id) {\n  const f = await db.get(\"formats\", id);\n  await db.del(\"formats\", id);\n  if (f?.isDefault) {\n    const next = (await listFormats())[0];\n    if (next) await setDefaultFormat(next.id);\n  }\n}\nasync function restoreStarters() {\n  const have = new Set((await db.all(\"formats\")).map((f) => f.id));\n  for (const { key, ...rest } of STARTER_FORMATS)\n    if (!have.has(key)) await db.put(\"formats\", { ...rest, id: key, isDefault: false, isStarter: true, createdAt: now(), updatedAt: now() });\n}\n\n// ---------------------------------------------------------------- pricing (rough USD estimates)\nconst TOKEN_PRICES = { \"gpt-4.1-mini\": [0.4, 1.6], \"gpt-4.1\": [2, 8], \"claude-haiku-5-5\": [1, 5], \"claude-sonnet-5-5\": [3, 15] };\nfunction tokenCost(model, i, o) {\n  const k = Object.keys(TOKEN_PRICES).find((m) => model.startsWith(m));\n  const [a, b] = k ? TOKEN_PRICES[k] : [3, 15];\n  return (i * a + o * b) / 1e6;\n}\nconst PRICE = { openaiTtsPerChar: 0.000015, elevenlabsPerChar: 0.00018, openaiImage: 0.106, whisperPerMinute: 0.006 };\nconst MODELS = {\n  anthropic: { cheap: \"claude-haiku-5-5\", quality: \"claude-sonnet-5-5\" },\n  openai: { cheap: \"gpt-4.1-mini\", quality: \"gpt-4.1\" },\n};\n/** Claude models you can pick for writing scripts and for the change-the-app chat. */\nconst CLAUDE_MODELS = [\n  [\"claude-opus-5-5\", \"Opus 5.5\", \"best writing, slower\"],\n  [\"claude-sonnet-5-5\", \"Sonnet 5.5\", \"great + fast (recommended)\"],\n  [\"claude-haiku-5-5\", \"Haiku 5.5\", \"fastest, simplest\"],\n];\nconst modelChoice = (role) => loadSetting(\"cf-models\", {})[role] || \"claude-sonnet-5-5\";\nTOKEN_PRICES[\"claude-opus-5-5\"] = [5, 25];\n\n// Inside claude.ai the page can't reach other websites, so key-based services are off there.\nconst CLAUDE = () => window.__cfClaude || { inClaude: false };\nconst canFetch = () => !CLAUDE().inClaude;\nconst timeout = (ms) => (AbortSignal.timeout ? AbortSignal.timeout(ms) : undefined);\nasync function blobToBase64(blob) {\n  const bytes = new Uint8Array(await blob.arrayBuffer());\n  let s = \"\";\n  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));\n  return btoa(s);\n}\n\n// ---------------------------------------------------------------- AI writers\n/** Writer on the viewer's own Claude account (only when the app runs inside claude.ai). */\nconst claudeAccountLlm = {\n  id: \"claude-account\", label: \"Your Claude account\", cap: \"llm\",\n  available: () => !!CLAUDE().sample && !CLAUDE().declined,\n  async complete(r) {\n    const model = r.tier === \"quality\" ? modelChoice(\"writer\") : \"claude-haiku-5-5\";\n    const tier = model === \"claude-opus-5-5\" ? \"complex\" : model === \"claude-haiku-5-5\" ? \"quick\" : \"default\";\n    try {\n      const opts = { model, modelTier: tier, cache: false };\n      if (r.images?.length) {\n        const lim = await CLAUDE().sample.limits().catch(() => null);\n        if (!lim?.images) throw new ProviderError(\"missing_key\", \"This Claude view can't look at pictures\", { provider: \"claude-account\" });\n        opts.images = r.images.slice(0, lim.images.maxCount || 8);\n      }\n      const { text } = await CLAUDE().sample(`${r.system}\\n\\n${r.prompt}\\n\\nReply with only the JSON, no other text.`, opts);\n      return { text, model, cost: 0 };\n    } catch (e) {\n      throw sampleProviderError(e);\n    }\n  },\n};\nfunction sampleProviderError(e) {\n  const c = e?.code;\n  const m = `Claude account: ${c || \"error\"} ${e?.message || \"\"}`;\n  if (c === \"not_granted\" || c === \"sampling_disabled\" || c === \"session_expired\") {\n    if (c === \"not_granted\") CLAUDE().declined = true;\n    return new ProviderError(\"auth\", m, { provider: \"claude-account\" });\n  }\n  if (c === \"rate_limited\") return new ProviderError(\"quota\", m, { provider: \"claude-account\", retryable: false });\n  if (c === \"refused\") return new ProviderError(\"content_blocked\", m, { provider: \"claude-account\" });\n  if (c === \"invalid_json\" || c === \"empty_completion\") return new ProviderError(\"bad_output\", m, { provider: \"claude-account\", retryable: true });\n  if (c === \"upstream_error\") return new ProviderError(\"network\", m, { provider: \"claude-account\", retryable: true });\n  return new ProviderError(\"unknown\", m, { provider: \"claude-account\" });\n}\nconst anthropicLlm = {\n  id: \"anthropic\", label: \"Anthropic API\", cap: \"llm\",\n  available: () => canFetch() && !!keys.get(\"ANTHROPIC_API_KEY\"),\n  async complete(r) {\n    const model = r.tier === \"quality\" ? modelChoice(\"writer\") : MODELS.anthropic.cheap;\n    const res = await fetch(\"https://api.anthropic.com/v1/messages\", {\n      method  && i > 0 ? { ...ctx, state: { ...ctx.state, avoid: [...(ctx.state.avoid || []), \"sora\"] } } : ctx;\n      const { result, provider } = await withProviders(\"image\", sctx, (p) =>\n        p.generate({ prompt: s.visual, search: s.search, text: s.text, format: ctx.project.format, avoid: done.map((d) => d.sourceId).filter(Boolean), seconds: durs[i] }),\n      );\n      const key = blobKey(ctx.video, \"scene\" + i);\n      await blobs.put(key, result.blob);\n      cost += result.cost || 0;\n      done.push({ key, provider: provider.id, sourceId: result.sourceId, video: !!result.video });\n      await ctx.progress({ partial: done }); // keep finished images if a later one fails\n    }\n    return { output: { images: done.map((d) => d.key), clips: done.filter((d) => d.video).length, partial: done }, provider: [...new Set(done.map((d) => d.provider))].join(\", \"), cost };\n  },\n  async music(ctx) {\n    const style = ctx.project.format.musicStyle;\n    if (!style || style === \"none\") return { output: { none: true }, skipped: true };\n    return { output: { style }, provider: \"generated\" };\n  },\n  async captions(ctx) {\n    const v = ctx.video.steps.voice.output;\n    const text = ctx.video.steps.script.output.lines.join(\" \");\n    const audio = v.key ? await blobs.get(v.key) : null;\n    const { result, provider } = await withProviders(\"captions\", ctx, (p) => p.timings({ audio, text, duration: v.duration, language: ctx.project.language }));\n    return { output: { words: result.words }, provider: provider.id, cost: result.cost };\n  },\n  async assemble(ctx) {\n    const st = ctx.video.steps;\n    const images = await Promise.all(st.visuals.output.images.map((k) => blobs.get(k)));\n    if (images.some((b) => !b)) throw new ProviderError(\"missing_asset\", \"A scene image is missing\");\n    const voiceBlob = st.voice.output.key ? await blobs.get(st.voice.output.key) : null;\n    if (st.voice.output.key && !voiceBlob) throw new ProviderError(\"missing_asset\", \"Voice audio is missing\");\n    try {\n      const out = await withRenderLock(() =>\n        renderVideo({\n          images, weights: st.scenes.output.map((s) => s.text.length + 10),\n          words: st.captions.status === \"done\" ? st.captions.output.words : [],\n          captionStyle: ctx.project.format.captionStyle, voiceBlob, duration: st.voice.output.duration,\n          musicStyle: st.music.status === \"done\" ? st.music.output.style : null,\n          safe: safeZone(ctx.project.platforms), aiLabel: aiLabelText(ctx.project),\n          onProgress: (p) => ctx.setLive({ render: p }),\n        }),\n      );\n      const key = blobKey(ctx.video, \"final\");\n      await blobs.put(key, out.blob);\n      return { output: { key, ext: out.ext, codec: out.codec, size: out.blob.size }, provider: \"browser\" };\n    } catch (e) {\n      throw new ProviderError(\"render_failed\", e?.message || String(e), { provider: \"browser\", retryable: false });\n    }\n  },\n  async final_check(ctx) {\n    const st = ctx.video.steps;\n    const blob = await blobs.get(st.assemble.output.key);\n    if (!blob) throw new ProviderError(\"missing_asset\", \"Finished video is missing\");\n    const p = await probeVideo(blob).catch(() => null);\n    const speech = st.voice.output.duration;\n    const checks = [\n      { name: \"Vertical 9:16 (1080×1920)\", ok: !p || (p.width === 1080 && p.height === 1920) },\n      { name: \"Length matches the narration\", ok: !p || !isFinite(p.duration) || Math.abs(p.duration - (speech + 0.8)) < 2 },\n      { name: \"All scenes have visuals\", ok: st.visuals.output.images.length === st.scenes.output.length },\n      { name: \"Under 3 minutes\", ok: speech < 180 },\n      { name: \"File isn't empty\", ok: blob.size > 10000 },\n    ];\n    const failed = checks.filter((c) => !c.ok);\n    if (failed.length) throw new ProviderError(\"quality_failed\", \"Final check failed: \" + failed.map((f) => f.name).join(\", \"));\n    const seconds = p && isFinite(p.duration) ? p.duration : speech + 0.8;\n    const platforms = platformReport(ctx.project.platforms || [], { seconds, aiLabel: !!aiLabelText(ctx.project), sora: (st.visuals.output.clips || 0) > 0 });\n    return { output: { checks, platforms, seconds } };\n  },\n};\n\n// ---------------------------------------------------------------- runner + queue\nlet renderChain = Promise.resolve();\nfunction withRenderLock(fn) {\n  const run = renderChain.then(fn, fn);\n  renderChain = run.catch(() => {});\n  return run;\n}\nconst live = {}; // videoId -> { render: 0..1 } (not persisted)\nconst queue = [];\nconst running = new Set();\nconst CONCURRENCY = 2;\n\nfunction enqueue(videoId) {\n  if (!queue.includes(videoId) && !running.has(videoId)) queue.push(videoId);\n  pump();\n}\nfunction pump() {\n  while (running.size < CONCURRENCY && queue.length) {\n    const id = queue.shift();\n    running.add(id);\n    runVideo(id)\n      .catch((e) => console.error(\"runVideo crashed\", e))\n      .finally(() => {\n        running.delete(id);\n        delete live[id];\n        changed();\n        pump();\n      });\n  }\n}\nconst setStep = (id, step, patch) => update(\"videos\", id, (v) => ({ steps: { ...v.steps, [step]: { ...v.steps[step], ...patch, updatedAt: now() } } }));\n\nasync function runVideo(id) {\n  let video = await db.get(\"videos\", id);\n  if (!video) return;\n  const project = await db.get(\"projects\", video.projectId);\n  if (!project || project.deletedAt) return;\n  video = await update(\"videos\", id, { status: \"working\" });\n  for (const step of STEPS) {\n    const state = video.steps[step];\n    if (state.status === \"done\" || state.status === \"skipped\") continue;\n    video = await setStep(id, step, { status: \"working\", attempts: (state.attempts || 0) + 1, error: undefined });\n    try {\n      const res = await STEP_FNS[step]({\n        project: videoProject(project, video), video, state: video.steps[step],\n        progress: async (output) => (video = await setStep(id, step, { output })),\n        patchStep: async (s, patch) => (video = await setStep(id, s, patch)),\n        setLive: (o) => {\n          live[id] = { ...live[id], ...o };\n          bus.dispatchEvent(new Event(\"live\"));\n        },\n      });\n      video = await setStep(id, step, { status: res.skipped ? \"skipped\" : \"done\", output: res.output, provider: res.provider, error: undefined });\n      if (step === \"script\") video = await update(\"videos\", id, { title: res.output.title });\n      await addCost(project.id, res.cost, res.provider);\n      await resolveErrors((e) => e.videoId === id && e.step === step);\n    } catch (e) {\n      const fe = friendly(e, step);\n      await setStep(id, step, { status: \"error\", error: fe });\n      await update(\"videos\", id, { status: \"needs_attention\" });\n      await logError(project.id, id, step, fe);\n      await refreshProject(project.id);\n      return;\n    }\n  }\n  await update(\"videos\", id, { status: \"done\" });\n  await refreshProject(project.id);\n}\n\nasync function refreshProject(projectId) {\n  const vs = await db.byIndex(\"videos\", \"projectId\", projectId);\n  if (!vs.length) return;\n  const status = vs.some((v) => v.status === \"queued\" || v.status === \"working\") ? \"generating\" : vs.some((v) => v.status === \"needs_attention\") ? \"needs_attention\" : \"done\";\n  await update(\"projects\", projectId, { status });\n}\n\n/** On page load: pick up anything that was interrupted (tab closed, reload, crash). */\nasync function resumeAll() {\n  const vs = (await db.all(\"videos\")).sort((a, b) => (a.createdAt < b.createdAt ? -1 : 1));\n  for (const v of vs) {\n    if (v.status !== \"queued\" && v.status !== \"working\") continue;\n    const p = await db.get(\"projects\", v.projectId);\n    if (!p || p.deletedAt) continue;\n    const steps = Object.fromEntries(Object.entries(v.steps).map(([k, s]) => [k, s.status === \"working\" ? { ...s, status: \"waiting\" } : s]));\n    await db.put(\"videos\", { ...v, steps, status: \"queued\" });\n    enqueue(v.id);\n  }\n  for (const p of await db.all(\"projects\")) if (p.status === \"planning\" && !p.deletedAt && !p.ideaError) planProject(p.id);\n}\n\n// ---------------------------------------------------------------- projects\n/**\n * The project as one video sees it: its own platform, and a length that reaches that platform's\n * pay minimum (raised automatically if the chosen length is too short).\n */\nfunction videoProject(p, v) {\n  const plats = v.platform ? [v.platform] : p.platforms || [];\n  const min = payMinSec(plats);\n  const base = p.lengthSec || p.format?.lengthSec || 30;\n  return {\n    ...p, platforms: plats, minSec: min,\n    lengthSec: min ? Math.max(base, min + 9) : base,\n    aiLabel: (p.aiLabelUser ?? p.aiLabel) || hasChina(plats),\n  };\n}\n\n/** Visible AI label burned into the video (required for Chinese platforms, optional elsewhere). */\nfunction aiLabelText(p) {\n  if (!p.aiLabel) return \"\";\n  return /Chinese/.test(p.language || \"\") ? \"AI生成\" : hasChina(p.platforms) ? \"AI生成 · AI-generated\" : \"AI-generated\";\n}\n\nasync function createProject({ request, contentType, count, lengthSec, language, refs, platforms, aiLabel }) {\n  request = request.trim().slice(0, 2000);\n  if (!request) throw new Error(\"Type what you want to make first ✍️\");\n  contentType = (contentType || \"\").trim().slice(0, 200);\n  const n = count && count > 0 ? Math.min(50, count) : parseCount(request);\n  const p = {\n    id: uid(), title: request.replace(/^(please\\s+)?(make|create|generate)\\s+(me\\s+)?/i, \"\").slice(0, 70), request, contentType,\n    format: fallbackStyle(contentType, request), styleReady: false, count: n, lengthSec: lengthSec || null, language: language || \"English\",\n    platforms: (platforms || []).filter(platformById), aiLabelUser: !!aiLabel, lengthAuto: !lengthSec,\n    refs: refs && (refs.links?.length || refs.note || refs.files?.length) ? { links: refs.links || [], note: refs.note || \"\", files: refs.files || [], info: null } : null,\n    status: \"planning\", ideas: [], avoid: [], cost: 0, deletedAt: null, createdAt: now(), updatedAt: now(),\n  };\n  await db.put(\"projects\", p);\n  planProject(p.id);\n  return p;\n}\n\n/** Work out the style from the content type (AI if connected), then ideas, then videos. */\nasync function planProject(projectId) {\n  let p = await db.get(\"projects\", projectId);\n  if (!p) return;\n  // look up reference video titles once (only where the site allows it)\n  if (p.refs?.links?.length && !p.refs.info) {\n    const info = await Promise.all(p.refs.links.map(refInfo));\n    p = await update(\"projects\", projectId, (x) => ({ refs: { ...x.refs, info } }));\n  }\n  if (!p.styleReady) {\n    let style = p.format;\n    const prov = chain(\"llm\", p.avoid || []).find((x) => !x.offline);\n    if (prov) {\n      try {\n        const key = \"style:\" + (await hash(p.contentType, p.contentType ? \"\" : p.request, refsText(p.refs), (p.platforms || []).join()));\n        let j = await kv.get(key);\n        if (!j) {\n          const r = await prov.complete({ task: \"style\", tier: \"cheap\", ...designPrompt(p.contentType, p.request, p.refs, p.platforms || []), input: {} });\n          j = parseJson(r.text);\n          await kv.set(key, j);\n          await addCost(projectId, r.cost, prov.id);\n        }\n        style = cleanStyle(j, p.format);\n      } catch (e) {\n        console.warn(\"style design failed, using the built-in match\", e);\n      }\n    }\n    p = await update(\"projects\", projectId, (x) => ({ format: style, styleReady: true, lengthSec: x.lengthSec || style.lengthSec }));\n  }\n  if (p.count === 1) {\n    if (!(await db.byIndex(\"videos\", \"projectId\", projectId)).length) await createVideos(p, [{ title: p.title, angle: p.request }]);\n  } else await planIdeas(projectId);\n}\n\nasync function planIdeas(projectId) {\n  const p = await db.get(\"projects\", projectId);\n  if (!p || (await db.byIndex(\"videos\", \"projectId\", projectId)).length) return;\n  let ideas = [];\n  const pr = ideasPrompt(p.request, p.format, p.count, p.language, p.refs);\n  let lastErr;\n  for (const prov of chain(\"llm\", p.avoid || [])) {\n    try {\n      const r = await prov.complete({ task: \"ideas\", tier: \"cheap\", ...pr, input: { request: p.request, count: p.count, format: p.format } });\n      const j = parseJson(r.text);\n      ideas = (Array.isArray(j.ideas) ? j.ideas : []).map((x) => ({ title: String(x.title || \"\").slice(0, 80), angle: String(x.angle || x.title || \"\") })).filter((x) => x.angle);\n      await addCost(projectId, r.cost, prov.id);\n      if (ideas.length) break;\n    } catch (e) {\n      lastErr = toProviderError(e, prov.id);\n      lastErr.provider = lastErr.provider || prov.id;\n      if ([\"auth\", \"quota\", \"network\"].includes(lastErr.code)) down.set(prov.id, Date.now() + 5 * 60000);\n    }\n  }\n  if (!ideas.length) {\n    const fe = friendly(lastErr || new Error(\"No ideas returned\"), \"ideas\");\n    await update(\"projects\", projectId, { status: \"needs_attention\", ideaError: fe });\n    await logError(projectId, null, \"ideas\", fe);\n    return;\n  }\n  while (ideas.length < p.count) ideas.push({ ...ideas[ideas.length % ideas.length], title: `${ideas[0].title} #${ideas.length + 1}` });\n  ideas = ideas.slice(0, p.count);\n  await update(\"projects\", projectId, { ideas, ideaError: null });\n  await resolveErrors((e) => e.projectId === projectId && e.step === \"ideas\");\n  await createVideos(p, ideas);\n}\n\n/** One video per idea, per platform: \"1 video\" on TikTok + YouTube = 2 videos, each made for its platform. */\nasync function createVideos(p, ideas, startIndex = 0) {\n  const t = Date.now();\n  const plats = p.platforms?.length ? p.platforms : [null];\n  let i = 0;\n  for (const idea of ideas)\n    for (const platform of plats) {\n      const v = {\n        id: uid(), projectId: p.id, index: startIndex + i, title: idea.title || `Video ${startIndex + i + 1}`, platform,\n        idea: `${idea.title}. ${idea.angle}`.trim(), angle: idea.angle, status: \"queued\", steps: emptySteps(),\n        createdAt: new Date(t + i).toISOString(), updatedAt: now(),\n      };\n      await db.put(\"videos\", v);\n      enqueue(v.id);\n      i++;\n    }\n  await update(\"projects\", p.id, { status: \"generating\" });\n}\n\nfunction resetSteps(v, steps, bump) {\n  const next = { ...v.steps };\n  for (const s of steps) next[s] = { status: \"waiting\", attempts: 0, seed: bump ? (v.steps[s].seed || 0) + 1 : v.steps[s].seed };\n  return next;\n}\n\nasync function videoAction(id, action, step) {\n  const v = await db.get(\"videos\", id);\n  const p = await db.get(\"projects\", v.projectId);\n  if (step && step !== \"all\" && v.steps[step]?.status === \"working\") throw new Error(\"That part is still working.\");\n  if (action === \"regenerate\") {\n    const list = step === \"all\" || !step ? STEPS : [step, ...DOWNSTREAM[step]];\n    await update(\"videos\", id, (c) => ({ status: \"queued\", steps: resetSteps(c, list, true) }));\n  } else {\n    const target = step && step !== \"all\" ? step : STEPS.find((k) => v.steps[k].status === \"error\");\n    if (!target) throw new Error(\"Nothing to fix here.\");\n    const cur = v.steps[target];\n    if (action === \"backup\") {\n      // stop using the failed provider for this whole project, re-queue every video stuck on it\n      const bad = cur.error?.provider || cur.provider;\n      if (bad) await update(\"projects\", p.id, (x) => ({ avoid: [...new Set([...(x.avoid || []), ...bad.split(\", \")])] }));\n      for (const x of await db.byIndex(\"videos\", \"projectId\", p.id)) {\n        const stuck = STEPS.filter((k) => x.steps[k].status === \"error\" && (x.steps[k].error?.provider === bad || (x.id === id && k === target)));\n        if (!stuck.length) continue;\n        await update(\"videos\", x.id, (c) => {\n          const steps = { ...c.steps };\n          for (const k of stuck) steps[k] = { ...steps[k], status: \"waiting\", error: undefined };\n          return { status: \"queued\", steps };\n        });\n        enqueue(x.id);\n      }\n      await update(\"projects\", p.id, { status: \"generating\" });\n      return;\n    }\n    if (action === \"skip\" && cur.status === \"error\" && !cur.error?.canSkip) throw new Error(\"This part can't be skipped.\");\n    await update(\"videos\", id, (c) => ({\n      status: \"queued\",\n      steps: { ...c.steps, [target]: { ...c.steps[target], status: action === \"skip\" ? \"skipped\" : \"waiting\", error: undefined } },\n    }));\n  }\n  enqueue(id);\n  await update(\"projects\", p.id, { status: \"generating\" });\n}\n\nasync function editScript(id, { title, lines, caption }) {\n  const v = await db.get(\"videos\", id);\n  lines = lines.map((l) => l.trim()).filter(Boolean);\n  if (lines.length < 2) throw new Error(\"A script needs at least 2 lines.\");\n  const old = v.steps.script.output;\n  const script = { title: title?.trim() || old?.title || lines[0], hook: lines[0], lines, caption: caption ?? old?.caption ?? \"\", hashtags: old?.hashtags || [] };\n  const same = old && old.lines.length === lines.length && v.steps.scenes.status === \"done\";\n  const redo = same ? [\"voice\", \"music\", \"captions\", \"assemble\", \"final_check\"] : [\"scenes\", \"voice\", \"visuals\", \"music\", \"captions\", \"assemble\", \"final_check\"];\n  await update(\"videos\", id, (c) => {\n    const steps = resetSteps(c, redo, false);\n    steps.script = { ...c.steps.script, status: \"done\", provider: \"edited\", output: script, error: undefined };\n    steps.script_check = { status: \"done\", attempts: 0, output: { edited: true, issues: [] } };\n    if (same) steps.scenes = { ...c.steps.scenes, output: c.steps.scenes.output.map((s, i) => ({ ...s, text: lines[i] })) };\n    return { title: script.title, status: \"queued\", steps };\n  });\n  enqueue(id);\n  await update(\"projects\", v.projectId, { status: \"generating\" });\n}\n\nasync function duplicateVideo(id) {\n  const v = await db.get(\"videos\", id);\n  const sib = await db.byIndex(\"videos\", \"projectId\", v.projectId);\n  const copy = { ...structuredClone(v), id: uid(), index: Math.max(...sib.map((s) => s.index)) + 1, title: `${v.title} (copy)`, createdAt: now(), updatedAt: now() };\n  if (copy.status !== \"done\") {\n    copy.status = \"queued\";\n    for (const s of Object.values(copy.steps)) if (s.status === \"working\") s.status = \"waiting\";\n  }\n  await db.put(\"videos\", copy);\n  if (copy.status !== \"done\") enqueue(copy.id);\n}\n\nasync function addVideos(projectId, n) {\n  const p = await db.get(\"projects\", projectId);\n  const base = (await db.byIndex(\"videos\", \"projectId\", projectId)).length;\n  const ideasSoFar = Math.ceil(base / Math.max(1, p.platforms?.length || 1));\n  await createVideos(p, Array.from({ length: n }, (_, i) => ({ title: `${p.title} #${ideasSoFar + i + 1}`, angle: `${p.request} (fresh angle #${ideasSoFar + i + 1})` })), base);\n}\n\nasync function retryIdeas(projectId, backup) {\n  await update(\"projects\", projectId, (p) => ({\n    status: \"planning\", ideaError: null,\n    avoid: backup && p.ideaError?.provider ? [...new Set([...(p.avoid || []), p.ideaError.provider])] : p.avoid,\n  }));\n  planProject(projectId);\n}\n\n/** Permanently delete trashed projects and their videos/files (frees browser storage). */\nasync function emptyTrash() {\n  for (const p of await db.all(\"projects\")) {\n    if (!p.deletedAt) continue;\n    for (const v of await db.byIndex(\"videos\", \"projectId\", p.id)) {\n      for (const k of videoBlobKeys(v)) await blobs.del(k);\n      await db.del(\"videos\", v.id);\n    }\n    await db.del(\"projects\", p.id);\n  }\n}\nfunction videoBlobKeys(v) {\n  const s = v.steps;\n  return [s.voice.output?.key, ...(s.visuals.output?.partial || []).map((x) => x.key), s.assemble.output?.key].filter(Boolean);\n}\n\n/** Title + creat
