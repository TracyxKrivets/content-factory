er\">Install from a file<input type=\"file\" accept=\".html,text/html\" style=\"display:none\" onChange=${fromFile} /><\/label>\n      <\/div>\n      ${msg && html`<p class=\"small\" style=\"margin:10px 0 0\">${msg}<\/p>`}\n    <\/div>`;\n}\n\nfunction ConnectionCard() {\n  const [res, setRes] = useState(null);\n  const [info, setInfo] = useState(null);\n  const [online, setOnline] = useState(navigator.onLine !== false);\n  const run = async () => {\n    setOnline(navigator.onLine !== false);\n    if (window.cfNet?.info) window.cfNet.info().then(setInfo).catch(() => {});\n    setRes(Object.fromEntries(NET_HOSTS.map(([n]) => [n, \"…\"])));\n    await Promise.all(NET_HOSTS.map(async ([n, url]) => {\n      const t0 = performance.now();\n      try {\n        // any answer (even \"no key\") means the service is reachable\n        await fetch(url, { mode: \"no-cors\", cache: \"no-store\", signal: timeout(10000) });\n        setRes((r) => ({ ...r, [n]: `✓ ${Math.round(performance.now() - t0)} ms` }));\n      } catch {\n        setRes((r) => ({ ...r, [n]: \"✗ can't reach\" }));\n      }\n    }));\n  };\n  useEffect(() => {\n    if (canFetch()) run();\n    const f = () => setOnline(navigator.onLine !== false);\n    window.addEventListener(\"online\", f);\n    window.addEventListener(\"offline\", f);\n    return () => (window.removeEventListener(\"online\", f), window.removeEventListener(\"offline\", f));\n  }, []);\n  const bad = res && Object.values(res).some((v) => v.startsWith(\"✗\"));\n  return html`<h2 style=\"margin-top:34px\">📡 Internet connection<\/h2>\n    <div class=\"card\">\n      <div class=\"row\"><b style=\"flex:1\">${online ? \"✅ This device is online\" : \"⚠️ This device is offline\"}<\/b>\n        ${canFetch() && html`<button class=\"btn small\" onClick=${run}>Test again<\/button>`}<\/div>\n      <div class=\"small dim\" style=\"margin-top:4px\">${window.cfNet\n        ? `The app uses this computer's own internet connection${info?.proxy && info.proxy !== \"DIRECT\" ? ` through your proxy (${info.proxy})` : \"\"}, including VPNs and company networks.`\n        : canFetch() ? \"The app uses this browser's internet connection.\" : \"Inside Claude, outside services are blocked; use the downloaded app for them.\"}\n        If the internet drops, videos pause and carry on by themselves when it's back.<\/div>\n      ${res && html`<div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;margin-top:10px\">${NET_HOSTS.map(([n]) => html`<div class=\"small\" style=${\"padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.04);color:\" + (res[n]?.startsWith(\"✗\") ? \"var(--red)\" : \"inherit\")}><b>${n}<\/b> ${res[n]}<\/div>`)}<\/div>`}\n      ${bad && html`<p class=\"small\" style=\"margin:10px 0 0;color:#ffe0a0\">Some services can't be reached. Check that you're online, that a firewall or antivirus isn't blocking the app, or try another network.<\/p>`}\n    <\/div>`;\n}\n\n// ---------------------------------------------------------------- system\nfunction SystemPage() {\n  const errs = useData(async () => (await kv.get(\"errors\", [])).filter((e) => !e.resolved));\n  const info = useData(async () => {\n    const est = navigator.storage?.estimate ? await navigator.storage.estimate() : null;\n    const persisted = navigator.storage?.persisted ? await navigator.storage.persisted() : false;\n    const codecs = typeof VideoEncoder !== \"undefined\" && typeof AudioEncoder !== \"undefined\" ? await pickCodecs() : null;\n    const ps = await db.all(\"projects\");\n    return { est, persisted, codecs, cost: ps.reduce((s, p) => s + (p.cost || 0), 0) };\n  });\n  const titles = useData(async () => Object.fromEntries((await db.all(\"projects\")).map((p) => [p.id, p.title])));\n  const act = async (e, action) => {\n    try {\n      if (action !== \"resolve\") {\n        if (e.step === \"ideas\") await retryIdeas(e.projectId, action === \"backup\");\n        else if (e.videoId) {\n          const v = await db.get(\"videos\", e.videoId);\n          if (v?.steps[e.step]?.status === \"error\") await videoAction(e.videoId, action, e.step);\n        }\n      }\n      const list = await kv.get(\"errors\", []);\n      for (const x of list) if (x.id === e.id) x.resolved = true;\n      await kv.set(\"errors\", list);\n      toast(action === \"resolve\" ? \"Dismissed\" : \"On it 👍\");\n    } catch (er) {\n      toast(er.message, true);\n    }\n  };\n  const editor = info?.codecs?.video && info?.codecs?.audio;\n  const checks = info && [\n    { name: \"Video editor\", ok: !!editor || typeof MediaRecorder !== \"undefined\", msg: editor ? `Fast MP4 export (${info.codecs.video[1].toUpperCase()} + ${info.codecs.audio[1].toUpperCase()}).` : \"Slow mode: this browser records videos in real time. Chrome or Edge is faster.\" },\n    { name: \"Storage\", ok: true, msg: info.est ? `Using ${(info.est.usage / 1e6).toFixed(0)} MB of ${(info.est.quota / 1e9).toFixed(1)} GB available.` : \"Saving in this browser.\" },\n    { name: \"Keep my projects\", ok: info.persisted, msg: info.persisted ? \"Your browser won't clear your projects.\" : \"Your browser may clear projects if it runs low on space.\", fix: !info.persisted },\n  ];\n  return html`<div>\n    <h1 style=\"margin-top:16px\">⚙ System<\/h1>\n    ${errs && html`<div class=${\"banner \" + (errs.length ? \"warn\" : \"good\")}><b>${errs.length ? `⚠️ ${errs.length} problem(s) need a look.` : \"✅ Everything is working.\"}<\/b><\/div>`}\n    <div class=\"row\" style=\"margin-top:28px\"><h2 style=\"margin:0\">🚑 Error Center<\/h2><span class=\"spacer\"><\/span>\n      ${errs?.length > 0 && html`<button class=\"btn small primary\" onClick=${async () => { for (const e of errs) await act(e, \"retry\"); }}>Retry all<\/button>`}<\/div>\n    ${errs?.length === 0 && html`<p class=\"dim\">No problems. Nice.<\/p>`}\n    <div style=\"display:grid;gap:12px;margin-top:12px\">${(errs || []).map((e) => html`<div class=\"card\">\n      <div class=\"row\" style=\"align-items:flex-start\"><div style=\"flex:1;min-width:240px\"><b>⚠️ ${e.error.message}<\/b><div class=\"small\">${e.error.suggestion}<\/div>\n        <div class=\"small dim\" style=\"margin-top:4px\">${titles?.[e.projectId] || \"App\"} · ${ago(e.createdAt)} ${e.projectId && html`· <a href=${\"#project-\" + e.projectId} style=\"text-decoration:underline\">open project<\/a>`}<\/div><\/div>\n        <div class=\"row\" style=\"gap:8px\"><button class=\"btn small primary\" onClick=${() => act(e, \"retry\")}>TRY AGAIN<\/button>\n          ${e.error.canBackup && html`<button class=\"btn small\" onClick=${() => act(e, \"backup\")}>USE BACKUP<\/button>`}\n          ${e.error.canSkip && html`<button class=\"btn small\" onClick=${() => act(e, \"skip\")}>SKIP<\/button>`}\n          <button class=\"btn small\" title=\"Hide\" onClick=${() => act(e, \"resolve\")}>✕<\/button><\/div><\/div>\n      <details><summary class=\"small\">Advanced<\/summary><pre class=\"tech\">step: ${e.step} · code: ${e.error.code}${e.error.provider ? \" · provider: \" + e.error.provider : \"\"}\\n${e.error.technical}<\/pre><\/details>\n    <\/div>`)}<\/div>\n    <${UpdatesCard} />\n    <${ConnectionCard} />\n    ${checks && html`<h2 style=\"margin-top:34px\">🩺 Health<\/h2><div class=\"grid\">\n      ${checks.map((c) => html`<div class=\"card\"><b>${c.ok ? \"✅\" : \"⚠️\"} ${c.name}<\/b><div class=\"small dim\">${c.msg}<\/div>\n        ${c.fix && html`<button class=\"btn small\" style=\"margin-top:8px\" onClick=${async () => {\n          const ok = await navigator.storage?.persist?.();\n          toast(ok ? \"Your projects are protected ✓\" : \"Your browser said no. Bookmarking this page usually helps.\", !ok);\n          changed();\n        }}>Protect my projects<\/button>`}<\/div>`)}\n      <div class=\"card\"><b>💸 Spend (estimate)<\/b><div class=\"small dim\">${money(info.cost)} total<\/div><\/div>\n      <div class=\"card\"><b>🔌 AI<\/b><div class=\"small dim\">${practiceMode() ? \"Practice mode: connect an AI writer for real scripts.\" : \"Connected.\"}<\/div><a href=\"#connect\" class=\"btn small\" style=\"margin-top:8px\">Choose AI for each job<\/a><\/div>\n    <\/div>`}\n  <\/div>`;\n}\n\n// ---------------------------------------------------------------- reference video uploads (Make page)\nfunction RefUploads() {\n  const files = useData(refFiles) || [];\n  const [drag, setDrag] = useState(false);\n  const input = useRef();\n  const add = async (list) => {\n    const n = await addRefFiles(list);\n    if (n) toast(`Studying ${n} video${n > 1 ? \"s\" : \"\"}… 🔍`);\n  };\n  const ai = !practiceMode();\n  return html`<div>\n    <div class=${\"dropzone\" + (drag ? \" on\" : \"\")}\n      onClick=${() => input.current?.click()}\n      onDragOver=${(e) => (e.preventDefault(), setDrag(true))} onDragLeave=${() => setDrag(false)}\n      onDrop=${(e) => (e.preventDefault(), setDrag(false), add([...e.dataTransfer.files]))}>\n      <div style=\"font-size:26px\">⬆<\/div>\n      <b>Upload reference videos<\/b>\n      <div class=\"small dim\">Drop video files here or tap to choose (MP4 works best${files.length ? `, ${MAX_REF_FILES - files.length} more allowed` : `, up to ${MAX_REF_FILES}`})<\/div>\n      <input ref=${input} type=\"file\" accept=\"video/*,.mp4,.mov,.webm,.m4v\" multiple style=\"display:none\" onChange=${(e) => {\n        const picked = [...e.target.files]; // copy first: clearing the box empties its live file list\n        e.target.value = \"\";\n        add(picked);\n      }} />\n    <\/div>\n    ${!ai && html`<p class=\"small\" style=\"margin:8px 0 0;color:#ffe0a0\">No AI writer connected, so I can only measure the videos (length, cuts, pace). Connect one to have it study them properly.<\/p>`}\n    ${files.length > 0 && html`<div style=\"display:grid;gap:10px;margin-top:12px\">${files.map((f) => html`<${RefCard} key=${f.id} f=${f} />`)}<\/div>`}\n    ${files.some((f) => f.status === \"done\") && html`<button class=\"btn small\" style=\"margin-top:10px\" onClick=${() => downloadBlob(new Blob([notesAsText(files)], { type: \"text/plain\" }), \"reference-research.txt\")}>⬇ Download research notes<\/button>`}\n  <\/div>`;\n}\nfunction RefCard({ f }) {\n  const [open, setOpen] = useState(false);\n  const [play, setPlay] = useState(false);\n  const thumb = useBlobUrl(f.status === \"done\" ? \"refthumb:\" + f.id : null);\n  const vid = useBlobUrl(play ? \"ref:\" + f.id : null);\n  const n = f.notes || {};\n  const row = (k, v) => v && html`<div><b>${k}:<\/b> ${Array.isArray(v) ? html`<ul style=\"margin:4px 0 0;padding-left:18px\">${v.map((x) => html`<li>${x}<\/li>`)}<\/ul>` : v}<\/div>`;\n  return html`<div class=\"refcard\">\n    <div class=\"row\" style=\"gap:12px;align-items:flex-start;flex-wrap:nowrap\">\n      <div class=\"refthumb\" onClick=${() => f.status === \"done\" && setPlay(!play)} title=\"Play\">\n        ${play && vid ? html`<video src=${vid} controls autoplay playsinline style=\"width:100%;height:100%;object-fit:cover\"><\/video>` : thumb ? html`<img src=${thumb} />` : html`<span>🎬<\/span>`}\n      <\/div>\n      <div style=\"flex:1;min-width:0\">\n        <div style=\"font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">${f.name}<\/div>\n        <div class=\"small dim\">${(f.size / 1e6).toFixed(1)} MB${f.meta ? ` · ${Math.round(f.meta.duration)} s · new shot every ~${f.meta.avgShot} s` : \"\"}<\/div>\n        ${f.status === \"waiting\" && html`<div class=\"small\" style=\"color:var(--amber)\">In line…<\/div>`}\n        ${f.status === \"working\" && html`<div class=\"small\" style=\"color:var(--amber)\"><span class=\"spin\">◐<\/span> ${f.step || \"Studying\"}…<\/div>`}\n        ${f.status === \"error\" && html`<div class=\"small\" style=\"color:var(--red)\">⚠️ ${f.error} <button class=\"btn small\" style=\"min-height:32px;padding:4px 10px\" onClick=${() => researchRef(f.id)}>Try again<\/button><\/div>`}\n        ${f.status === \"done\" && html`<div class=\"small\" style=\"margin-top:2px\">${n.summary || \"\"}<\/div>\n          ${n.aiError && html`<div class=\"small\" style=\"color:#ffe0a0\">${n.aiError}<\/div>`}\n          <button class=\"btn small\" style=\"min-height:32px;padding:4px 10px;margin-top:6px\" onClick=${() => setOpen(!open)}>${open ? \"Hide notes\" : \"See what the AI learned\"}<\/button>`}\n      <\/div>\n      <button class=\"btn small danger\" style=\"min-height:36px;padding:4px 10px\" title=\"Remove\" onClick=${async () => {\n        if (await confirmBox({ title: \"Remove this reference video?\", yes: \"Remove\", danger: true })) removeRefFile(f.id);\n      }}>✕<\/button>\n    <\/div>\n    ${open && html`<div class=\"small refnotes\">\n      ${row(\"Hook\", n.hook)}${row(\"Structure\", n.structure)}${row(\"Pacing\", n.pacing)}${row(\"Visuals\", n.visuals)}${row(\"Captions\", n.captions)}${row(\"Voice\", n.voice)}${row(\"Music\", n.music)}${row(\"What to copy\", n.copy)}\n      ${f.transcript && html`<details><summary class=\"small\">Transcript<\/summary><div class=\"dim\">${f.transcript}<\/div><\/details>`}\n      <div class=\"dim\" style=\"margin-top:6px\">Studied by: ${f.by}<\/div>\n      <button class=\"btn small\" style=\"margin-top:8px\" onClick=${() => researchRef(f.id)}>↻ Study again<\/button>\n    <\/div>`}\n  <\/div>`;\n}\n","70-money.js":"// ---------------------------------------------------------------- money: budget, spending, real bills, plans\n// The app keeps its own ledger of what each AI call cost (estimated from each service's prices).\n// Real bills come from the services that offer them: ElevenLabs (normal key), OpenAI and Anthropic (admin keys).\n// Plans and payments happen on each service's own billing page, opened inside the app.\nconst monthKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, \"0\")}`;\nconst monthStart = (d = new Date()) => new Date(d.getFullYear(), d.getMonth(), 1);\n\nconst SERVICES = [\n  {\n    id: \"anthropic\", name: \"Claude API (Anthropic)\", icon: \"🧠\", key: \"ANTHROPIC_API_KEY\", admin: \"ANTHROPIC_ADMIN_KEY\",\n    how: \"Prepaid credits. Buy credits or turn on auto-reload; set a monthly spend limit under Limits.\",\n    billing: \"https://console.anthropic.com/settings/billing\", plans: \"https://console.anthropic.com/settings/limits\",\n    adminUrl: \"https://console.anthropic.com/settings/admin-keys\",\n  },\n  {\n    id: \"openai\", name: \"OpenAI (scripts, voice, images, Sora)\", icon: \"🤖\", key: \"OPENAI_API_KEY\", admin: \"OPENAI_ADMIN_KEY\",\n    how: \"Prepaid credits. Add credits or auto-recharge; set a monthly budget and alerts under Limits.\",\n    billing: \"https://platform.openai.com/settings/organization/billing/overview\", plans: \"https://platform.openai.com/settings/organization/limits\",\n    adminUrl: \"https://platform.openai.com/settings/organization/admin-keys\",\n  },\n  {\n    id: \"gemini\", name: \"Google Gemini\", icon: \"✨\", key: \"GEMINI_API_KEY\",\n    how: \"Free tier, or pay as you go through Google Cloud billing (needed for Gemini images). Google doesn't share bills with apps, so open the billing page to see it.\",\n    billing: \"https://console.cloud.google.com/billing\", plans: \"https://ai.google.dev/gemini-api/docs/pricing\",\n  },\n  {\n    id: \"elevenlabs\", name: \"ElevenLabs (voice)\", icon: \"🎙\", key: \"ELEVENLABS_API_KEY\",\n    how: \"Monthly plan with a character allowance. Change plan or pay an open invoice on the subscription page.\",\n    billing: \"https://elevenlabs.io/app/subscription\", plans: \"https://elevenlabs.io/pricing\",\n  },\n  { id: \"pexels\", name: \"Pexels (stock photos)\", icon: \"📷\", key: \"PEXELS_API_KEY\", how: \"Free. Nothing to pay.\" },\n];\nconst SERVICE_OF = {\n  anthropic: \"anthropic\", openai: \"openai\", \"openai-tts\": \"openai\", \"openai-image\": \"openai\", \"openai-whisper\": \"openai\", sora: \"openai\",\n  gemini: \"gemini\", \"gemini-tts\": \"gemini\", \"gemini-image\": \"gemini\", elevenlabs: \"elevenlabs\", pexels: \"pexels\",\n};\n/** Free providers never count against the budget (Claude account = your Claude plan, no per-use cost). */\nconst FREE_IDS = new Set([\"claude-account\", \"pexels\", \"estimated\", \"generated\"]);\nconst isPaid = (p) => !p.offline && !FREE_IDS.has(p.id);\n\n// ---- ledger (one record per month: total, per service, per day)\nlet spendLock = Promise.resolve();\nfunction recordSpend(provider, amount) {\n  if (!amount || !(amount > 0)) return spendLock;\n  spendLock = spendLock.then(async () => {\n    const svc = SERVICE_OF[String(provider || \"\").split(\",\")[0].trim()] || \"other\";\n    const k = \"spend:\" + monthKey();\n    const m = (await kv.get(k, null)) || { total: 0, by: {}, days: {} };\n    m.total += amount;\n    m.by[svc] = (m.by[svc] || 0) + amount;\n    const d = new Date().getDate();\n    m.days[d] = (m.days[d] || 0) + amount;\n    await kv.set(k, m);\n    changed();\n  }).catch(() => {});\n  return spendLock;\n}\nconst monthSpend = async (key = monthKey()) => (await kv.get(\"spend:\" + key, null)) || { total: 0, by: {}, days: {} };\nconst budget = () => ({ monthly: 0, ...loadSetting(\"cf-budget\", {}) });\n\n/** Called before every paid AI call. Stops the video (it can be resumed) once the month's budget is used. */\nasync function assertBudget() {\n  const b = budget();\n  if (!b.monthly) return;\n  await spendLock;\n  const m = await monthSpend();\n  if (m.total >= b.monthly)\n    throw new ProviderError(\"budget\", `Monthly budget of ${money(b.monthly)} reached (${money(m.total)} spent)`, { retryable: false });\n}\n\n/** Rough cost of one video with the current Connect AI choices (for the Make page). */\nfunction estimateVideoCost(lengthSec = 30) {\n  const head = (cap, avoid = []) => chain(cap, avoid)[0];\n  const llm = head(\"llm\"), voice = head(\"voice\"), img = head(\"image\"), cap = head(\"captions\");\n  const scenes = Math.max(3, Math.round(lengthSec / 5));\n  const chars = lengthSec * 15;\n  let c = 0;\n  if (llm && isPaid(llm)) c += llm.id === \"anthropic\" ? (/opus/.test(modelChoice(\"writer\")) ? 0.12 : /haiku/.test(modelChoice(\"writer\")) ? 0.015 : 0.05) : llm.id === \"gemini\" ? 0.02 : 0.03;\n  if (voice && isPaid(voice)) c += voice.id === \"elevenlabs\" ? chars * PRICE.elevenlabsPerChar : voice.id === \"openai-tts\" ? chars * PRICE.openaiTtsPerChar : 0.003;\n  const imgCost = (p, n) => (!p || !isPaid(p) ? 0 : p.id === \"openai-image\" ? n * PRICE.openaiImage : p.id === \"gemini-image\" ? n * 0.045 : 0);\n  if (img?.id === \"sora\") {\n    const s = soraSettings(), per = soraPrice(s.model), each = soraClipSec(lengthSec / scenes);\n    c += s.mode === \"hook\" ? each * per + imgCost(head(\"image\", [\"sora\"]), scenes - 1) : scenes * each * per;\n  } else c += imgCost(img, scenes);\n  if (cap?.id === \"openai-whisper\") c += (lengthSec / 60) * PRICE.whisperPerMinute;\n  return c;\n}\n\n// ---- real bills from the services\nasync function fetchBill(svc) {\n  const k = keys.get(svc.key), a = svc.admin && keys.get(svc.admin);\n  const since = monthStart();\n  if (svc.id === \"elevenlabs\" && k) {\n    const res = await fetch(\"https://api.elevenlabs.io/v1/user/subscription\", { headers: { \"xi-api-key\": k }, signal: timeout(20000) });\n    if (!res.ok) throw await httpError(res, \"elevenlabs\");\n    const j = await res.json();\n    const inv = j.next_invoice;\n    const cur = (j.currency || \"usd\").toUpperCase();\n    return {\n      plan: `${cap(j.tier || \"?\")} plan${j.status && j.status !== \"active\" ? ` (${j.status.replace(/_/g, \" \")})` : \"\"}`,\n      lines: [\n        `Characters used: ${(j.character_count || 0).toLocaleString()} of ${(j.character_limit || 0).toLocaleString()}` + (j.next_character_count_reset_unix ? `, resets ${new Date(j.next_character_count_reset_unix * 1000).toLocaleDateString()}` : \"\"),\n        inv && inv.amount_due_cents != null ? `Next bill: ${(inv.amount_due_cents / 100).toFixed(2)} ${cur}${inv.next_payment_attempt_unix > 0 ? ` on ${new Date(inv.next_payment_attempt_unix * 1000).toLocaleDateString()}` : \"\"}` : null,\n        j.has_open_invoices ? \"⚠️ You have an unpaid invoice. Pay it on the subscription page.\" : null,\n      ].filter(Boolean),\n      usage: j.character_limit ? j.character_count / j.character_limit : null,\n      alert: !!j.has_open_invoices || [\"past_due\", \"incomplete\"].includes(j.status),\n    };\n  }\n  if (svc.id === \"openai\" && a) {\n    let total = 0, page = null;\n    for (let i = 0; i < 4; i++) {\n      const u = `https://api.openai.com/v1/organization/costs?start_time=${Math.floor(since / 1000)}&bucket_width=1d&limit=31${page ? \"&page=\" + encodeURIComponent(page) : \"\"}`;\n      const res = await fetch(u, { headers: { Authorization: `Bearer ${a}` }, signal: timeout(20000) });\n      if (!res.ok) throw await httpError(res, \"openai\");\n      const j = await res.json();\n      for (const b of j.data || []) for (const r of b.results || []) total += Number(r.amount?.value) || 0;\n      if (!j.has_more || !j.next_page) break;\n      page = j.next_page;\n    }\n    return { spent: total, lines: [`Billed by OpenAI this month: ${money(total)} (all your OpenAI usage, not only this app)`] };\n  }\n  if (svc.id === \"anthropic\" && a) {\n    let cents = 0, page = null;\n    for (let i = 0; i < 4; i++) {\n      const u = `https://api.anthropic.com/v1/organizations/cost_report?starting_at=${encodeURIComponent(since.toISOString())}&bucket_width=1d&limit=31${page ? \"&page=\" + encodeURIComponent(page) : \"\"}`;\n      const res = await fetch(u, { headers: { \"x-api-key\": a, \"anthropic-version\": \"2023-06-01\", \"anthropic-dangerous-direct-browser-access\": \"true\" }, signal: timeout(20000) });\n      if (!res.ok) throw await httpError(res, \"anthropic\");\n      const j = await res.json();\n      for (const b of j.data || []) for (const r of b.results || []) cents += Number(r.amount) || 0; // amounts are in cents\n      if (!j.has_more || !j.next_page) break;\n      page = j.next_page;\n    }\n    return { spent: cents / 100, lines: [`Billed by Anthropic this month: ${money(cents / 100)} (all your Claude API usage, not only this app)`] };\n  }\n  return null;\n}\n\n/** Billing pages open inside the desktop app (your logins are kept); in a browser they open in a new tab. */\nfunction openSite(url) {\n  window.open(url, \"_blank\", \"noopener,noreferrer\");\n}\n\nfunction MoneyPage() {\n  const [b, setB] = useState(budget);\n  const [draft, setDraft] = useState(() => (budget().monthly ? String(budget().monthly) : \"\"));\n  const [bills, setBills] = useState({});\n  const data = useData(async () => {\n    const now = new Date();\n    const months = [];\n    for (let i = 5; i >= 0; i--) {\n      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);\n      months.push({ key: monthKey(d), label: d.toLocaleDateString(undefined, { month: \"short\" }), m: await monthSpend(monthKey(d)) });\n    }\n    const ps = (await db.all(\"projects\")).filter((p) => !p.deletedAt && p.createdAt >= monthStart().toISOString());\n    return { months, cur: months[5].m, projects: ps.sort((x, y) => (y.cost || 0) - (x.cost || 0)).slice(0, 6) };\n  });\n  useData(async () => keys.all());\n  const loadBills = async () => {\n    for (const s of SERVICES) {\n      if (!keys.get(s.key) && !(s.admin && keys.get(s.admin))) continue;\n      if (!canFetch()) continue;\n      setBills((x) => ({ ...x, [s.id]: { loading: true } }));\n      try {\n        const r = await fetchBill(s);\n        setBills((x) => ({ ...x, [s.id]: r || { none: true } }));\n      } catch (e) {\n        const pe = toProviderError(e, s.id);\n        setBills((x) => ({ ...x, [s.id]: { error: pe.code === \"auth\" ? \"The key was refused (bills need the right key, see below).\" : pe.code === \"network\" ? \"Couldn't reach the service.\" : \"Couldn't load the bill right now.\" } }));\n      }\n    }\n  };\n  useEffect(() => {\n    loadBills();\n  }, []);\n  const saveBudget = () => {\n    const n = Math.max(0, Number(String(draft).replace(/[^0-9.]/g, \"\")) || 0);\n    const next = { ...b, monthly: n };\n    setB(next);\n    saveSetting(\"cf-budget\", next);\n    toast(n ? `Monthly budget set to ${money(n)} ✓` : \"Budget turned off\");\n  };\n  if (!data) return html`<div class=\"dim\">Loading…<\/div>`;\n  const spent = data.cur.total;\n  const pct = b.monthly ? Math.min(1, spent / b.monthly) : 0;\n  const left = b.monthly ? Math.max(0, b.monthly - spent) : null;\n  const max = Math.max(0.01, ...data.months.map((x) => x.m.total));\n  const svcName = (id) => SERVICES.find((s) => s.id === id)?.name || \"Other\";\n  return html`<div style=\"max-width:820px;margin:0 auto\">\n    <h1 style=\"margin-top:16px\">💰 Money<\/h1>\n    <p class=\"dim\" style=\"margin-top:0\">Your budget, what the app has spent, your real bills, and where to change plans or pay.<\/p>\n\n    <div class=\"card\">\n      <div class=\"row\" style=\"align-items:flex-end;gap:16px;flex-wrap:wrap\">\n        <div style=\"flex:1;min-width:220px\">\n          <div class=\"small dim\">Spent this month (by this app)<\/div>\n          <div style=\"font-size:38px;font-weight:800;line-height:1.1\">${money(spent)}${b.monthly ? html`<span class=\"dim\" style=\"font-size:18px;font-weight:600\"> of ${money(b.monthly)}<\/span>` : \"\"}<\/div>\n          ${b.monthly > 0 && html`<div class=\"meter\" style=\"margin-top:10px\"><div style=${`width:${pct * 100}%;background:${pct >= 1 ? \"var(--red)\" : pct >= 0.8 ? \"var(--amber)\" : \"var(--green)\"}`}><\/div><\/div>\n            <div class=\"small\" style=\"margin-top:6px\">${pct >= 1 ? html`<b style=\"color:var(--red)\">Budget used up.<\/b> Paid AI work is paused; free options still work.` : `${money(left)} left this month.`}<\/div>`}\n        <\/div>\n        <div style=\"min-width:240px\">\n          <label class=\"lbl small\">Monthly budget (USD)<\/label>\n          <div class=\"row\" style=\"gap:8px\"><input class=\"input\" inputmode=\"decimal\" placeholder=\"e.g. 20 (empty = no limit)\" value=${draft} onInput=${(e) => setDraft(e.target.value)} onKeyDown=${(e) => e.key === \"Enter\" && saveBudget()} style=\"width:170px\" />\n            <button class=\"btn primary\" onClick=${saveBudget}>Save<\/button><\/div>\n          <div class=\"small dim\" style=\"margin-top:6px\">When it's reached, videos pause instead of spending more. Raise it and press Try again to carry on.<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"card\" style=\"margin-top:16px\">\n      <b>This month by service<\/b>\n      ${Object.keys(data.cur.by).length === 0 ? html`<p class=\"small dim\">Nothing spent yet this month.<\/p>` : html`<div style=\"display:grid;gap:8px;margin-top:10px\">\n        ${Object.entries(data.cur.by).sort((x, y) => y[1] - x[1]).map(([id, v]) => html`<div class=\"row\" style=\"gap:10px\"><span class=\"small\" style=\"width:220px\">${svcName(id)}<\/span>\n          <div class=\"meter\" style=\"flex:1\"><div style=${`width:${(v / spent) * 100}%`}><\/div><\/div><b class=\"small\" style=\"width:70px;text-align:right\">${money(v)}<\/b><\/div>`)}<\/div>`}\n      <div class=\"small dim\" style=\"margin-top:14px\">Last 6 months<\/div>\n      <div class=\"bars\">${data.months.map((x) => html`<div class=\"mbar\" title=${money(x.m.total)}><div style=${`height:${(x.m.total / max) * 100}%`}><\/div><span>${x.label}<\/span><\/div>`)}<\/div>\n      ${data.projects.some((p) => p.cost > 0) && html`<div class=\"small dim\" style=\"margin-top:12px\">Top projects this month<\/div>\n        <div style=\"display:grid;gap:4px;margin-top:6px\">${data.projects.filter((p) => p.cost > 0).map((p) => html`<button class=\"row linkrow\" onClick=${() => go(\"project-\" + p.id)}><span class=\"small\" style=\"flex:1;text-align:left\">${p.title}<\/span><b class=\"small\">${money(p.cost)}<\/b><\/button>`)}<\/div>`}\n      <p class=\"small dim\" style=\"margin:12px 0 0\">These are the app's own estimates from each service's prices. The real bills below can differ a little.<\/p>\n    <\/div>\n\n    <h2 style=\"margin:26px 0 10px\">Bills and plans<\/h2>\n    <div style=\"display:grid;gap:12px\">${SERVICES.map((s) => {\n      const has = keys.get(s.key) || (s.admin && keys.get(s.admin));\n      const bill = bills[s.id];\n      return html`<div class=${\"card\" + (bill?.alert ? \" alertcard\" : \"\")}>\n        <div class=\"row\" style=\"gap:10px\"><span style=\"font-size:24px\">${s.icon}<\/span><div style=\"flex:1\"><b>${s.name}<\/b>\n          <div class=\"small dim\">${has ? s.how : \"Not connected.\"}<\/div><\/div>\n          ${has && data.cur.by[s.id] > 0 && html`<span class=\"small dim\">app spent ${money(data.cur.by[s.id])}<\/span>`}<\/div>\n        ${has && bill && html`<div style=\"margin:10px 0 0 34px;display:grid;gap:4px\">\n          ${bill.loading && html`<span class=\"small dim\">Loading your bill…<\/span>`}\n          ${bill.error && html`<span class=\"small\" style=\"color:#ffe0a0\">${bill.error}<\/span>`}\n          ${bill.plan && html`<b class=\"small\">${bill.plan}<\/b>`}\n          ${(bill.lines || []).map((l) => html`<span class=\"small\">${l}<\/span>`)}\n          ${bill.usage != null && html`<div class=\"meter\" style=\"max-width:360px\"><div style=${`width:${Math.min(1, bill.usage) * 100}%;background:${bill.usage > 0.9 ? \"var(--red)\" : \"var(--green)\"}`}><\/div><\/div>`}\n        <\/div>`}\n        ${has && s.admin && !keys.get(s.admin) && canFetch() && html`<p class=\"small dim\" style=\"margin:10px 0 0 34px\">To see your real ${s.id === \"openai\" ? \"OpenAI\" : \"Anthropic\"} bill here, paste an <b>admin key<\/b> (it starts with ${s.id === \"openai\" ? \"sk-admin-\" : \"sk-ant-admin\"}) in the key box on Connect AI. <a href=${s.adminUrl} target=\"_blank\" rel=\"noreferrer\" onClick=${(e) => { e.preventDefault(); openSite(s.adminUrl); }} style=\"text-decoration:underline\">Make one ↗<\/a><\/p>`}\n        ${s.billing && html`<div class=\"row\" style=\"gap:8px;margin:12px 0 0 34px;flex-wrap:wrap\">\n          <button class=\"btn small primary\" onClick=${() => openSite(s.billing)}>💳 Pay / add credits<\/button>\n          <button class=\"btn small\" onClick=${() => openSite(s.plans)}>Change plan or limits<\/button>\n        <\/div>`}\n      <\/div>`;\n    })}<\/div>\n    <p class=\"small dim\" style=\"margin-top:14px\">Paying and changing plans happen on each service's own secure page (the app never sees your card). ${window.cfNet ? \"They open in a window inside the app and remember your login.\" : \"They open in a new tab.\"}<\/p>\n    <button class=\"btn\" style=\"margin-top:6px\" onClick=${loadBills}>↻ Refresh bills<\/button>\n  <\/div>`;\n}\n","90-boot.js":"// ---------------------------------------------------------------- start\n/** Delete stored files no video points to anymore (left over from redos). */\nasync function cleanupFiles() {\n  const used = new Set((await db.all(\"videos\")).flatMap(videoBlobKeys));\n  const all = await tx(\"blobs\", \"readonly\", (o) => req(o.getAllKeys()));\n  for (const k of all) if (!used.has(k)) await tx(\"blobs\", \"readwrite\", (o) => req(o.delete(k)));\n}\n(async () => {\n  await idb(); // falls back to memory if storage is blocked\n  const root = document.getElementById(\"app\");\n  root.textContent = \"\"; // remove the \"Loading…\" placeholder\n  render(html`<${App} />`, root);\n  window.__cfGo = go; // lets the \"Change the app\" chat open pages\n  window.__cfShell?.ready(); // tells the loader this version started fine\n  navigator.storage?.persist?.().catch(() => {});\n  await resumeAll();\n  if (!running.size && !queue.length) cleanupFiles().catch(() => {});\n  window.__cf = { db, kv, blobs, keys, running, queue }; // for debugging from the console\n})();\n","style.css":":root {\n  --bg: #0b1020;\n  --bg2: #121a33;\n  --card: #18223f;\n  --line: #2a3760;\n  --text: #eef1fb;\n  --dim: #9aa6c8;\n  --amber: #ffb43b;\n  --amber2: #ff8f1f;\n  --green: #3ddc84;\n  --red: #ff5a5f;\n  --blue: #5aa9ff;\n  --radius: 16px;\n  --pixel: \"Press Start 2P\", ui-monospace, monospace;\n  --body: \"Inter\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n}\n* { box-sizing: border-box; }\nhtml, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 17px; line-height: 1.5; }\nbody { background: radial-gradient(1200px 600px at 50% -200px, #1b2750 0%, var(--bg) 60%) fixed; min-height: 100vh; }\na.btn { text-decoration: none; }\na { color: inherit; text-decoration: none; }\nbutton, input, select, textarea { font: inherit; color: inherit; }\n.wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px 80px; }\n.pixel { font-family: var(--pixel); letter-spacing: 0.02em; }\nh1, h2, h3 { margin: 0 0 12px; line-height: 1.25; }\nh1 { font-size: 30px; }\nh2 { font-size: 22px; }\n.dim { color: var(--dim); }\n.small { font-size: 14px; }\n.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }\n.spacer { flex: 1; }\n.grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }\n.card { background: var(--card); border: 2px solid var(--line); border-radius: var(--radius); padding: 18px; }\n\n/* nav */\n.nav { display: flex; align-items: center; gap: 6px; padding: 16px 20px; max-width: 1100px; margin: 0 auto; flex-wrap: wrap; }\n.logo { font-family: var(--pixel); font-size: 13px; color: var(--amber); margin-right: 18px; line-height: 1.6; }\n.nav .link { padding: 10px 16px; border-radius: 12px; color: var(--dim); font-weight: 600; position: relative; background: none; border: 0; cursor: pointer; font-size: inherit; }\n.nav .link:hover, .nav .link.on { background: var(--bg2); color: var(--text); }\n.nav .logo { background: none; border: 0; cursor: pointer; text-align: left; padding: 0; }\n.dot { position: absolute; top: 6px; right: 6px; width: 10px; height: 10px; background: var(--red); border-radius: 50%; }\n\n/* buttons */\n.btn { display: inline-flex; align-items: c <script id="cf-shell-js">// ============================================================================
// Content Factory SHELL — loads the app, keeps versions, and hosts the
// "Change the app" chat. This part is NOT editable from the chat, so a bad
// change can never break the tool you'd use to fix it.
// ============================================================================
// ---------------------------------------------------------------- desktop app: use the computer's own internet
// In the Windows app, every web request goes through the operating system's network stack
// (system proxy, VPN, company certificates), and services that block browser calls just work.
(() => {
  const net = window.cfNet;
  if (!net || window.__cfNetBridged) return;
  window.__cfNetBridged = true;
  const native = window.fetch.bind(window);
  let n = 0;
  const DROP = new Set(["set-cookie", "set-cookie2"]);
  window.fetch = async function (input, init) {
    const req = new Request(input, init);
    if (!/^https:/i.test(req.url)) return native(input, init);
    const sig = req.signal;
    const aborted = () => new DOMException("The operation was aborted.", sig?.reason?.name === "TimeoutError" ? "TimeoutError" : "AbortError");
    if (sig?.aborted) throw aborted();
    const id = "f" + ++n + "-" + Date.now();
    const body = ["GET", "HEAD"].includes(req.method) ? null : new Uint8Array(await req.arrayBuffer());
    let onAbort;
    const stop = new Promise((_, rej) => {
      onAbort = () => {
        net.abort(id);
        rej(aborted());
      };
      sig?.addEventListener("abort", onAbort, { once: true });
    });
    try {
      const r = await Promise.race([net.fetch({ id, url: req.url, method: req.method, headers: [...req.headers], body }), stop]);
      if (r.error) throw new TypeError("Failed to fetch (" + r.error + ")");
      const headers = r.headers.filter(([k]) => !DROP.has(k.toLowerCase()));
      return new Response([101, 204, 205, 304].includes(r.status) ? null : r.body, { status: r.status, statusText: r.statusText, headers });
    } finally {
      sig?.removeEventListener("abort", onAbort);
    }
  };
})();

(() => {
  "use strict";
  const { html, render, useState, useEffect, useRef } = window.htmPreact;
  const BUILTIN = JSON.parse(document.getElementById("cf-source").textContent);
  const BOOT_TIMEOUT = 12000;

  // ---------------------------------------------------------------- shell storage
  const mem = new Map();
  let dbp;
  function sdb() {
    if (dbp) return dbp;
    dbp = new Promise((res) => {
      try {
        const r = indexedDB.open("content-factory-shell", 1);
        r.onupgradeneeded = () => {
          r.result.createObjectStore("versions", { keyPath: "id" });
          r.result.createObjectStore("meta");
        };
        r.onsuccess = () => res(r.result);
        r.onerror = r.onblocked = () => res(null);
      } catch {
        res(null);
      }
    });
    return dbp;
  }
  async function op(store, mode, fn) {
    const d = await sdb();
    if (!d) return fn(null)?.result;
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode);
      const r = fn(t.objectStore(store));
      t.oncomplete = () => res(r?.result);
      t.onerror = () => rej(t.error);
    });
  }
  const meta = {
    get: async (k, dflt = null) => {
      const v = await op("meta", "readonly", (o) => (o ? o.get(k) : { result: mem.get("m:" + k) }));
      return v === undefined ? dflt : v;
    },
    set: (k, v) => op("meta", "readwrite", (o) => (o ? o.put(v, k) : (mem.set("m:" + k, v), null))),
  };
  const versions = {
    all: async () => ((await op("versions", "readonly", (o) => (o ? o.getAll() : { result: [...mem.values()].filter((x) => x?.files) }))) || []).sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1)),
    get: (id) => op("versions", "readonly", (o) => (o ? o.get(id) : { result: mem.get("v:" + id) })),
    put: (v) => op("versions", "readwrite", (o) => (o ? o.put(v) : (mem.set("v:" + v.id, v), null))),
  };

  // ---------------------------------------------------------------- build + run the app
  const jsNames = (files) => Object.keys(files).filter((n) => n.endsWith(".js")).sort();
  const assemble = (files) => `(() => {\n"use strict";\n${jsNames(files).map((n) => `// ==== ${n} ====\n${files[n]}`).join("\n")}\n})();`;
  /** Returns an error message if the code can't even be parsed, else null. */

      new Function(assemble(files));
      return null;
    } catch (e) {

          new Function(files[n]);

        }

      return e.message;
    }

  // ---------------------------------------------------------------- Claude account (inside claude.ai only)

  window.__cfClaude = { inClaude: !!window.claude?.use, sample: null, downloads: null, declined: false };
  window.__cfClaudeP = (async () => {
    if (!window.claude?.use) return window.__cfClaude;
    const [sample, downloads] = await Promise.all([
      window.claude.use("sample").catch(() => null),
      window.claude.use("downloads").catch(() => null),

    let tools = false;
    try {
      tools = !!(sample && (await sample.limits())?.tools);
    } catch {}

  })();
  const LS = {
    get(k, d) {
      try {
        return JSON.parse(localStorage.getItem(k) || "null") ?? d;
      } catch {
        return d;
      }
    },
  };

  let readyResolve;
  const appReady = new Promise((r) => (readyResolve = r));
  window.__cfShell = {
    ready: () => {
      readyResolve(true);
      window.cfApp?.booted(); // desktop app: this version started fine, keep it
    },
  };

  // ---------------------------------------------------------------- desktop app: "update ready" bar
  // Lives in the shell so no change to the app can ever hide it.
  if (window.cfApp?.onUpdate) {
    const show = (info) => {
      document.getElementById("cfs-update")?.remove();
      const bar = document.createElement("div");
      bar.id = "cfs-update";
      bar.setAttribute("role", "status");
      bar.style.cssText = "position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:2147483000;background:#162447;color:#fff;border:1px solid #ffb84d;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.45);font:14px system-ui,sans-serif;max-width:min(680px,92vw)";
      const txt = document.createElement("span");
      txt.style.flex = "1";
      txt.textContent = "✨ An update to the app is ready" + (info?.notes ? ": " + String(info.notes).replace(/[.!]?$/, ".") : ".") + " Videos being made will carry on after the restart.";
      const go = document.createElement("button");
      go.textContent = "Restart now";
      go.style.cssText = "background:#ffb84d;color:#111;border:0;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer";
      go.onclick = () => window.cfApp.restart();
      const later = document.createElement("button");
      later.textContent = "Later";
      later.title = "It installs by itself next time you open the app";
      later.style.cssText = "background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:8px 12px;cursor:pointer";

      bar.append(txt, go, later);

    window.cfApp.info().then((i) => i?.pending && show(i.pending)).catch(() => {});
  }

  async function boot() {
    const activeId = await meta.get("active");
    let active = activeId ? await versions.get(activeId) : null;
    // a newer file than the one these changes were made on: use the new file, keep history
    if (active && active.baseBuiltAt !== BUILTIN.builtAt) {
      await meta.set("active", null);
      await meta.set("notice", { kind: "info", text: "This is a newer copy of the app, so it started fresh. Your earlier chat changes are still in History if you want them back." });
      active = null;
    }
    // the last two starts of this version never finished → it's broken: roll back
    // (one unfinished start can just mean the tab was closed while loading)
    const booting = await meta.get("booting");
    const tries = booting && booting.id === (active?.id || "builtin") ? booting.tries : 0;
    if (active && tries >= 2) {
      await rollback(active, "it stopped the app from starting");
      return location.reload();
    }
    const files = active ? active.files : BUILTIN.files;
    window.__cfActive = { id: active?.id || null, note: active?.note || "Original version", files };
    document.getElementById("cf-app-style").textContent = files["style.css"] || "";
    await meta.set("booting", { id: active?.id || "builtin", tries: tries + 1 });
    const crash = (msg) => onBootCrash(active, msg);
    const onErr = (e) => crash(e?.error?.message || e?.message || String(e?.reason || e));
    window.addEventListener("error", onErr);
    window.addEventListener("unhandledrejection", onErr);
    try {
      new Function(assemble(files))();
    } catch (e) {
      return crash(e.message);
    }

    window.removeEventListener("error", onErr);
    window.removeEventListener("unhandledrejection", onErr);

    await meta.set("booting", null);
  }
  let crashed = false;
  async function onBootCrash(active, msg) {
    if (crashed) return;
    crashed = true;
    console.error("[shell] app failed to start:", msg);
    if (active) {
      await rollback(active, msg);
      location.reload();
    } else {
      document.getElementById("app").innerHTML = `<div class="wrap"><div class="banner bad" style="margin-top:40px">The app couldn't start: ${String(msg).replace(/[<>&]/g, "")}</div></div>`;
    }
  }
  async function rollback(bad, why) {
    await versions.put({ ...bad, broken: true });
    await meta.set("active", bad.parentId || null);
    await meta.set("booting", null);
    await meta.set("notice", { kind: "bad", text: `That change broke the app (${why}), so I undid it automatically. Tell me what you wanted and I'll try another way.` });
    await addChat({ role: "system", text: `The last change was undone automatically because the app failed to start: ${why}` });
    await meta.set("reopen", true);
  }

  // ---------------------------------------------------------------- chat history
  async function getChat() {
    return (await meta.get("chat", [])) || [];

  // ---------------------------------------------------------------- keys (same storage as the app)
  function appKeys() {

      return JSON.parse(localStorage.getItem("cf-keys") || "{}");

  }

  // ---------------------------------------------------------------- agent tools
  function fileMap(files) {
    return Object.keys(files)
      .sort()
      .map((n) => {
        const src = files[n];
        const lines = src.split("\n").length;
        const names = n.endsWith(".js")
          ? [...src.matchAll(/^(?:async\s+)?(?:function\s+([A-Za-z_$][\w$]*)|const\s+([A-Za-z_$][\w$]*)\s*=)/gm)].map((m) => m[1] || m[2]).slice(0, 45).join(", ")
          : "app styles (CSS)";
        return `- ${n} (${lines} lines): ${names}`;
      })
      .join("\n");
  }
  const TOOLS = [
    { name: "list_files", description: "List the app's files with line counts and the top-level names in each.", input_schema: { type: "object", properties: {} } },
    {
      name: "read_file",
      description: "Read a file, with line numbers. Read at most ~400 lines at a time.",
      input_schema: { type: "object", properties: { name: { type: "string" }, start_line: { type: "integer" }, end_line: { type: "integer" } }, required: ["name"] },
    },
    {
      name: "search",
      description: "Find text in all files (case-insensitive). Returns file:line: text for each match.",
      input_schema: { type: "object", properties: { query: { type: "string" } }, required: ["query"] },
    },
    {
      name: "edit_file",
      description: "Replace exact text in a file. old_text must appear exactly once (copy it from read_file without the line numbers; include enough surrounding lines to be unique).",
      input_schema: { type: "object", properties: { name: { type: "string" }, old_text: { type: "string" }, new_text: { type: "string" } }, required: ["name", "old_text", "new_text"] },
    },
    {
      name: "write_file",
      description: "Create a new file or replace a whole file. Prefer edit_file for changes to existing files.",
      input_schema: { type: "object", properties: { name: { type: "string" }, content: { type: "string" } }, required: ["name", "content"] },
    },
    { name: "delete_file", description: "Delete a file you created. Never delete the core files.", input_schema: { type: "object", properties: { name: { type: "string" } }, required: ["name"] } },
  ];
  const CORE = new Set(Object.keys(BUILTIN.files));
  function runTool(files, name, input, log) {
    const f = input?.name;
    switch (name) {
      case "list_files":
        return fileMap(files);
      case "read_file": {
        if (!(f in files)) return `No file named ${f}. Files: ${Object.keys(files).join(", ")}`;
        const lines = files[f].split("\n");
        const s = Math.max(1, input.start_line || 1);
        const e = Math.min(lines.length, input.end_line || s + 399);
        log(`Reading ${f}`);
        return lines.slice(s - 1, e).map((l, i) => `${s + i}\t${l}`).join("\n") + (e < lines.length ? `\n… (${lines.length - e} more lines; read with start_line=${e + 1})` : "");
      }
      case "search": {
        const q = String(input.query || "").toLowerCase();
        if (!q) return "Empty query.";
        const out = [];
        for (const n of Object.keys(files).sort())
          files[n].split("\n").forEach((l, i) => l.toLowerCase().includes(q) && out.length < 40 && out.push(`${n}:${i + 1}: ${l.trim().slice(0, 160)}`));
        log(`Searching for “${input.query}”`);
        return out.length ? out.join("\n") : "No matches.";
      }
      case "edit_file": {
        if (!(f in files)) return `No file named ${f}.`;
        const n = files[f].split(input.old_text).length - 1;
        if (n === 0) return "old_text was not found. Read the file again and copy the exact text (without line numbers).";
        if (n > 1) return `old_text appears ${n} times. Include more surrounding lines so it's unique.`;
        files[f] = files[f].replace(input.old_text, () => input.new_text);
        log(`Editing ${f}`);
        return "Done.";
      }
      case "write_file": {
        if (!/^[\w.-]+\.(js|css)$/.test(f || "")) return "Name must look like 65-feature.js or extra.css.";
        files[f] = String(input.content ?? "");
        log(`${CORE.has(f) ? "Rewriting" : "Creating"} ${f}`);
        return "Done.";
      }
      case "delete_file": {
        if (CORE.has(f)) return "Core files can't be deleted. Edit them instead.";
        if (!(f in files)) return `No file named ${f}.`;
        delete files[f];
        log(`Deleting ${f}`);
        return "Done.";
      }
    }
    return "Unknown tool.";
  }

  function systemPrompt(files) {
    return `You are the built-in developer for "Content Factory", a single-file web app that a non-technical content creator uses to make short-form videos (TikTok, Reels, Shorts). You change the app's own code when they ask to fix, add or remove features. They are not a programmer.

HOW THE APP IS BUILT
- Plain JavaScript files, joined in name order into ONE script with one shared scope (inside an IIFE), plus style.css. No imports, no npm, no build step.
- UI: Preact + htm. Available from window.htmPreact: html, render, useState, useEffect, useRef, useMemo, useCallback. Templates are html\`...\` with \${} expressions; components are functions; close components with <//>.
- Other globals: Mp4Muxer (MP4 writing), fflate (ZIP).
- Storage: IndexedDB through db / kv / blobs helpers and update() in 00-core.js; small settings via LS (localStorage wrapper). Keep old saved data working if you change data shapes.
- Navigation: go("make" | "projects" | "project-<id>" | "connect" | "system"), defined in 50-ui.js; pages are chosen in App(). Use buttons with onClick=\${() => go("x")}, never plain links.
- Network: only the AI provider APIs, called with the user's own keys (20-providers.js). No other websites, no CDNs.
- Video pipeline: 40-pipeline.js (steps, queue), rendering in 30-render.js (canvas + WebCodecs).
- To add a new page: write the component (e.g. in a new file "65-mypage.js"), add it to the page switch in App() and a button in Nav (50-ui.js).

FILES
${fileMap(files)}

RULES
- Make the smallest change that does what they asked. Don't rewrite files or remove features they didn't mention.
- Read the relevant code before editing. edit_file needs old_text copied exactly from read_file output (without the line-number prefix).
- Match the existing look: CSS classes like btn, btn primary, btn small, card, chip, chip on, banner warn/bad/good, row, grid, dim, small. Keep it easy to use: big buttons, plain words, few choices.
- New files: name them like "65-feature.js" so they load after what they use and before 90-boot.js.
- If the request is unclear or risky (deleting their data, huge rewrites), ask one short question instead of editing.
- When finished, reply with 1-3 short plain sentences saying what you changed (no code, no file names). The app reloads by itself to show it.
- You cannot change this chat panel or the loader, add libraries, or reach other websites. If they ask for that, say so simply.`;
  }

  // ---------------------------------------------------------------- AI providers for the chat
  // rough USD per 1M tokens [input, output] — estimates for the cost note
  const PRICE = { "claude-opus-5-5": [5, 25], "claude-sonnet-5-5": [3, 15], "claude-haiku-5-5": [1, 5], "gpt-4.1": [2, 8] };
  const chatModel = () => LS.get("cf-models", {}).chat || "claude-sonnet-5-5";
  async function callAnthropic(key, system, messages) {
    const model = chatModel();
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "x-api-key": key, "anthropic-version": "2023-06-01", "content-type": "application/json", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({
        model,
        max_tokens: 8000,
        system: [{ type: "text", text: system, cache_control: { type: "ephemeral" } }],
        tools: TOOLS,
        messages,
      }),
    });
    if (!res.ok) throw await apiError(res, "Anthropic");
    const j = await res.json();
    const u = j.usage || {};
    const inTok = (u.input_tokens || 0) + (u.cache_creation_input_tokens || 0) * 1.25 + (u.cache_read_input_tokens || 0) * 0.1;
    return {
      content: j.content || [],
      stop: j.stop_reason,
      cost: (inTok * (PRICE[model] || PRICE["claude-sonnet-5-5"])[0] + (u.output_tokens || 0) * (PRICE[model] || PRICE["claude-sonnet-5-5"])[1]) / 1e6,
    };
  }
  // OpenAI: translate to/from the Anthropic-style messages used by the loop
  async function callOpenAI(key, system, messages, api = { url: "https://api.openai.com/v1/chat/completions", model: "gpt-4.1", who: "OpenAI" }) {
    const model = api.model;
    const msgs = [{ role: "system", content: system }];
    for (const m of messages) {
      if (typeof m.content === "string") msgs.push({ role: m.role, content: m.content });
      else if (m.role === "assistant") {
        const text = m.content.filter((c) => c.type === "text").map((c) => c.text).join("\n");
        // extra_content carries Gemini's thought signature, which it needs back on the next turn
        const calls = m.content.filter((c) => c.type === "tool_use").map((c) => ({ id: c.id, type: "function", function: { name: c.name, arguments: JSON.stringify(c.input) }, ...(c.extra ? { extra_content: c.extra } : {}) }));
        msgs.push({ role: "assistant", content: text || null, ...(calls.length ? { tool_calls: calls } : {}) });
      } else
        for (const c of m.content) {
          if (c.type === "tool_result") msgs.push({ role: "tool", tool_call_id: c.tool_use_id, content: String(c.content) });
          else if (c.type === "text") msgs.push({ role: "user", content: c.text });
        }
    }
    const res = await fetch(api.url, {
      method: "POST",
      headers: { Authorization: `Bearer ${key}`, "Content-Type": "application/json" },
      body: JSON.stringify({ model, messages: msgs, tools: TOOLS.map((t) => ({ type: "function", function: { name: t.name, description: t.description, parameters: t.input_schema } })) }),
    });
    if (!res.ok) throw await apiError(res, api.who);
    const j = await res.json();
    const msg = j.choices?.[0]?.message || {};
    const content = [];
    if (msg.content) content.push({ type: "text", text: msg.content });
    for (const tc of msg.tool_calls || []) {
      let input = {};
      try {
        input = JSON.parse(tc.function.arguments || "{}");
      } catch {}
      content.push({ type: "tool_use", id: tc.id || "call_" + Math.random().toString(36).slice(2), name: tc.function.name, input, ...(tc.extra_content ? { extra: tc.extra_content } : {}) });
    }
    const u = j.usage || {};
    return { content, stop: msg.tool_calls?.length ? "tool_use" : "end_turn", cost: ((u.prompt_tokens || 0) * (PRICE[model] || [2, 12])[0] + (u.completion_tokens || 0) * (PRICE[model] || [2, 12])[1]) / 1e6 };
  }
  async function apiError(res, who) {
    const body = (await res.text().catch(() => "")).slice(0, 300);
    if (res.status === 401 || res.status === 403 || /api key not valid|API_KEY_INVALID/i.test(body)) return new Error(`${who} rejected your API key. Check it on the Connect AI page.`);
    if (res.status === 429) return new Error(`${who} is busy right now. Try again in a minute.`);
    if (res.status === 402 || /credit|quota|billing/i.test(body)) return new Error(`Your ${who} account is out of credits.`);
    return new Error(`${who} had a problem (${res.status}). Try again. ${body}`);
  }
  /** Which AI runs the chat: the choice on the Connect AI page, else whatever is available. */
  function pickModel() {
    if (window.__cfMockAgent) return { kind: "loop", call: window.__cfMockAgent };
    const C = window.__cfClaude;
    const k = appKeys();
    const pref = LS.get("cf-roles", {}).chat;
    const opts = {
      "claude-account": C.sample && !C.declined ? { kind: "sample" } : null,
      anthropic: !C.inClaude && k.ANTHROPIC_API_KEY ? { kind: "loop", call: (s, m) => callAnthropic(k.ANTHROPIC_API_KEY, s, m) } : null,
      openai: !C.inClaude && k.OPENAI_API_KEY ? { kind: "loop", call: (s, m) => callOpenAI(k.OPENAI_API_KEY, s, m) } : null,
      // Gemini through its OpenAI-style endpoint; Pro (newest your key has) because editing code needs the smarter model
      gemini: !C.inClaude && k.GEMINI_API_KEY ? { kind: "loop", call: (s, m) => callOpenAI(k.GEMINI_API_KEY, s, m, {
        url: "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions", who: "Gemini",
        model: (LS.get("cf-gemini-models", {}) || {}).pro || "gemini-pro-latest",
      }) } : null,
    };
    return opts[pref] || opts["claude-account"] || opts.anthropic || opts.openai || opts.gemini || null;
  }
  /** Model options for a Claude-account call, from the chosen model name. */
  function sampleModelOpts(model) {
    if (model === "claude-opus-5-5") return { model, modelTier: "complex" };
    if (model === "claude-haiku-5-5") return { model, modelTier: "quick" };
    return { model: "claude-sonnet-5-5", modelTier: "default" };
  }
  function sampleErrorText(e) {
    const c = e?.code;
    if (c === "not_granted") {
      window.__cfClaude.declined = true;
      return "The app wasn't allowed to use your Claude account. Reload the page and press Allow when Claude asks.";
    }
    if (c === "rate_limited") return "You've hit your Claude usage limit for now. Try again a bit later.";
    if (c === "sampling_disabled") return "Claude isn't available for this account here.";
    if (c === "session_expired") return "Please sign in to Claude again.";
    if (c === "prompt_too_large") return "That was too much for one go. Try a smaller request.";
    if (c === "tools_unavailable") return "This Claude app can't edit code from a page yet. Try claude.ai in a web browser.";
    if (c === "cancelled") return "Stopped.";
    return "Claude had a problem with that. Try again.";
  }

  /** Same job as runAgent, but on the viewer's Claude account: sample() runs the tool rounds itself. */
  async function runAgentSample(request, history, log) {
    const sample = window.__cfClaude.sample;
    const files = structuredClone(window.__cfActive.files);
    const before = JSON.stringify(files);
    const tools = TOOLS.map((t) => ({
      name: t.name,
      description: t.description,
      inputSchema: t.input_schema,
      execute: (input) => {
        const out = String(runTool(files, t.name, input || {}, log));
        return out.length > 30000 ? out.slice(0, 30000) + "\n… (cut off: read a smaller range)" : out;
      },
    }));
    const turns = [
      { role: "user", content: systemPrompt(files) + "\n\nYou have a limited number of tool rounds per reply. If you run out before you're done, end your reply with the word [CONTINUE] and you'll get another turn." },
      ...history.filter((m) => m.role === "user" || m.role === "assistant").slice(-8).map((m) => ({ role: m.role, content: m.text })),
      { role: "user", content: request },
    ];
    let reply = "";
    let fixes = 0;
    for (let round = 0; round < 5; round++) {
      let r;
      try {
        r = await sample(turns, { tools, ...sampleModelOpts(chatModel()) });
      } catch (e) {
        throw new Error(sampleErrorText(e));
      }
      const text = String(r.text || "").trim();
      reply = text.replace(/\[CONTINUE\]/g, "").trim().split(/\n\s*\n/).pop() || reply;
      turns.push({ role: "assistant", content: text });
      if (/\[CONTINUE\]/.test(text)) {
        log("Continuing…");
        turns.push({ role: "user", content: "Continue where you left off. Your edits so far are kept." });
        continue;
      }
      if (JSON.stringify(files) !== before) {
        const err = syntaxError(files);
        if (err && fixes < 2) {
          fixes++;
          log("Fixing a mistake in the change");
          turns.push({ role: "user", content: `Your change has a syntax error, so it can't run: ${err}. Fix it with edit_file, then reply with the summary again.` });
          continue;
        }
        if (err) throw new Error("I couldn't get that change to work, so nothing was changed. Try asking in a different way.");
      }
      return { reply: reply || "Done.", files, changed: JSON.stringify(files) !== before, cost: 0 };
    }
    throw new Error("That took too many steps, so I stopped and changed nothing. Try a smaller request.");
  }

  /** One user request → tool loop → (maybe) a new version. */
  async function runAgent(request, history, log) {
    await window.__cfClaudeP;
    const model = pickModel();
    if (!model) throw new Error("NO_KEY");
    if (model.kind === "sample") return runAgentSample(request, history, log);
    const files = structuredClone(window.__cfActive.files);
    const before = JSON.stringify(files);
    const system = systemPrompt(files);
    const messages = [
      ...history.filter((m) => m.role === "user" || m.role === "assistant").slice(-8).map((m) => ({ role: m.role, content: m.text })),
      { role: "user", content: request },
    ];
    // Anthropic requires alternating roles starting with user
    while (messages.length && messages[0].role !== "user") messages.shift();
    for (let i = 1; i < messages.length; i++) if (messages[i].role === messages[i - 1].role) messages.splice(i - 1, 1), i--;
    let cost = 0;
    let reply = "";
    let fixes = 0;
    for (let step = 0; step < 30; step++) {
      const r = await model.call(system, messages);
      cost += r.cost || 0;
      messages.push({ role: "assistant", content: r.content });
      const text = r.content.filter((c) => c.type === "text").map((c) => c.text).join("\n").trim();
      if (text) reply = text;
      const calls = r.content.filter((c) => c.type === "tool_use");
      if (calls.length) {
        messages.push({ role: "user", content: calls.map((c) => ({ type: "tool_result", tool_use_id: c.id, content: String(runTool(files, c.name, c.input, log)) })) });
        continue;
      }
      // finished: check the change compiles before keeping it
      if (JSON.stringify(files) !== before) {
        const err = syntaxError(files);
        if (err && fixes < 3) {
          fixes++;
          log("Fixing a mistake in the change");
          messages.push({ role: "user", content: `Your change has a syntax error, so it can't run: ${err}. Fix it with edit_file, then reply with the summary again.` });
          continue;
        }
        if (err) throw new Error("I couldn't get that change to work, so nothing was changed. Try asking in a different way.");
      }
      return { reply: reply || "Done.", files, changed: JSON.stringify(files) !== before, cost };
    }
    throw new Error("That took too many steps, so I stopped and changed nothing. Try a smaller request.");
  }

  // ---------------------------------------------------------------- chat UI
  const SUGGEST = [
    "Add a button to download a project's scripts as a text file",
    "Make the GENERATE VIDEOS button green",
    "Remove the language option",
    "Something's broken: the projects page shows an error",

  function Shell() {
    const [open, setOpen] = useState(false);
    const [chat, setChat] = useState([]);
    const [text, setText] = useState("");
    const [busy, setBusy] = useState(false);
    const [activity, setActivity] = useState([]);
    const [notice, setNotice] = useState(null);
    const [hist, setHist] = useState(null);
    const end = useRef();
    const refresh = async () => setChat(await getChat());
    useEffect(() => {
      (async () => {
        await refresh();

        if (n) {
          setNotice(n);
          await meta.set("notice", null);

        if (await meta.get("reopen")) {
          setOpen(true);
          await meta.set("reopen", false);
        }
      })();
    }, []);
    useEffect(() => end.current?.scrollIntoView({ block: "end" }), [chat, activity, open]);

    async function send(msg) {
      msg = (msg ?? text).trim();
      if (!msg || busy) return;
      setText("");
      setBusy(true);
      setActivity([]);
      const history = await getChat();
      await addChat({ role: "user", text: msg });
      await refresh();

        const out = await runAgent(msg, history, (a) => setActivity((x) => [...x, a]));
        const costNote = out.cost ? ` (cost about $${out.cost.toFixed(out.cost < 0.01 ? 3 : 2)})` : "";
        if (out.changed) {
          await saveVersion(out.files, out.reply);
          await addChat({ role: "assistant", text: out.reply, changed: true, costNote });
          await meta.set("reopen", true);
          setActivity((x) => [...x, "Reloading to show the change…"]);
          setTimeout(reloadApp, 700);
          return;
        }
        await addChat({ role: "assistant", text: out.reply, costNote });
      } catch (e) {
        if (e.message === "NO_KEY")
          await addChat({
            role: "system",
            text: window.__cfClaude.inClaude
              ? "I can't reach your Claude account from this page right now. Reload it and press Allow when Claude asks."
              : "To change the app I need an AI: add an Anthropic, OpenAI or Gemini key on the Connect AI page (or open the app inside Claude to use your Claude account), then ask again.",
            action: window.__cfClaude.inClaude ? null : "connect",
          });
        else await addChat({ role: "system", text: e.message || String(e) });
      }
      setBusy(false);
      setActivity([]);
      await refresh();
    }
    async function undo() {
      const cur = window.__cfActive;
      if (!cur.id) return;
      const v = await versions.get(cur.id);
      activate(v?.parentId || null, `Undid: “${(v?.note || "last change").slice(0, 80)}”`);
    }
    const isChanged = !!window.__cfActive?.id;

    return html`
      ${!open && html`<button class="cfs-fab" onClick=${() => setOpen(true)} title="Fix, add or remove features by chatting">🛠 <span>Change the app</span></button>`}
      ${notice && !open && html`<div class=${"cfs-notice " + notice.kind} onClick=${() => (setOpen(true), setNotice(null))}>${notice.text}</div>`}
      ${open && html`<aside class="cfs-panel">
        <header class="cfs-head">
          <div><b>🛠 Change the app</b><div class="cfs-sub">${isChanged ? "Running your changed version" : "Running the original version"}</div></div>
          <div class="cfs-actions">
            ${isChanged && html`<button class="cfs-btn" onClick=${undo} disabled=${busy} title="Go back to before the last change">↶ Undo</button>`}
            <button class="cfs-btn" onClick=${async () => setHist(await versions.all())} disabled=${busy}>History</button>
            <button class="cfs-btn" onClick=${() => setOpen(false)} title="Close">✕</button>
          </div>
        </header>
        ${notice && html`<div class=${"cfs-banner " + notice.kind}>${notice.text}</div>`}
        <div class="cfs-msgs">
          ${!chat.length && html`<div class="cfs-empty">
            <p>Tell me what to <b>fix, add or remove</b> and I'll change the app for you. It reloads by itself to show the change, and your projects are kept.</p>
            <p class="cfs-dim">If a change goes wrong, press <b>↶ Undo</b>. If it breaks the app, I undo it automatically.</p>
            ${SUGGEST.map((s) => html`<button class="cfs-chip" onClick=${() => send(s)}>${s}</button>`)}
          </div>`}
          ${chat.map((m) => html`<div class=${"cfs-msg " + m.role}>
            ${m.text}${m.changed && html`<div class="cfs-tag">✓ Changed${m.costNote || ""}</div>`}${!m.changed && m.costNote && html`<div class="cfs-tag">${m.costNote.trim()}</div>`}
            ${m.action === "connect" && html`<div><button class="cfs-btn primary" onClick=${() => { window.__cfGo?.("connect"); setOpen(false); }}>🔌 Open Connect AI</button></div>`}
          </div>`)}
          ${busy && html`<div class="cfs-msg assistant cfs-working"><span class="cfs-spin">◐</span> Working on it…
            ${activity.map((a) => html`<div class="cfs-act">${a}</div>`)}</div>`}
          <div ref=${end}></div>
        </div>
        <form class="cfs-input" onSubmit=${(e) => (e.preventDefault(), send())}>
          <textarea value=${text} placeholder="e.g. add a button that copies all scripts" onInput=${(e) => setText(e.target.value)}
            onKeyDown=${(e) => e.key === "Enter" && !e.shiftKey && (e.preventDefault(), send())} disabled=${busy} rows="2"></textarea>
          <button class="cfs-btn primary" type="submit" disabled=${busy || !text.trim()}>Send</button>
        </form>
        ${hist && html`<div class="cfs-overlay" onClick=${() => setHist(null)}><div class="cfs-modal" onClick=${(e) => e.stopPropagation()}>
          <h3>Versions</h3>
          <div class="cfs-vlist">
            ${hist.map((v) => html`<div class=${"cfs-v" + (v.id === window.__cfActive.id ? " on" : "")}>
              <div><div>${v.note}</div><div class="cfs-dim">${new Date(v.createdAt).toLocaleString()}${v.broken ? " · ⚠️ broke the app" : ""}${v.baseBuiltAt !== BUILTIN.builtAt ? " · from an older copy" : ""}</div></div>
              ${v.id === window.__cfActive.id ? html`<span class="cfs-dim">in use</span>` : v.broken ? html`<span class="cfs-dim">can't use</span>` : html`<button class="cfs-btn" onClick=${() => activate(v.id, `Switched to: “${v.note.slice(0, 80)}”`)}>Use this</button>`}
            </div>`)}
            <div class=${"cfs-v" + (!window.__cfActive.id ? " on" : "")}><div><div>Original version</div><div class="cfs-dim">As the file came</div></div>
              ${!window.__cfActive.id ? html`<span class="cfs-dim">in use</span>` : html`<button class="cfs-btn" onClick=${() => activate(null, "Switched back to the original version.")}>Use this</button>`}</div>
          </div>
          <p class="cfs-dim">Changes live in this browser. To keep them, or open them somewhere else, download this version as a file.</p>
          <div class="cfs-row"><button class="cfs-btn primary" onClick=${() => download(`Content Factory${isChanged ? " (changed)" : ""}.html`, exportHtml())}>⬇ Download this version</button>
            <button class="cfs-btn" onClick=${() => setHist(null)}>Close</button></div>
        </div></div>`}
      </aside>`}`;
  }

  // ---------------------------------------------------------------- start
  render(html`<${Shell} />`, document.getElementById("cf-shell"));
  boot();
})();
</script>
</body>
</html>
